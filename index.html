// Convert VAPID base64url key → Uint8Array (required by pushManager.subscribe)
function _vapidKeyToUint8(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

// Subscribe this device to Web Push and store the subscription in Supabase
// so the Edge Function can reach it later.
async function registerPushSubscription(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window))return;
  if(VAPID_PUBLIC_KEY==='YOUR_VAPID_PUBLIC_KEY_HERE')return; // not configured yet
  try{
    const reg=await navigator.serviceWorker.ready;
    // Re-use existing subscription if already subscribed
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:_vapidKeyToUint8(VAPID_PUBLIC_KEY)
      });
    }
    if(!sub||!currentUser)return;
    // Persist subscription endpoint + keys to Supabase push_subscriptions table
    const uid=getUid();

      user_id:uid,
      endpoint:sub.endpoint,
      p256dh:btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))),
      auth:btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))),
      updated_at:new Date().toISOString()
    };

  if(document.startViewTransition){

    document.documentElement.style.setProperty('--vt-x',x+'px');
    document.documentElement.style.setProperty('--vt-y',y+'px');
    document.documentElement.classList.add('theme-switching');
    const tr=document.startViewTransition(inner);
    tr.finished.finally(()=>document.documentElement.classList.remove('theme-switching'));
  } else inner();
}

// When the menu is open, tapping the shrunk main-wrap closes it.
function _mainWrapTap(ev){
  // Walk up from ev.target to check for .hamb — handles SVG child elements in Capacitor WebView
  let el=ev.target;
  while(el && el!==document.body){
    if(el.classList && el.classList.contains('hamb'))return;
    el=el.parentElement;
  }
  const sh=document.getElementById('shell');
  if(!sh.classList.contains('menu-open'))return;
  ev.preventDefault();ev.stopPropagation();
  toggleMenu(false);
}

// Swipe-to-close drawer: swipe left on BOTTOM HALF of screen only
(function(){
  let sx=0,sy=0,startTime=0,fromBottomHalf=false;
  document.addEventListener('touchstart',e=>{
    const sh=document.getElementById('shell');
    if(!sh||!sh.classList.contains('menu-open'))return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;startTime=Date.now();
    const vh=window.innerHeight||document.documentElement.clientHeight;
    fromBottomHalf=sy>=vh*0.5;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    const sh=document.getElementById('shell');
    if(!sh||!sh.classList.contains('menu-open'))return;
    if(!fromBottomHalf)return;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    const dt=Date.now()-startTime;
    // Left swipe: dx<-50, mostly horizontal (abs(dx)>abs(dy)*1.3), fast enough
    if(dx<-50 && Math.abs(dx)>Math.abs(dy)*1.3 && dt<400){
      toggleMenu(false);
    }
    fromBottomHalf=false;
  },{passive:true});
})();
// Single source of truth for nav-item clicks (sidebar AND mobile drawer share
// this markup). Previously each nav-item ALSO had an inline onclick="setTab(...)"
// which fired independently of this delegated listener, so a single tap ran
// setTab() 2-3 times (double render + double/triple vibration + visible flicker).
// Nav items now carry only a data-tab attribute — this is the only place that
// calls setTab() for them.
document.addEventListener('click',e=>{
  const ni=e.target.closest('.nav-item');
  if(!ni)return;
  const tab=ni.dataset.tab;
  if(!tab)return;
  e.preventDefault();
  if(document.body.classList.contains('app-mode')){
    const sh=document.getElementById('shell');
    if(sh && sh.classList.contains('menu-open')){
      // Let the drawer's own close animation finish (420ms) before switching
      // tabs, so the page-flip view-transition doesn't run mid-animation.
      toggleMenu(false);
      setTimeout(()=>setTab(tab,{silent:true}),420);
      return;
    }
  }
  setTab(tab);
});

function addExpFromSheet(){
  const raw=$('s-cat').value,amt=parseFloat($('s-amt').value),date=$('s-date').value,note=$('s-note').value.trim();
  if(!raw||!amt||amt<=0||!date){[$('s-amt'),$('s-date')].forEach(el=>{el.classList.add('err');setTimeout(()=>el.classList.remove('err'),900);});hapticError();return;}
  const[catId,subId]=raw.includes('|')?raw.split('|'):[raw,null];
  const d=new Date(date+'T00:00:00');
  const cc=!!($('s-cc')&&$('s-cc').checked);
  const splitOn=!!(cc && $('s-split-toggle') && $('s-split-toggle').checked);

  if(splitOn){
    // EMI-style: spread (amt + interest) across N months as N separate CC charges
    const months=Math.max(2,Math.min(60,parseInt($('s-split-months').value)||3));
    const interestRate=parseFloat($('s-split-interest').value)||0; // annual %, optional
    const total=amt*(1+(interestRate/100)*(months/12));
    const per=Math.round(total/months*100)/100;
    const groupId='sp_'+Date.now().toString(36);
    for(let i=0;i<months;i++){
      const dd=new Date(d);dd.setMonth(dd.getMonth()+i);
      const y2=dd.getFullYear(),m2=dd.getMonth();
      const dayStr=dd.toISOString().split('T')[0];
      state.exps.push({
        id:++state.uid,
        catId,subId,
        amount:per,
        date:dayStr,
        note:`${note||getCat(catId).name} · EMI ${i+1}/${months}${interestRate?` @${interestRate}%`:''}`,
        paidWithCC:true,
        splitOf:groupId,
        splitTotal:amt,
        splitInterest:interestRate,
        splitIndex:i+1,
        splitMonths:months,
        mk:mk(y2,m2),
      });
    }
    curY=d.getFullYear();curM=d.getMonth();
    save();closeSheet();hapticDone();
    showToast(`Split ${fmt(amt)} into ${months}×${fmt(per)} ✓`,'check');
    checkBudgetNotifications();render();
    return;
  }

  state.exps.push({id:++state.uid,catId,subId,amount:amt,date,note,paidWithCC:cc,mk:mk(d.getFullYear(),d.getMonth())});
  curY=d.getFullYear();curM=d.getMonth();
  save();closeSheet();
  hapticDone(); showToast('Expense saved ✓');
  checkBudgetNotifications();
  render();
}

function _closeCdlg(){$('cdlg-bg').classList.remove('on');$('cdlg-box').innerHTML='';}
function confirmAsync(msg,opts={}){
  return new Promise(resolve=>{
    const danger=opts.danger||false;
    const okText=opts.okText||'OK';
    const cancelText=opts.cancelText||'Cancel';
    $('cdlg-box').innerHTML=`<div class="cdlg-title">${opts.title||'Confirm'}</div><div class="cdlg-msg">${msg}</div><div class="cdlg-btns"><button class="cdlg-cancel" id="cdlg-no">${cancelText}</button><button class="cdlg-ok${danger?' danger':''}" id="cdlg-yes">${okText}</button></div>`;
    $('cdlg-bg').classList.add('on');
    $('cdlg-yes').onclick=()=>{_closeCdlg();resolve(true);};
    $('cdlg-no').onclick=()=>{_closeCdlg();resolve(false);};
    $('cdlg-bg').onclick=e=>{if(e.target===$('cdlg-bg')){_closeCdlg();resolve(false);}};
  });
}
function promptAsync(label,defaultValue,opts={}){
  return new Promise(resolve=>{
    const isColor=opts.type==='color';
    if(isColor){
      const colors=['#a8e063','#f7a26a','#6ab0f7','#f7d06a','#b06af7','#f76aab','#6af7a2','#ffb347','#6ac8f7','#ff7a85','#6af7d8','#f76ace','#9b82ff','#aab0c8','#ff6b5e','#9c9c9c','#ff5e5e','#00e5ff','#ff7a4d','#ffffff','#000000'];
      $('cdlg-box').innerHTML=`<div class="cdlg-title">${opts.title||'Pick a colour'}</div><div class="cdlg-msg">${label}</div><div class="cdlg-color-row">${colors.map(c=>`<div class="cdlg-color-swatch${c===defaultValue?' picked':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div><div class="cdlg-color-custom"><input type="color" id="cdlg-cc" value="${defaultValue||'#a8e063'}"/><span>Custom</span></div><div class="cdlg-btns"><button class="cdlg-cancel" id="cdlg-no">Cancel</button><button class="cdlg-ok" id="cdlg-yes">Set</button></div>`;
      $('cdlg-bg').classList.add('on');
      let picked=defaultValue||null;
      $('cdlg-box').querySelectorAll('.cdlg-color-swatch').forEach(sw=>{
        sw.onclick=()=>{
          $('cdlg-box').querySelectorAll('.cdlg-color-swatch').forEach(s=>s.classList.remove('picked'));
          sw.classList.add('picked');picked=sw.dataset.c;
          $('cdlg-cc').value=picked;
        };
      });
      $('cdlg-cc').oninput=()=>{picked=$('cdlg-cc').value;$('cdlg-box').querySelectorAll('.cdlg-color-swatch').forEach(s=>s.classList.remove('picked'));};
      $('cdlg-yes').onclick=()=>{_closeCdlg();resolve(picked);};
      $('cdlg-no').onclick=()=>{_closeCdlg();resolve(null);};
      $('cdlg-bg').onclick=e=>{if(e.target===$('cdlg-bg')){_closeCdlg();resolve(null);}};
    } else {
      $('cdlg-box').innerHTML=`<div class="cdlg-title">${opts.title||'Input'}</div><div class="cdlg-msg">${label}</div><input class="cdlg-input" id="cdlg-inp" value="${(defaultValue||'').replace(/"/g,'&quot;')}"/><div class="cdlg-btns"><button class="cdlg-cancel" id="cdlg-no">Cancel</button><button class="cdlg-ok" id="cdlg-yes">${opts.okText||'OK'}</button></div>`;
      $('cdlg-bg').classList.add('on');
      setTimeout(()=>{const inp=$('cdlg-inp');if(inp){inp.focus();inp.select();}},100);
      $('cdlg-yes').onclick=()=>{const v=$('cdlg-inp').value.trim();_closeCdlg();resolve(v);};
      $('cdlg-no').onclick=()=>{_closeCdlg();resolve(null);};
      $('cdlg-bg').onclick=e=>{if(e.target===$('cdlg-bg')){_closeCdlg();resolve(null);}};
    }
  });
}

// ── Forgot password (OTP-based) ─────────────────────────────────────────
// Step 1: user enters their email, we call resetPasswordForEmail() which
// sends Supabase's "Reset Password" email — configure that template in the
// Supabase dashboard to include {{ .Token }} so it contains a 6-digit code,
// not just a link. Step 2: user enters that code + a new password; we
// verifyOtp() (type:'recovery') to authenticate them, then updateUser() to
// actually set the new password. No link-click needed.
function openForgotPassword(){
  const prefill=document.getElementById('a-email')?.value.trim()||'';
  _fpRenderStep1(prefill);
}
function _fpRenderStep1(prefill){
  $('cdlg-box').innerHTML=`
    <div class="cdlg-title">Reset your password</div>
    <div class="cdlg-msg">Enter the email on your account. We'll send you a code to reset your password — no link to click, just type it in here.</div>
    <input class="cdlg-input" id="fp-email" type="email" placeholder="you@email.com" value="${(prefill||'').replace(/"/g,'&quot;')}" autocomplete="email"/>
    <div class="cdlg-msg" id="fp-err" style="display:none;color:var(--danger);margin:10px 0 0"></div>
    <div class="cdlg-btns"><button class="cdlg-cancel" id="fp-cancel">Cancel</button><button class="cdlg-ok" id="fp-send">Send code</button></div>`;
  $('cdlg-bg').classList.add('on');
  setTimeout(()=>{const inp=$('fp-email');if(inp){inp.focus();if(prefill)inp.select();}},100);
  $('fp-cancel').onclick=()=>_closeCdlg();
  $('fp-email').onkeydown=e=>{if(e.key==='Enter')$('fp-send').click();};
  $('fp-send').onclick=async()=>{
    const email=$('fp-email').value.trim();
    const err=$('fp-err');err.style.display='none';
    if(!email){err.textContent='Enter your email first.';err.style.display='';return;}
    const btn=$('fp-send');btn.disabled=true;btn.textContent='Sending…';
    try{
      const{error}=await sb.auth.resetPasswordForEmail(email);
      if(error)throw error;
      hapticDone();
      _fpRenderStep2(email);
    }catch(e){
      hapticError();
      err.textContent=e.message||'Could not send the code. Try again.';err.style.display='';
      btn.disabled=false;btn.textContent='Send code';
    }
  };
}
function _fpRenderStep2(email){
  $('cdlg-box').innerHTML=`
    <div class="cdlg-title">Enter the code</div>
    <div class="cdlg-msg">We sent a code to <b>${email}</b>. Enter it below with your new password.</div>
    <input class="cdlg-input" id="fp-otp" inputmode="numeric" maxlength="8" placeholder="Code from email" style="text-align:center;letter-spacing:6px;font-family:'JetBrains Mono',monospace"/>
    <input class="cdlg-input" id="fp-newpass" type="password" placeholder="New password (min 6 chars)" style="margin-top:10px" autocomplete="new-password"/>
    <input class="cdlg-input" id="fp-newpass2" type="password" placeholder="Confirm new password" style="margin-top:10px" autocomplete="new-password"/>
    <div class="cdlg-msg" id="fp-err2" style="display:none;color:var(--danger);margin:10px 0 0"></div>
    <div class="cdlg-btns"><button class="cdlg-cancel" id="fp-back">Back</button><button class="cdlg-ok" id="fp-reset">Reset password</button></div>
    <div style="text-align:center;margin-top:12px"><button type="button" class="auth-toggle-btn" id="fp-resend" style="font-size:12px">Resend code</button></div>`;
  $('cdlg-bg').classList.add('on');
  setTimeout(()=>{const inp=$('fp-otp');if(inp)inp.focus();},100);
  $('fp-back').onclick=()=>_fpRenderStep1(email);
  $('fp-resend').onclick=async()=>{
    const btn=$('fp-resend');btn.disabled=true;btn.textContent='Sending…';
    try{await sb.auth.resetPasswordForEmail(email);showToast('Code resent ✓','check');}
    catch(e){showToast('Could not resend','x');}
    btn.disabled=false;btn.textContent='Resend code';
  };
  $('fp-reset').onclick=async()=>{
    const otp=$('fp-otp').value.trim();
    const p1=$('fp-newpass').value, p2=$('fp-newpass2').value;
    const err=$('fp-err2');err.style.display='none';
    if(otp.length<6||otp.length>8){err.textContent='Enter the code from your email.';err.style.display='';return;}
    if(p1.length<6){err.textContent='New password must be at least 6 characters.';err.style.display='';return;}
    if(p1!==p2){err.textContent="Passwords don't match.";err.style.display='';return;}
    const btn=$('fp-reset');btn.disabled=true;btn.textContent='Resetting…';
    try{
      const{error:vErr}=await sb.auth.verifyOtp({email,token:otp,type:'recovery'});
      if(vErr)throw vErr;
      const{error:uErr}=await sb.auth.updateUser({password:p1});
      if(uErr)throw uErr;
      hapticDone();_closeCdlg();showToast('Password reset ✓ You\'re signed in','check');
    }catch(e){
      hapticError();
      const isCurPassIssue=/current[_ ]password/i.test(e.message||'');
      err.textContent=isCurPassIssue
        ? "Your Supabase project is set to require the current password even on recovery — turn off 'Require current password when updating' in Authentication → Email settings, or reset from Settings while logged in instead."
        : (e.message||'That code is wrong or expired.');
      err.style.display='';
      btn.disabled=false;btn.textContent='Reset password';
    }
  };
}

// ── Change password (from Settings, requires current password) ─────────
function openChangePassword(){
  $('cdlg-box').innerHTML=`
    <div class="cdlg-title">Change password</div>
    <div class="cdlg-msg">Enter your current password and choose a new one.</div>
    <input class="cdlg-input" id="cp-old" type="password" placeholder="Current password" autocomplete="current-password"/>
    <input class="cdlg-input" id="cp-new" type="password" placeholder="New password (min 6 chars)" style="margin-top:10px" autocomplete="new-password"/>
    <input class="cdlg-input" id="cp-new2" type="password" placeholder="Confirm new password" style="margin-top:10px" autocomplete="new-password"/>
    <div class="cdlg-msg" id="cp-err" style="display:none;color:var(--danger);margin:10px 0 0"></div>
    <div class="cdlg-btns"><button class="cdlg-cancel" id="cp-cancel">Cancel</button><button class="cdlg-ok" id="cp-save">Update password</button></div>`;
  $('cdlg-bg').classList.add('on');
  setTimeout(()=>{const inp=$('cp-old');if(inp)inp.focus();},100);
  $('cp-cancel').onclick=()=>_closeCdlg();
  $('cp-save').onclick=async()=>{
    const oldPass=$('cp-old').value, p1=$('cp-new').value, p2=$('cp-new2').value;
    const err=$('cp-err');err.style.display='none';
    const email=currentUser?.email;
    if(!oldPass){err.textContent='Enter your current password.';err.style.display='';return;}
    if(p1.length<6){err.textContent='New password must be at least 6 characters.';err.style.display='';return;}
    if(p1!==p2){err.textContent="Passwords don't match.";err.style.display='';return;}
    if(p1===oldPass){err.textContent='New password must be different from the current one.';err.style.display='';return;}
    const btn=$('cp-save');btn.disabled=true;btn.textContent='Checking…';
    try{
      // Reauthenticate with the current password first — refreshes the
      // session so it counts as "recently logged in" (satisfies your
      // Secure password change setting), and gives a clean "wrong password"
      // error before we even try the update.
      const{error:sErr}=await sb.auth.signInWithPassword({email,password:oldPass});
      if(sErr)throw new Error('Current password is incorrect.');
      btn.textContent='Updating…';
      // current_password is required here because "Require current password
      // when updating" is turned on in your Supabase Auth settings — without
      // it, updateUser() rejects the request even with a fresh session.
      const{error:uErr}=await sb.auth.updateUser({password:p1,current_password:oldPass});
      if(uErr)throw uErr;
      hapticDone();_closeCdlg();showToast('Password updated ✓','check');
    }catch(e){
      hapticError();
      err.textContent=e.message||'Could not update your password.';err.style.display='';
      btn.disabled=false;btn.textContent='Update password';
    }
  };
}

const TAB_ORDER=['dash','txn','an','sav','bud','emi']; // Settings kept separate — not in swipe ring
let touchStart=null, touchMoved=null, ptrPulling=false, swipeBlocked=false;
let _gesturesAttached=false;

function attachGestures(){
  const scroll=document.getElementById('mainScroll');
  const ptr=document.getElementById('ptr');
  if(!scroll||!ptr||_gesturesAttached)return;
  _gesturesAttached=true;

  function onTouchStart(e){
    if(!document.body.classList.contains('app-mode'))return;
    if(e.touches.length!==1)return;
    if(document.getElementById('sheet')?.classList.contains('on'))return;
    if(document.getElementById('shell').classList.contains('menu-open'))return;
    if(document.querySelector('.cdlg-bg.on'))return;
    const t=e.touches[0];
    const vh=window.innerHeight||document.documentElement.clientHeight;
    // Block TAB swipe from top half — PTR is still allowed from anywhere when at top.
    // Also block it entirely inside elements marked .no-tab-swipe (e.g. the Savings
    // chart and horizontally-scrollable table), no matter where on screen they sit,
    // so scrolling/panning those doesn't accidentally flip to the next tab.
    const exemptZone = e.target.closest && e.target.closest('.no-tab-swipe');
    swipeBlocked = exemptZone ? true : (t.clientY < vh*0.5);
    touchStart={x:t.clientX,y:t.clientY,t:Date.now(),scrollTop:scroll.scrollTop};
    touchMoved=null;ptrPulling=false;
  }

  function onTouchMove(e){
    if(!touchStart)return;
    if(activeTab==='set'||activeTab==='cat'||activeTab==='cur')return;
    const t=e.touches[0];
    const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    touchMoved={dx,dy};
    // Pull-to-refresh: at scroll top, dragging down, mostly vertical
    if(touchStart.scrollTop<=2 && dy>8 && Math.abs(dy)>Math.abs(dx)*0.8){
      ptrPulling=true;
      const pull=Math.min(80,dy*0.55);
      ptr.style.transform=`translate(-50%, ${pull-10}px)`;
      ptr.classList.toggle('show',pull>12);
      if(pull>60)ptr.classList.add('spin'); else ptr.classList.remove('spin');
    }
  }

  function onTouchEnd(){
    if(!touchStart){return;}
    const moved=touchMoved||{dx:0,dy:0};
    const{dx,dy}=moved;
    const dt=Date.now()-touchStart.t;

    if(ptrPulling){
      // Trigger refresh if pulled far enough (real dy > 80px)
      if(dy>80){
        ptr.classList.add('spin','show');
        ptr.style.transform='translate(-50%, 30px)';
        hapticDone();
        const done=()=>{
          showToast('Refreshed ✓','check');
          setTimeout(()=>{
            ptr.style.transform='translate(-50%,-120%)';
            ptr.classList.remove('show','spin');
          },500);
        };
        if(currentUser && currentUser.id!=='demo-local'){
          refreshFromSupabase().finally(done);
        } else {
          setSyncStatus('ok','Demo · refreshed');
          render();
          done();
        }
      } else {
        ptr.style.transform='translate(-50%,-120%)';
        ptr.classList.remove('show','spin');
      }
    }
    // Horizontal tab swipe — only from bottom half, fast enough, clearly horizontal
    else if(!swipeBlocked && Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.8 && dt<450){
      const idx=TAB_ORDER.indexOf(activeTab);
      if(idx>=0){
        const next=dx<0 ? Math.min(TAB_ORDER.length-1,idx+1) : Math.max(0,idx-1);
        if(next!==idx){ hapticSwipe(); setTab(TAB_ORDER[next]); }
      }
    }
    touchStart=null;touchMoved=null;ptrPulling=false;swipeBlocked=false;
  }

  scroll.addEventListener('touchstart', onTouchStart, {passive:true});
  scroll.addEventListener('touchmove',  onTouchMove,  {passive:true});
  scroll.addEventListener('touchend',   onTouchEnd,   {passive:true});
}
// Run after shell is in DOM — short delay to ensure mainScroll exists
setTimeout(attachGestures, 400);

let currentUser=null,isSignUp=false,rtChannel=null;
const getUid=()=>currentUser?.id||'anon';
const getDisplayName=()=>currentUser?.user_metadata?.name||currentUser?.email?.split('@')[0]||'User';
const getInitial=()=>getDisplayName().charAt(0).toUpperCase();

async function editDisplayName(){
  const cur=getDisplayName();
  const next=await promptAsync('Update your display name',cur,{title:'Edit name',okText:'Save',maxLength:40});
  if(!next||next===cur)return;
  const name=next.trim();
  if(!name){showToast('Name cannot be empty','x');hapticError();return;}
  try{
    if(currentUser && currentUser.id!=='demo-local' && typeof sb!=='undefined'){
      const{error}=await sb.auth.updateUser({data:{name}});
      if(error)throw error;
    }
    currentUser=currentUser||{};
    currentUser.user_metadata=Object.assign({},currentUser.user_metadata,{name});
    document.getElementById('sb-nm').textContent=name;
    const el=document.getElementById('acct-name');if(el)el.textContent=name;
    const av=document.querySelector('.acct-avatar');if(av)av.textContent=name.charAt(0).toUpperCase();
    hapticDone();showToast('Name updated ✓','check');
  }catch(e){
    console.warn('Could not persist name to Supabase:',e);
    showToast('Saved locally only','x');
  }
}

function toggleMode(){
  isSignUp=!isSignUp;
  const nw=document.getElementById('auth-name-wrap');
  nw.classList.toggle('show',isSignUp);
  document.getElementById('a-heading').textContent=isSignUp?'Create account':'Welcome back';
  document.getElementById('a-subheading').textContent=isSignUp?'Start tracking — free, forever':'Sign in to continue tracking';
  document.getElementById('a-btn').querySelector('span').textContent=isSignUp?'Create Account':'Sign In';
  document.getElementById('a-tog-txt').textContent=isSignUp?'Already have an account?':"Don't have an account?";
  document.getElementById('a-tog-btn').textContent=isSignUp?'Sign In':'Sign Up';
  const fg=document.getElementById('a-forgot');if(fg)fg.style.display=isSignUp?'none':'';
  document.getElementById('a-msg').textContent='';
  document.getElementById('a-msg').className='auth-msg';
}
async function handleSubmit(){
  const email=document.getElementById('a-email').value.trim();
  const pass=document.getElementById('a-pass').value;
  const remember=document.getElementById('remember-me')?.checked!==false;
  const msg=document.getElementById('a-msg');
  msg.className='auth-msg';
  if(!email||!pass){msg.textContent='Please enter your email and password.';return;}
  if(pass.length<6){msg.textContent='Password must be at least 6 characters.';return;}
  const btn=document.getElementById('a-btn');
  btn.querySelector('span').textContent='Working…';btn.disabled=true;
  if(isSignUp){
    const name=document.getElementById('a-name')?.value.trim()||'';
    const{error}=await sb.auth.signUp({email,password:pass,options:{data:{name:name||email.split('@')[0]}}});
    if(error){msg.textContent=error.message;hapticError();}
    else{msg.className='auth-msg ok';msg.textContent='✓ Check your email to confirm, then sign in.';hapticDone();}
  }else{
    const{error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){msg.textContent=error.message==='Invalid login credentials'?'Wrong email or password.':error.message;hapticError();}
    else{
      // Persist only the email (never the password) — Google/browser password managers handle that
      try{
        if(remember)localStorage.setItem('tln_remember_email',email);
        else localStorage.removeItem('tln_remember_email');
      }catch(e){}
      hapticDone();
    }
  }
  btn.querySelector('span').textContent=isSignUp?'Create Account':'Sign In';btn.disabled=false;
}
async function doSignOut(){
  // Close the drawer first so the confirm dialog appears over a clean screen
  toggleMenu(false);
  if(!await confirmAsync('You can sign back in anytime — your data stays in sync.',{title:'Sign out',okText:'Sign out',cancelText:'Cancel'}))return;
  hapticTick();
  const isDemo=(currentUser?.id==='demo-local');
  // Tear down real-time channel
  if(rtChannel && typeof sb!=='undefined'){try{sb.removeChannel(rtChannel);}catch(e){}rtChannel=null;}
  // Reset all state
  state={exps:[],budgets:{},emis:[],salaries:{},otherIncome:[],uid:0,currency:'INR',theme:'noir',creditPaid:{},customCats:[],settings:{ccCutoffDay:0,notifEnabled:false},notifState:{},catOverrides:{},customSubs:{},notifLog:[]};
  [dChart,anChart,savChart].forEach(c=>{if(c){try{c.destroy();}catch(e){}}});
  dChart=anChart=savChart=null;
  currentUser=null;
  // Restore the real showLogin/save/startListener in case demo mode overrode them
  window.showLogin=function(){
    document.getElementById('auth-screen').classList.add('show');
    document.getElementById('shell').classList.remove('on');
  };
  window.save=function(){
    setSyncStatus('syncing','Saving…');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{
        const uid=getUid();
        const{error}=await sb.from('tracker').upsert(
          {id:uid,data:JSON.stringify({...state,curY,curM}),updated_at:new Date().toISOString()},
          {onConflict:'id'}
        );
        if(error)throw error;
        setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
        try{localStorage.setItem('et_'+uid,JSON.stringify({...state,curY,curM}));}catch(e){}
      }catch(e){
        setSyncStatus('err','Sync failed — saved locally');
        try{localStorage.setItem('et_'+getUid(),JSON.stringify({...state,curY,curM}));}catch(le){}
      }
    },800);
  };
  window.startListener=startListener;
  if(isDemo){showLogin();return;}
  try{
    await unregisterPushSubscription();
    await sb.auth.signOut();
    // onAuthStateChange fires showLogin — call explicitly as safety net
    showLogin();
  }catch(e){
    console.warn('signOut error:',e);
    showLogin();
  }
}
async function initAuth(){
  loadTheme();
  // Restore remembered email immediately so form appears pre-filled if we need to show it
  try{
    const saved=localStorage.getItem('tln_remember_email');
    if(saved){const el=document.getElementById('a-email');if(el)el.value=saved;const rm=document.getElementById('remember-me');if(rm)rm.checked=true;}
  }catch(e){}
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){currentUser=session.user;showApp();}
  else showLogin();
  // Once we've decided, fade the boot overlay out
  const boot=document.getElementById('app-boot');
  if(boot){boot.classList.add('hide');setTimeout(()=>boot.remove(),300);}
  sb.auth.onAuthStateChange((_,session)=>{
    if(session?.user){currentUser=session.user;showApp();}
    else{currentUser=null;showLogin();}
  });
}
function showApp(){
  document.getElementById('auth-screen').classList.remove('show');
  document.getElementById('shell').classList.add('on');
  document.getElementById('sb-av').textContent=getInitial();
  document.getElementById('sb-nm').textContent=getDisplayName();
  document.getElementById('sb-em').textContent=currentUser?.email||'';
  if(window.lucide)lucide.createIcons();
  startListener();
  // Re-subscribe push (no-op if already subscribed or VAPID not configured)
  if((state.settings||{}).notifEnabled) registerPushSubscription();
}
function showLogin(){
  document.getElementById('auth-screen').classList.add('show');
  document.getElementById('shell').classList.remove('on');
}

function enterDemo(){
  const y=todayLocal().getFullYear(), m=todayLocal().getMonth();

// Merge user-defined custom categories + overrides + custom subs into the effective cat list.
function allCats(){
  const overrides=state.catOverrides||{};
  const customSubs=state.customSubs||{};
  const apply=c=>{
    const ov=overrides[c.id]||{};
    const builtSubs=c.subs||[];
    const userSubs=customSubs[c.id]||[];
    const subs=[...builtSubs,...userSubs];
    return{
      ...c,
      name:ov.name||c.name,
      color:ov.color||c.color,
      subs:subs.length?subs:undefined,
      excludeFromBudget:ov.excludeFromBudget!==undefined?ov.excludeFromBudget:!!c.excludeFromBudget,
    };
  };
  const builtIns=CATS.map(apply);
  const custom=(state.customCats||[]).map(c=>apply({...c,custom:true}));
  return [...builtIns,...custom];
}

async function wipeAllData(){
  const step1=await confirmAsync('This permanently deletes every expense, income entry, budget, recurring/EMI charge, and custom category — on this device and in the cloud. Your sign-in, theme, and currency choice are kept. This cannot be undone.',{title:'Wipe all data?',danger:true,okText:'Continue',cancelText:'Cancel'});
  if(!step1)return;
  const typed=await promptAsync('Type WIPE (all caps) to confirm.','',{title:'Final confirmation',okText:'Wipe everything'});
  if(typed!=='WIPE'){showToast('Cancelled — nothing was deleted');return;}

  const uid=getUid();
  const wiped={exps:[],budgets:{},emis:[],salaries:{},otherIncome:[],uid:0,currency:state.currency,theme:state.theme,creditPaid:{},customCats:[],settings:Object.assign({},state.settings,{notifEnabled:false}),notifState:{},catOverrides:{},customSubs:{},notifLog:[]};
  const nowIst=(function(){try{return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));}catch(e){return new Date();}})();
  const wipeY=nowIst.getFullYear(), wipeM=nowIst.getMonth();

  // Close anything that might be holding a reference to a soon-to-be-deleted
  // item (an open bottom sheet, the drawer) before we swap the state out.
  try{closeSheet();}catch(e){}
  try{toggleMenu(false);}catch(e){}
  // Kill any pending debounced autosave of the OLD (pre-wipe) data — otherwise
  // it can fire *after* the wipe and silently re-upload the old numbers.
  clearTimeout(saveTimer);

  // Demo mode / not signed in — nothing lives in the cloud, just clear locally.
  if(uid==='anon'||currentUser?.id==='demo-local'){
    state=wiped;curY=wipeY;curM=wipeM;
    try{localStorage.removeItem('et_'+uid);localStorage.removeItem('et_demo');}catch(e){}
    hapticDone();showToast('All data wiped ✓','check');
    setTab('dash',{silent:true});
    return;
  }

  showToast('Wiping…');
  try{
    // Write the wipe straight to Supabase and WAIT for confirmation — this is
    // the fix. The old code called the debounced save() and immediately told
    // you it was done; if that background save failed (flaky connection,
    // Android cold-network hiccup, etc.) it failed silently and the untouched
    // row in Supabase would sync your old data straight back down — via the
    // realtime listener, or the next time the app loads.
    const{error}=await sb.from('tracker').upsert(
      {id:uid,data:JSON.stringify({...wiped,curY:wipeY,curM:wipeM}),updated_at:new Date().toISOString()},
      {onConflict:'id'}
    );
    if(error)throw error;
    state=wiped;curY=wipeY;curM=wipeM;
    try{localStorage.setItem('et_'+uid,JSON.stringify({...state,curY,curM}));}catch(e){}
    setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
    hapticDone();showToast('All data wiped ✓','check');
  }catch(e){
    console.warn('Wipe failed to sync to cloud:',e);
    hapticError();
    showToast('Wipe failed — check your connection and try again','x');
    return; // don't touch local state/UI — old data is still the truth until the cloud write succeeds
  }
  setTab('dash',{silent:true});
}

function getCarryover(toY,toM){
  const keys=Object.keys(state.salaries).filter(k=>state.salaries[k]>0).sort();
  if(!keys.length)return 0;
  const[sy0,sm0]=keys[0].split('-').map(Number);
  let y=sy0,m=sm0-1,carry=0,n=0;
  while(y*12+m<toY*12+toM&&n++<500){
    const mkey=mk(y,m);
    const sal=state.salaries[mkey]||0;
    const oi=state.otherIncome.filter(o=>o.mk===mkey).reduce((s,o)=>s+o.amount,0);
    // Only count expenses that actually left the wallet (exclude unpaid CC)
    const spent=allExps(mkey).filter(e=>!isCCUnpaid(e)).reduce((s,e)=>s+e.amount,0);
    carry+=sal+oi-spent;
    if(++m>11){m=0;y++;}
  }
  return carry;
}
function getEmiExps(mkey){
  const[ys,ms]=mkey.split('-').map(Number),mo=ms-1,ci=ys*12+mo;
  // If mkey is the real-world CURRENT month, a recurring charge whose due day
  // hasn't arrived yet shouldn't be deducted from the balance today — e.g. a
  // due-day-4 subscription shouldn't already show as spent on the 1st.
  // Past months and months already fully elapsed always include it (it happened);
  // future months (browsing ahead) show it as a forecast either way.
  const today=todayLocal(),realCi=today.getFullYear()*12+today.getMonth(),isRealCurrentMonth=(ci===realCi);
  return state.emis.filter(e=>{
    const si=e.sy*12+e.sm;
    if(ci<si||ci>=si+e.months)return false;
    if(isRealCurrentMonth&&e.day>today.getDate())return false;
    return true;
  }).map(e=>({
    id:'emi_'+e.id+'_'+mkey,catId:e.catId,subId:null,amount:e.amount,
    date:mkey+'-'+String(e.day).padStart(2,'0'),note:e.name,mk:mkey,isEmi:true
  }));
}
function allExps(mkey){return[...state.exps.filter(e=>e.mk===mkey),...getEmiExps(mkey)];}
function curExps(){return allExps(mk());}

// Cancelling a recurring entry should stop FUTURE billing only — any month that
// already happened (this month included, if today's date is past the due day)
// must keep showing its historical charge. So instead of always deleting the
// entry outright, we usually just cap its `months` so it stops generating
// virtual expenses going forward, while past months remain untouched.
function stopRecurringFromNow(e){
  const today=new Date();
  const ciNow=today.getFullYear()*12+today.getMonth();
  const si=e.sy*12+e.sm;
  if(ciNow<si)return null; // never billed yet — safe to fully delete
  const billedThisMonth=today.getDate()>=e.day;
  const lastIncluded=billedThisMonth?ciNow:ciNow-1; // keep this month only if already charged
  const newMonths=lastIncluded-si+1;
  return newMonths>0?newMonths:null; // null = nothing to keep, fully delete
}
async function delEmi(id){
  const e=state.emis.find(x=>x.id===id);if(!e)return;
  const isOngoing=e.months>=900;
  const msg=isOngoing?'Future charges will stop. Past months already billed stay in your history.':'This recurring entry will be permanently removed.';
  if(!await confirmAsync(msg,{title:'Remove recurring',danger:true,okText:'Remove',cancelText:'Cancel'}))return;
  const newMonths=stopRecurringFromNow(e);
  if(newMonths===null){state.emis=state.emis.filter(x=>x.id!==id);}
  else{e.months=newMonths;}
  save();hapticTick();render();
}

  document.querySelectorAll('.cat-card.sel').forEach(el=>el.classList.remove('sel'));

  if(card)card.classList.add('sel');
  openDrill(id);
}

function prevMkey(y,m){let pm=m-1,py=y;if(pm<0){pm=11;py--;}return mk(py,pm);}

// Normalise creditPaid entry for a month → always returns a number.
// Backward compat: boolean true means fully paid (resolves against total later).
function _ccPaidRaw(mkey){
  const v=(state.creditPaid||{})[mkey];
  if(v===true)return -1;           // sentinel: fully paid (legacy)
  if(typeof v==='number')return Math.max(0,v);
  return 0;
}
function _ccSetPaid(mkey,amt){
  state.creditPaid=state.creditPaid||{};
  state.creditPaid[mkey]=Math.max(0,Number(amt)||0);
  save();
}
function addCcPayment(mkey){
  // Legacy quick-pay path (fallback). Opens the richer allocator sheet instead.
  openCcPaymentAllocator(mkey);
}

function _ccpayUpdateTotal(){
  const boxes=document.querySelectorAll('#sheet-content input[type=checkbox][data-amt]');
  let total=0,picked=0;
  boxes.forEach(b=>{if(b.checked){total+=parseFloat(b.dataset.amt);picked++;}});
  const lbl=document.getElementById('ccp-total');
  if(lbl)lbl.textContent=fmt(total);
  const btn=document.getElementById('ccp-confirm');
  if(btn){btn.disabled=picked===0;btn.innerHTML=picked===0?'<i data-lucide="check" class="ic-sm"></i>Pay selected':`<i data-lucide="check" class="ic-sm"></i>Pay ${picked} item${picked===1?'':'s'}`;}
  if(window.lucide)lucide.createIcons();

}

function confirmCcPayment(mkey){
  const boxes=document.querySelectorAll('#sheet-content input[type=checkbox][data-amt]:checked');
  if(!boxes.length){showToast('Select at least one charge','x');hapticError();return;}
  let total=0;const ids=[];
  boxes.forEach(b=>{total+=parseFloat(b.dataset.amt);ids.push(parseInt(b.dataset.eid));});
  // Mark selected charges as ccPaid so they don't roll into next month
  ids.forEach(eid=>{
    const e=state.exps.find(x=>x.id===eid);
    if(e)e.ccPaid=true;
  });
  // Bump the paid counter
  const cur=_ccPaidRaw(mkey);const base=cur===-1?0:cur;
  _ccSetPaid(mkey,base+total);
  // Insert a single repayment expense in the current month tagged with the paid item ids
  const today=todayLocal().toISOString().split('T')[0];
  const[yy,mm]=mkey.split('-').map(Number);
  state.exps.push({
    id:++state.uid,
    catId:'misc',
    subId:null,
    amount:total,
    date:today,
    note:`CC payment · ${MOS3[(mm-1+11)%12]} bill (${ids.length} item${ids.length===1?'':'s'})`,
    ccPayment:true,
    ccPaidFor:ids,
    mk:mkey,
  });
  save();hapticDone();closeSheet();
  showToast(`Paid ${fmt(total)} ✓`,'check');
  render();
}

function _quickPayCc(mkey){
  promptAsync('Amount to pay (applied to oldest unpaid charges first):','',{title:'Custom payment',okText:'Pay'}).then(raw=>{
    if(!raw)return;
    const amt=parseFloat(raw);
    if(!amt||amt<=0){showToast('Invalid amount','x');hapticError();return;}
    const[yy,mm]=mkey.split('-').map(Number);
    const bill=getCreditBill(yy,mm-1);
    // FIFO-fill: walk oldest→newest, mark as ccPaid until amt exhausted
    const sorted=bill.charges.slice().sort((a,b)=>a.date.localeCompare(b.date));
    let left=amt;
    for(const ch of sorted){
      if(left<=0)break;
      if(left>=ch.amount-0.001){
        const e=state.exps.find(x=>x.id===ch.id);if(e)e.ccPaid=true;
        left-=ch.amount;
      }
    }
    const cur=_ccPaidRaw(mkey);const base=cur===-1?0:cur;
    _ccSetPaid(mkey,base+amt);
    const today=todayLocal().toISOString().split('T')[0];
    state.exps.push({id:++state.uid,catId:'misc',subId:null,amount:amt,date:today,note:`CC payment · ${MOS3[(mm-1+11)%12]} bill`,ccPayment:true,mk:mkey});
    save();hapticDone();closeSheet();
    showToast(`Paid ${fmt(amt)} ✓`,'check');
    render();
  });
}
async function editCcPayment(mkey){
  const bill=getCreditBill(curY,curM);
  const cur=bill.paidAmount;
  const raw=await promptAsync(`Total bill: ${fmt(bill.total)}\nSet amount you have paid so far:`,String(cur),{title:'Edit payment'});
  if(raw===null)return;
  const amt=parseFloat(raw);
  if(isNaN(amt)||amt<0){showToast('Invalid amount','x');return;}
  _ccSetPaid(mkey,amt);hapticTick();showToast('Updated ✓','check');render();}
async function resetCcPayment(mkey){if(!await confirmAsync('Mark this entire bill as unpaid?',{title:'Reset payment',danger:true,okText:'Reset',cancelText:'Cancel'}))return;
  _ccSetPaid(mkey,0);
  hapticTick();showToast('Reset');render();
}

// Credit card bill for current month.
// Default: sums last month's CC-flagged charges (catId==='credit' OR paidWithCC===true).
// If settings.ccCutoffDay is set (1-28), uses a statement cut-off window:
//   charges from (prev_cutoff + 1) through (this_cutoff) inclusive.
function getCreditBill(y,m){
  const cut=parseInt((state.settings||{}).ccCutoffDay)||0;
  // A charge that goes on the credit-card bill:
  //  • catId 'credit' OR paidWithCC===true
  //  • NOT a repayment (ccPayment:true)
  //  • NOT already marked paid-in-month (ccPaid:true)
  const isCC=e=>(e.catId==='credit'||e.paidWithCC===true)&&!e.ccPayment&&!e.ccPaid&&!e.prepaid;
  let charges,sourceMkey;
  if(cut>=1&&cut<=28){
    const pm=prevMkey(y,m);
    const startDate=mkFromParts(...pm.split('-').map(Number))+'-'+String(cut+1).padStart(2,'0');
    const endDate=y+'-'+String(m+1).padStart(2,'0')+'-'+String(cut).padStart(2,'0');
    charges=[...allExps(pm),...allExps(mk(y,m))].filter(e=>isCC(e)&&e.date>=startDate&&e.date<=endDate);
    sourceMkey=pm+' · cut-off day '+cut;
  } else {
    const pm=prevMkey(y,m);
    charges=allExps(pm).filter(isCC);
    sourceMkey=pm;
  }
  const total=charges.reduce((s,e)=>s+e.amount,0);
  const key=mk(y,m);
  let raw=_ccPaidRaw(key);
  const paidAmount= raw===-1 ? total : Math.min(raw,total);
  const remaining=Math.max(0,total-paidAmount);
  const paid= total>0 && paidAmount>=total-0.001;
  return{total,charges,paid,paidAmount,remaining,sourceMkey,mkey:key};
}
// Helper: build 'YYYY-MM' from numeric y,m (1-indexed month here → convert)
function mkFromParts(y,m){return y+'-'+String(m).padStart(2,'0');}

// ════════════════════════════════════════════════════════
// NOTIFICATIONS (Level 1 · local, fires when app is open)
// ════════════════════════════════════════════════════════
// ── Notification capability detection ──────────────────────────────────────
// Three tiers:
//   'capacitor' — Capacitor APK / file:// WebView (no Web Notification API)
//                 → deliver via in-app toast banners (no OS permission needed)
//   'browser'   — Chrome/Firefox with Notification API available
//   'none'      — environment that genuinely doesn't support any alert channel
function _notifTier(){
  const isCapacitor=!!(window.Capacitor)||document.URL.startsWith('file://');
  if(isCapacitor)return'capacitor';
  if('Notification'in window&&typeof Notification.requestPermission==='function')return'browser';
  return'none';
}
function notifSupported(){return _notifTier()!=='none';}
function notifReady(){
  const t=_notifTier();
  if(t==='capacitor')return!!((state.settings||{}).notifEnabled);
  if(t==='browser')return Notification.permission==='granted'&&!!((state.settings||{}).notifEnabled);
  return false;
}
async function requestNotifPermission(){
  const t=_notifTier();
  if(t==='none'){showToast('Alerts not supported on this device','x');return false;}
  if(t==='capacitor'){
    // No OS permission needed — alerts delivered as in-app banners
    state.settings=state.settings||{};
    state.settings.notifEnabled=true;save();hapticTick();
    showToast('Budget alerts enabled ✓','check');
    return true;
  }
  // browser tier
  if(Notification.permission==='denied'){showToast('Enable notifications in your browser settings','x');return false;}
  if(Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted'){showToast('Permission denied','x');return false;}
  }
  state.settings=state.settings||{};
  state.settings.notifEnabled=true;save();hapticTick();
  showToast('Notifications enabled ✓','check');
  // Subscribe this device to Web Push so the Edge Function can reach it
  registerPushSubscription();
  return true;
}
function disableNotifs(){state.settings=state.settings||{};state.settings.notifEnabled=false;save();showToast('Alerts turned off');render();}
function setCcCutoff(val){
  const n=parseInt(val);
  state.settings=state.settings||{};
  state.settings.ccCutoffDay=(isNaN(n)||n<1||n>28)?0:n;
  save();hapticTick();
  showToast(state.settings.ccCutoffDay?`Cut-off set to day ${state.settings.ccCutoffDay}`:'Using calendar month','check');
  render();
}
async function resetNotifState(){if(!await confirmAsync('This will clear alert flags for the current month so they can fire again.',{title:'Reset alerts',danger:false,okText:'Reset',cancelText:'Cancel'}))return;
  const mkey=mk();
  state.notifState=state.notifState||{};
  delete state.notifState[mkey];
  save();hapticTick();showToast('Alert history cleared');render();
}

// Auto-prune notifState: keep only the last 2 months to avoid indefinite growth
function pruneNotifState(){
  if(!state.notifState||typeof state.notifState!=='object')return;
  const now=new Date();
  const keep=new Set();
  for(let i=0;i<2;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    keep.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  let pruned=false;
  Object.keys(state.notifState).forEach(k=>{if(!keep.has(k)){delete state.notifState[k];pruned=true;}});
  if(pruned)save();
}
function _logNotif(title,body,tag,meta){
  state.notifLog=state.notifLog||[];
  meta=meta||{};
  // Dedupe by tag — a tag firing twice (e.g. re-check on re-render) just
  // refreshes the timestamp/unread state rather than adding a duplicate row.
  if(tag){
    const existing=state.notifLog.find(n=>n.tag===tag);
    if(existing){ existing.ts=Date.now(); existing.read=false; save(); return; }
  }
  state.notifLog.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,body,tag:tag||null,kind:meta.kind||null,catId:meta.catId||null,mkey:meta.mkey||mk(),read:false,ts:Date.now()});
  if(state.notifLog.length>60)state.notifLog.length=60;
  save();
}
function _fireNotif(title,body,tag,meta){
  if(!notifReady())return false;
  _logNotif(title,body,tag,meta);
  // Capacitor APK — no Web Notification API, use a persistent in-app banner instead
  if(_notifTier()==='capacitor'){
    _showAlertBanner(title,body,tag);
    _updateNotifBadge();
    return true;
  }
  // Browser — real OS notification
  try{
    const n=new Notification(title,{body,tag:tag||'ledger-'+Date.now(),icon:'icons/icon-192.png',badge:'icons/icon-192.png',silent:false});
    n.onclick=()=>{window.focus();n.close();};
    _updateNotifBadge();
    return true;
  }catch(e){return false;}
}

// ── In-app alert banner (Capacitor fallback) ────────────────────────────────
// Shows ONE compact, tappable banner at a time (queued, not stacked) — tapping
// it opens the Notifications tab. This replaces the old version which stacked
// every alert as its own full card and got congested fast when several fired
// at once.
let _bannerSeenTags=[],_bannerQueue=[],_bannerShowing=false;
function _showAlertBanner(title,body,tag){
  if(tag&&_bannerSeenTags.includes(tag))return; // dedupe within this session
  if(tag)_bannerSeenTags.push(tag);
  _bannerQueue.push({title,body,tag});
  if(!_bannerShowing)_drainBannerQueue();
}
function _drainBannerQueue(){
  const next=_bannerQueue.shift();
  if(!next){ _bannerShowing=false; return; }
  _bannerShowing=true;
  const{title,body,tag}=next;
  const id='alrt-active';
  document.getElementById(id)?.remove();
  const wrap=document.createElement('div');
  wrap.id=id;
  wrap.onclick=()=>{ wrap.remove(); setTab('notif'); };
  wrap.style.cssText=`
    position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
    z-index:9999;background:var(--card);border:1px solid var(--border-strong);
    border-radius:14px;padding:11px 12px;cursor:pointer;
    box-shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.28);
    display:flex;align-items:center;gap:10px;
    animation:alertIn .3s cubic-bezier(.34,1.2,.44,1) both;
    font-family:'Geist',sans-serif;max-width:460px;margin:0 auto;
  `;
  wrap.innerHTML=`
    <div style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i data-lucide="bell" class="ic-sm" style="color:var(--accent)"></i></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:12.5px;font-weight:600;color:var(--text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${body}</div>
    </div>
    <button onclick="event.stopPropagation();document.getElementById('${id}')?.remove();_drainBannerQueue()" style="
      background:transparent;border:none;cursor:pointer;color:var(--dim);
      padding:4px;border-radius:6px;font-size:15px;line-height:1;flex-shrink:0;
    ">×</button>
  `;
  if(!document.getElementById('alert-kf')){
    const s=document.createElement('style');
    s.id='alert-kf';
    s.textContent='@keyframes alertIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(wrap);
  if(window.lucide)lucide.createIcons();
  hapticTick();
  setTimeout(()=>{
    if(!document.getElementById(id))return; // already dismissed manually
    wrap.style.transition='opacity .35s,transform .35s';
    wrap.style.opacity='0';wrap.style.transform='translateY(-8px)';
    setTimeout(()=>{ wrap.remove(); _drainBannerQueue(); },360);
  },3800);
}
function _updateNotifBadge(){
  const n=(state.notifLog||[]).filter(x=>!x.read).length;
  document.querySelectorAll('.notif-badge').forEach(el=>{
    el.textContent=n>9?'9+':String(n);
    el.style.display=n>0?'flex':'none';
  });
}
function _notifFlag(path,val){
  state.notifState=state.notifState||{};
  const parts=path.split('.');let cur=state.notifState;
  for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
  if(val===undefined)return cur[parts[parts.length-1]];
  cur[parts[parts.length-1]]=val;save();
}
// Three-stage budget alerts (50 / 80 / 100 %)
function checkBudgetNotifications(){
  if(!notifReady())return;
  const mkey=mk();
  const stages=[{k:'p50',pct:50,lbl:'Halfway'},{k:'p80',pct:80,lbl:'Heads-up'},{k:'p100',pct:100,lbl:'Over budget'}];
  Object.entries(state.budgets||{}).forEach(([catId,limit])=>{
    if(!limit||limit<=0)return;
    const spent=allExps(mkey).filter(e=>e.catId===catId).reduce((s,e)=>s+e.amount,0);
    const pct=(spent/limit)*100;
    const cat=getCat(catId);
    stages.forEach(st=>{
      const flag=_notifFlag(`${mkey}.budget.${catId}.${st.k}`);
      if(pct>=st.pct&&!flag){
        _notifFlag(`${mkey}.budget.${catId}.${st.k}`,true);
        const msg=st.pct===100
          ?`${cat.name} is over budget · ${fmt(spent)} / ${fmt(limit)}`
          :`${cat.name} at ${Math.round(pct)}% · ${fmt(spent)} / ${fmt(limit)}`;
        _fireNotif(st.lbl+' — '+cat.name,msg,'bud-'+catId+'-'+st.k+'-'+mkey,{kind:'budget',catId,mkey});
      }
    });
  });
}
// CC bill: (i) appears when new month rolls over (ii) reminder near cut-off / due
function checkCcNotifications(){
  if(!notifReady())return;
  const bill=getCreditBill(curY,curM);
  if(bill.total<=0)return;
  const mkey=bill.mkey;
  // Stage 1 — bill appeared (first time we see a non-zero bill this month)
  if(!_notifFlag(`${mkey}.cc.appear`)){
    _notifFlag(`${mkey}.cc.appear`,true);
    _fireNotif('Credit Card bill is ready',`${fmt(bill.total)} from last month · ${bill.charges.length} charge${bill.charges.length===1?'':'s'}`,'cc-appear-'+mkey,{kind:'cc',mkey});
  }
  // Stage 2 — near-due reminder (fires when we're within 5 days of the cut-off or month-end and bill is still unpaid)
  if(bill.remaining>0){
    const today=new Date();
    const cut=parseInt((state.settings||{}).ccCutoffDay)||0;
    const lastDay=din(curY,curM);
    const dueDay= cut>=1&&cut<=28 ? cut : lastDay;
    const daysLeft=dueDay - today.getDate();
    if(daysLeft>=0&&daysLeft<=5&&today.getFullYear()===curY&&today.getMonth()===curM){
      if(!_notifFlag(`${mkey}.cc.due`)){
        _notifFlag(`${mkey}.cc.due`,true);
        _fireNotif('Credit Card bill due soon',`${fmt(bill.remaining)} remaining · ${daysLeft===0?'due today':daysLeft+' day'+(daysLeft===1?'':'s')+' left'}`,'cc-due-'+mkey,{kind:'cc',mkey});
      }
    }
  }
}
function runAllNotifChecks(){checkBudgetNotifications();checkCcNotifications();}

        <div class="notif-desc">${n.body} · ${fmtD(n.mkey?n.mkey+'-01':todayLocal().toISOString().split('T')[0])}</div>

      <div class="notif-scroll">${rows}</div>

  if(window.lucide)lucide.createIcons();

function openNotifItem(id){

async function prepayRemainingSplit(groupId,currentId){
  const group=state.exps.filter(x=>x.splitOf===groupId).sort((a,b)=>a.splitIndex-b.splitIndex);
  if(!group.length)return;
  const remaining=group.filter(g=>!g.ccPaid && !g.prepaid && g.id!==currentId);
  if(!remaining.length){showToast('Already paid ✓','check');return;}
  const total=remaining.reduce((s,g)=>s+g.amount,0);
  const current=group.find(g=>g.id===currentId);
  const catId=current?.catId||'misc';
  const note=current?.note?.split('·')[0]?.trim()||'Prepayment';
  const ok=await confirmAsync(`This will fold ${remaining.length} future installment${remaining.length===1?'':'s'} (${fmt(total)} total) into a single charge dated today. The future EMI rows will be marked as prepaid and will stop appearing in their respective months.`,{title:'Prepay remaining EMIs',okText:'Prepay '+fmt(total),cancelText:'Cancel'});
  if(!ok)return;
  // Mark remaining rows as prepaid (don't delete — keeps history)
  remaining.forEach(r=>{r.prepaid=true;});
  // Create a consolidated charge in the current month, tagged as CC but already settled
  const today=todayLocal().toISOString().split('T')[0];
  const d=todayLocal();
  state.exps.push({
    id:++state.uid,
    catId,
    subId:null,
    amount:total,
    date:today,
    note:`${note} · Prepaid ${remaining.length} EMI${remaining.length===1?'':'s'}`,
    paidWithCC:true,
    ccPaid:true,         // settled within this month
    splitPrepayOf:groupId,
    prepaidEmiIds:remaining.map(r=>r.id),
    mk:mk(d.getFullYear(),d.getMonth()),
  });
  closeSheet();save();hapticDone();
  showToast(`Prepaid ${fmt(total)} ✓`,'check');
  render();
}

// Long-press detector — handles .ti (expense), .ei (recurring), .oi-item (income)
let lpTimer=null, lpTarget=null;
function attachLongPress(){
  const scroll=document.getElementById('mainScroll');
  if(!scroll||scroll._lpAttached)return;
  scroll._lpAttached=true;
  const start=e=>{
    if(e.target.closest('.tdel, .ei-del, .oi-del, button, a, input, select'))return;
    const ti=e.target.closest('.ti[data-tid]');
    const ei=e.target.closest('.ei[data-eid]');
    const oi=e.target.closest('.oi-item[data-oid]');
    if(ti && !String(ti.dataset.tid).startsWith('emi_')) lpTarget={type:'ti',id:parseInt(ti.dataset.tid)};
    else if(ei) lpTarget={type:'ei',id:parseInt(ei.dataset.eid)};
    else if(oi) lpTarget={type:'oi',id:parseInt(oi.dataset.oid)};
    else return;
    lpTimer=setTimeout(()=>{
      if(!lpTarget)return;
      hapticTick();
      if(lpTarget.type==='ti')openEditExp(lpTarget.id);
      else if(lpTarget.type==='ei')openEditEmi(lpTarget.id);
      else if(lpTarget.type==='oi')openEditOI(lpTarget.id);
      lpTarget=null;
    },520);
  };
  const cancel=()=>{clearTimeout(lpTimer);lpTarget=null;};
  scroll.addEventListener('touchstart',start,{passive:true});
  scroll.addEventListener('touchend',cancel,{passive:true});
  scroll.addEventListener('touchmove',cancel,{passive:true});
  scroll.addEventListener('mousedown',start);
  ['mouseup','mouseleave','scroll'].forEach(ev=>scroll.addEventListener(ev,cancel,{passive:true}));
}
setTimeout(attachLongPress,400);

// ── Back-gesture / hardware-back handling ───────────────────────────────
// Every tab is one of three depths:
//   0 = Home (dash)
//   1 = any top-level tab (txn, an, sav, bud, emi, set, notif)
//   2 = a page nested INSIDE Settings (cat, cur)
// A single back-press/swipe always moves exactly one depth shallower:
// depth2 -> depth1 (its parent, currently always 'set') -> depth0 (Home) ->
// (nothing left to pop) OS/browser handles exit/minimize, as intended.
let _navDepth=0,_navSuppressPop=false,_navGuardPushed=false;
function _navTabDepth(t){ return (t==='cat'||t==='cur') ? 2 : (t==='dash' ? 0 : 1); }
function _navParentOf(t){ return (t==='cat'||t==='cur') ? 'set' : 'dash'; }
function _navPushGuardIfNeeded(){
  // Makes sure there's always at least one history entry to pop, so a back
  // press can be intercepted (to close an overlay) even when the user is
  // still on Home and hasn't "left" it yet.
  if(_navDepth>0||_navGuardPushed)return;
  history.pushState({tln:1,tab:'dash',guard:true},'');
  _navGuardPushed=true;
}
function _navHistorySync(t,fromPop){
  if(fromPop)return; // this call came FROM popstate — don't push/replace again
  const d=_navTabDepth(t);
  if(d===0){
    if(_navDepth>0) history.replaceState({tln:1,tab:'dash'},'');
    _navDepth=0;_navGuardPushed=false;
  } else if(d===1){
    if(_navDepth===0) history.pushState({tln:1,tab:t},'');
    else history.replaceState({tln:1,tab:t},''); // moving between siblings / up from depth2
    _navDepth=1;_navGuardPushed=false;
  } else { // d===2 — nested inside Settings
    if(_navDepth<2) history.pushState({tln:1,tab:t},'');
    else history.replaceState({tln:1,tab:t},''); // cat <-> cur, stay at depth 2
    _navDepth=2;_navGuardPushed=false;
  }
}
window.addEventListener('popstate',(e)=>{
  if(_navSuppressPop){ _navSuppressPop=false; return; }
  // Close whatever overlay is on top first; re-arm one history entry so the
  // NEXT back press is still available to do the next step.
  const sheetOpen=document.getElementById('sheet')?.classList.contains('on');
  const drawerOpen=document.getElementById('shell')?.classList.contains('menu-open');
  const drillOpen=document.getElementById('drill-modal')?.classList.contains('on');
  if(sheetOpen||drawerOpen||drillOpen){
    if(sheetOpen)closeSheet();
    if(drawerOpen)toggleMenu(false);
    if(drillOpen)closeDrill();
    _navSuppressPop=true;_navGuardPushed=true;
    history.pushState({tln:1,tab:activeTab},'');
    return;
  }
  // Land on whichever tab this history entry actually represents. Falls back
  // to Home for the initial guard entry (which has no meaningful tab).
  const targetTab=(e.state&&e.state.tab&&!e.state.guard)?e.state.tab:'dash';
  _navDepth=_navTabDepth(targetTab);_navGuardPushed=false;
  if(activeTab!==targetTab){
    setTab(targetTab,{fromPop:true,silent:true});
  }
  // else: no overlay, nothing meaningful changed — let the back
  // navigation proceed naturally (app exits/minimizes) when already Home.
});

// ── Hardware back button (Android/Capacitor) ────────────────────────────
// Capacitor does NOT route the hardware back button through the browser's
// history/popstate mechanism by default. Without this listener, the native
// side just exits the app on a single back-press, and everything above
// (which relies on 'popstate' firing) never runs. Requires @capacitor/app
// to be installed (npm install @capacitor/app && npx cap sync android).
if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener('backButton', ({canGoBack})=>{
    if(canGoBack){ history.back(); }
    else{ window.Capacitor.Plugins.App.exitApp(); }
  });
}

function makeTList(list){
  if(!list.length)return'<div class="empty">No transactions yet</div>';
  return[...list].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>{
    const c=getCat(e.catId),sub=e.subId?getSub(e.catId,e.subId):null,dot=sub?sub.color:c.color;
    const lbl=e.note||(sub?sub.name:c.name);
    return`<div class="ti${isCCUnpaid(e)?' cc-unpaid':''}" data-tid="${e.id}" ${e.isEmi?'':`onclick="if(!event.target.closest('.tdel'))openEditExp(${e.id})"`}><div class="tidot" style="background:${dot}"></div><div class="tib"><div class="tin">${lbl}${e.isEmi?'<span class="emi-tag">EMI</span>':''}${e.paidWithCC?'<span class="cc-tag" title="Paid with Credit Card">💳</span>':''}${isCCUnpaid(e)?'<span class="cc-tag" style="background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);padding:2px 6px;border-radius:4px;font-size:9px;letter-spacing:.08em;font-weight:600" title="Booked on credit, not yet settled">UNPAID</span>':''}${e.ccPayment?'<span class="cc-tag" style="background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;font-size:9px;letter-spacing:.08em;font-weight:600" title="Payment applied to credit-card bill">CC PAYMENT</span>':''}</div><div class="tis">${sub?sub.name+' · ':c.name+' · '}${fmtD(e.date)}</div></div><div class="tia">${fmt(e.amount)}</div>${e.isEmi?'':`<button class="tdel" onclick="event.stopPropagation();delExp(${e.id})" aria-label="Delete">✕</button>`}</div>`;
  }).join('');
}
function buildCatSelect(id,val){
  const el=$(id);if(!el)return;el.innerHTML='';
  allCats().forEach(c=>{
    if(c.subs){const g=document.createElement('optgroup');g.label=c.name;c.subs.forEach(s=>{const o=document.createElement('option');o.value=c.id+'|'+s.id;o.textContent=c.name+' — '+s.name;if(val===o.value)o.selected=true;g.appendChild(o);});el.appendChild(g);}
    else{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;if(val===o.value)o.selected=true;el.appendChild(o);}
  });
}
const chartGrid=()=>({color:cssVar('--grid')||'rgba(255,255,255,.04)'});
const chartBorder=()=>cssVar('--chart-border')||'#000';
const monoFont=()=>({size:10,family:"'JetBrains Mono',monospace"});

function quoteForBalance(rem,avail){
  if(!avail)return 'A new month begins.';
  const pct=rem/avail;
  if(pct>.6)return 'Plenty of runway.';
  if(pct>.3)return 'Mid-month, on track.';
  if(pct>0) return 'Tightening up nicely.';
  return 'Time to slow the spend.';
}

function renderAn(){
  let labels=[],datasets=[],tot=0,cnt=0,days=1;
  const navHTML=period!=='yearly'?`<button class="mbtn" onclick="chAnP(-1)"><i data-lucide="chevron-left" class="ic-sm"></i></button><span class="month-lbl" id="an-mlbl">—</span><button class="mbtn" onclick="chAnP(1)"><i data-lucide="chevron-right" class="ic-sm"></i></button>`:'';
  $('main-content').innerHTML=`
    <div class="ptabs">${['daily','weekly','monthly','yearly'].map(p=>`<button class="ptab${period===p?' on':''}" id="pt-${p}" onclick="setPeriod('${p}')">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px"><div class="serif" style="font-size:26px" id="an-title">—</div><div class="month-nav">${navHTML}</div></div>
    <div class="metric-row" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="metric"><div class="metric-l">Period Total</div><div class="metric-v" id="an-tot">—</div></div>
      <div class="metric"><div class="metric-l">Avg / Day</div><div class="metric-v" id="an-avg">—</div></div>
      <div class="metric"><div class="metric-l">Transactions</div><div class="metric-v" id="an-cnt">—</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px">
        <div class="leg" id="an-leg"></div>
        <div style="display:flex;gap:4px;flex-shrink:0">${[['bar','Bar'],['line','Line'],['pie','Pie'],['doughnut','Doughnut']].map(([id,lbl])=>`<button class="ptab${anChartType===id?' on':''}" style="padding:6px 12px;font-size:11px" onclick="setAnChartType('${id}')">${lbl}</button>`).join('')}</div>
      </div>
      <div style="position:relative;width:100%;height:300px"><canvas id="an-ch"></canvas></div>
    </div>
    <div class="panel"><div class="panel-t"><i data-lucide="layers" class="ic-sm"></i>Category Breakdown</div><div id="an-bkd"></div></div>`;
  if(period==='daily'){
    const mkey=mk(anY,anM),me=allExps(mkey),dm=din(anY,anM);
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[anM]+' '+anY;
    $('an-title').innerHTML='Daily — <span class="ital">'+MOS[anM]+' '+anY+'</span>';
    labels=Array.from({length:dm},(_,i)=>i+1);
    const ac=allCats().filter(c=>me.some(e=>e.catId===c.id));
    datasets=ac.map(c=>({label:c.name,data:labels.map(d=>me.filter(e=>e.catId===c.id&&e.date===mkey+'-'+String(d).padStart(2,'0')).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:2}));
    exp=allExps(mkey).reduce((s,e)=>s+e.amount,0);
  }else if(period==='weekly'){
    const mkey=mk(anY,anM),me=allExps(mkey),dm=din(anY,anM);
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[anM]+' '+anY;
    $('an-title').innerHTML='Weekly — <span class="ital">'+MOS[anM]+' '+anY+'</span>';
    const wks=[];let s=1;while(s<=dm){wks.push([s,Math.min(s+6,dm)]);s+=7;}
    labels=wks.map(([s,e])=>s+'-'+e);
    const ac=allCats().filter(c=>me.some(e=>e.catId===c.id));
    datasets=ac.map(c=>({label:c.name,data:wks.map(([ws,we])=>me.filter(e=>{const d=parseInt((e.date||'').split('-')[2]);return e.catId===c.id&&d>=ws&&d<=we;}).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:3}));
    tot=me.reduce((s,e)=>s+e.amount,0);cnt=me.length;days=dm;
  }else if(period==='monthly'){
    const mos=[];for(let i=11;i>=0;i--){let m=anM-i,y=anY;while(m<0){m+=12;y--;}mos.push([y,m]);}
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[mos[0][1]]+'–'+MOS3[mos[11][1]]+' '+anY;
    $('an-title').innerHTML='Monthly — <span class="ital">last 12 months</span>';
    labels=mos.map(([y,m])=>MOS3[m]+' '+String(y).slice(2));
    const allData=mos.map(([y,m])=>allExps(mk(y,m)));
    const ac=allCats().filter(c=>allData.some(ex=>ex.some(e=>e.catId===c.id)));
    datasets=ac.map(c=>({label:c.name,data:allData.map(ex=>ex.filter(e=>e.catId===c.id).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:3}));
    tot=allData.reduce((s,ex)=>s+ex.reduce((a,e)=>a+e.amount,0),0);cnt=allData.reduce((s,ex)=>s+ex.length,0);days=365;
  }else{
    $('an-title').innerHTML='Yearly — <span class="ital">overview</span>';
    const yrs=[...new Set([...state.exps.map(e=>e.mk.split('-')[0]),...state.emis.map(e=>String(e.sy))])].sort();
    labels=yrs.length?yrs:[String(curY)];
    const allData=labels.map(y=>{const r=allCats().map(()=>0);for(let m=0;m<12;m++)allExps(y+'-'+String(m+1).padStart(2,'0')).forEach(e=>{const ci=allCats().findIndex(c=>c.id===e.catId);if(ci>=0)r[ci]+=e.amount;});return r;});
    const ac=allCats().filter((c,ci)=>allData.some(r=>r[ci]>0));
    datasets=ac.map(c=>({label:c.name,data:labels.map((_,yi)=>allData[yi][allCats().indexOf(c)]||0),backgroundColor:c.color,stack:'s',borderRadius:4}));
    tot=allData.reduce((s,r)=>s+r.reduce((a,v)=>a+v,0),0);cnt=state.exps.length;days=365;
  }
  $('an-tot').textContent=fmt(tot);$('an-avg').textContent=fmt(days>0?tot/days:0);$('an-cnt').textContent=cnt;
  const act=datasets.filter(d=>d.data.some(v=>v>0));

  const grandTot=catTotals.reduce((s,c)=>s+c.total,0);
  if(anChartType==='pie'||anChartType==='doughnut'){
    anChart=new Chart($('an-ch'),{type:anChartType,data:{labels:catTotals.map(c=>c.label),datasets:[{data:catTotals.map(c=>c.total),backgroundColor:catTotals.map(c=>c.color),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmt(Math.round(ctx.parsed))}${grandTot?' ('+Math.round((ctx.parsed/grandTot)*100)+'%)':''}`}}}}});
  } else if(anChartType==='line'){
    const lineSets=(act.length?act:[{label:'No data',data:labels.map(()=>0),backgroundColor:cssVar('--dim')}]).map(d=>({label:d.label,data:d.data,type:'line',fill:false,tension:.3,borderColor:d.backgroundColor,backgroundColor:d.backgroundColor,pointRadius:2,borderWidth:2}));
    anChart=new Chart($('an-ch'),{type:'line',data:{labels,datasets:lineSets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(Math.round(ctx.parsed.y))}`}}},scales:{x:{ticks:{autoSkip:labels.length>20,maxRotation:45,color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>sym()+Math.round(v).toLocaleString(CUR().locale),color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}}}}});
  } else {
    anChart=new Chart($('an-ch'),{type:'bar',data:{labels,datasets:act.length?act:[{label:'No data',data:labels.map(()=>0),backgroundColor:cssVar('--dim'),stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(Math.round(ctx.parsed.y))}`}}},scales:{x:{stacked:true,ticks:{autoSkip:labels.length>20,maxRotation:45,color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>sym()+Math.round(v).toLocaleString(CUR().locale),color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}}}}});
  }
  // Category breakdown: with 20+ categories a flat list gets unreadable, so it's
  // searchable and collapsed to the top 8 by spend with a "show all" expander.
  const bkdMatch=anBkdSearch?catTotals.filter(c=>c.label.toLowerCase().includes(anBkdSearch)):catTotals;
  const shown=anBkdExpanded?bkdMatch:bkdMatch.slice(0,8);
  const hiddenCount=bkdMatch.length-shown.length;
  $('an-bkd').innerHTML=`
    ${catTotals.length>8?`<input type="text" id="an-bkd-search" class="txn-cat-dd-search" style="margin-bottom:10px" placeholder="Filter categories…" value="${anBkdSearch.replace(/"/g,'&quot;')}" oninput="setAnBkdSearch(this.value)" autocomplete="off"/>`:''}
    ${shown.length?shown.map(c=>`<div class="ti"><div class="tidot" style="background:${c.color}"></div><div class="tib"><div class="tin">${c.label}</div><div class="bpw2" style="margin-top:6px"><div class="bpb2" style="width:${grandTot?Math.round((c.total/grandTot)*100):0}%;background:${c.color}"></div></div></div><div class="tia">${fmt(c.total)}</div><div style="font-size:11px;color:var(--muted);margin-left:10px;font-family:'JetBrains Mono',monospace">${grandTot?Math.round((c.total/grandTot)*100)+'%':''}</div></div>`).join(''):'<div class="empty">'+(anBkdSearch?'No matching categories':'Add expenses to see breakdown')+'</div>'}
    ${hiddenCount>0?`<button class="ghost" style="width:100%;margin-top:10px;padding:9px;font-size:12px" onclick="toggleAnBkdExpand()">Show all ${bkdMatch.length} categories</button>`:''}
    ${anBkdExpanded&&catTotals.length>8?`<button class="ghost" style="width:100%;margin-top:10px;padding:9px;font-size:12px" onclick="toggleAnBkdExpand()">Show top 8 only</button>`:''}
  `;
  if(window.lucide)lucide.createIcons();
}

function getSavRows(){
  const rows=[];for(let i=11;i>=0;i--){let m=curM-i,y=curY;while(m<0){m+=12;y--;}rows.push([y,m]);}
  return rows.map(([y,m])=>{
    const mkey=mk(y,m),sal=state.salaries[mkey]||0,oi=state.otherIncome.filter(o=>o.mk===mkey).reduce((s,o)=>s+o.amount,0);
    const carry=getCarryover(y,m),exp=allExps(mkey).reduce((s,e)=>s+e.amount,0);
    return{label:MOS3[m]+' '+String(y).slice(2),sal,oi,carry,exp,sav:sal+oi+carry-exp};
  });
}
function renderSav(){
  const data=getSavRows(),last=data[data.length-1];
  const carry=getCarryover(curY,curM);
  const hasSal=data.filter(d=>d.sal>0);

    <div class="panel no-tab-swipe" style="margin-bottom:14px">
      <div class="panel-t"><i data-lucide="trending-up" class="ic-sm"></i>Income vs Expenses — 12 months</div>
      <div class="leg"><span class="li"><span class="ld" style="background:#8cd9a0"></span>Income</span><span class="li"><span class="ld" style="background:#ff5e5e"></span>Expenses</span><span class="li"><span class="ld" style="background:var(--accent);border-radius:50%"></span>Savings</span></div>
      <div style="position:relative;width:100%;height:280px"><canvas id="s-ch"></canvas></div>
    </div>

        <tbody>${data.map(d=>`<tr><td>${d.label}</td><td>${d.sal?fmt(d.sal):'—'}</td><td class="pos">${d.oi?'+'+fmt(d.oi):'—'}</td><td class="${d.carry>=0?'pos':'neg'}">${fmt(d.carry)}</td><td>${d.exp?fmt(d.exp):'—'}</td><td class="${d.sav>=0?'pos':'neg'}">${d.sal?fmt(d.sav):'—'}</td><td class="${(d.carry+d.sav)>=0?'pos':'neg'}">${d.sal?fmt(d.carry+d.sav):'—'}</td></tr>`).join('')}</tbody>

  if(savChart){savChart.destroy();savChart=null;}
  const gc=chartGrid();
  savChart=new Chart($('s-ch'),{data:{labels:data.map(d=>d.label),datasets:[

let txnFilterCats=new Set(); // empty = All categories
let txnCatDdOpen=false, txnCatDdSearch='';
function toggleTxnCatDd(force){ txnCatDdOpen = force!==undefined?force:!txnCatDdOpen; if(!txnCatDdOpen)txnCatDdSearch=''; renderTxn(); }
function setTxnCatDdSearch(v){ txnCatDdSearch=(v||'').toLowerCase(); renderTxn(); const el=document.getElementById('txn-cat-dd-search'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }
function toggleTxnCat(id){ if(txnFilterCats.has(id))txnFilterCats.delete(id); else txnFilterCats.add(id); renderTxn(); }
function clearTxnCatFilter(){ txnFilterCats.clear(); renderTxn(); }
let txnSearch='';
function setTxnSearch(v){txnSearch=(v||'').toLowerCase();renderTxn();}
function clearTxnSearch(){txnSearch='';renderTxn();const el=document.getElementById('txn-search');if(el)el.focus();}

function renderTxn(){
  const me=curExps();
  let filtered=me;
  if(txnFilterCats.size) filtered=filtered.filter(e=>txnFilterCats.has(e.catId));
  // Full-text search across note, category, sub-category, amount, date
  if(txnSearch){
    const q=txnSearch;
    filtered=filtered.filter(e=>{
      const cat=getCat(e.catId);
      const sub=e.subId?(cat.subs||[]).find(s=>s.id===e.subId):null;
      const hay=[
        e.note||'',
        cat.name,
        sub?.name||'',
        String(e.amount),
        fmt(e.amount),
        e.date,
        fmtD(e.date),
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  const byDate={};
  [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(e=>{
    (byDate[e.date]=byDate[e.date]||[]).push(e);
  });
  const total=filtered.reduce((s,e)=>s+e.amount,0);
  const usedCats=[...new Set(me.map(e=>e.catId))].map(id=>{const c=getCat(id);return{id,name:c.name,color:c.color};});
  const ddOptions=txnCatDdSearch?usedCats.filter(c=>c.name.toLowerCase().includes(txnCatDdSearch)):usedCats;
  const ddLabel=txnFilterCats.size===0?'All categories'
    :txnFilterCats.size===1?usedCats.find(c=>txnFilterCats.has(c.id))?.name||'1 selected'
    :`${txnFilterCats.size} categories selected`;
  $('main-content').innerHTML=`
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap">
      <div><div class="serif" style="font-size:28px">${MOS[curM]} ${curY}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace">${filtered.length} transaction${filtered.length===1?'':'s'} · ${fmt(total)}${txnSearch?` · matching "${txnSearch}"`:''}${txnFilterCats.size?` · filtered by ${txnFilterCats.size} categor${txnFilterCats.size===1?'y':'ies'}`:''}</div></div>
    </div>
    <div class="txn-search-wrap">
      <i data-lucide="search" class="ic-sm txn-search-icon"></i>
      <input type="text" id="txn-search" class="txn-search" placeholder="Search by note, category, amount, or date…" value="${txnSearch.replace(/"/g,'&quot;')}" oninput="setTxnSearch(this.value)" autocomplete="off"/>
      ${txnSearch?`<button class="txn-search-clear" onclick="clearTxnSearch()" aria-label="Clear"><i data-lucide="x" class="ic-sm"></i></button>`:''}
    </div>
    <div class="txn-cat-dd">
      ${txnCatDdOpen?`<div class="txn-cat-dd-backdrop" onclick="toggleTxnCatDd(false)"></div>`:''}
      <button class="txn-cat-dd-btn" onclick="toggleTxnCatDd()">
        <span class="chips">${txnFilterCats.size?[...txnFilterCats].slice(0,4).map(id=>{const c=usedCats.find(x=>x.id===id);return c?`<span class="ld" style="background:${c.color};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px"></span>`:'';}).join(''):''}${ddLabel}</span>
        <i data-lucide="${txnCatDdOpen?'chevron-up':'chevron-down'}" class="ic-sm"></i>
      </button>
      ${txnCatDdOpen?`
      <div class="txn-cat-dd-panel">
        <input type="text" id="txn-cat-dd-search" class="txn-cat-dd-search" placeholder="Filter categories…" value="${txnCatDdSearch.replace(/"/g,'&quot;')}" oninput="setTxnCatDdSearch(this.value)" autocomplete="off"/>
        <div class="txn-cat-dd-list">
          ${ddOptions.length?ddOptions.map(c=>`<label class="txn-cat-dd-opt"><input type="checkbox" ${txnFilterCats.has(c.id)?'checked':''} onchange="toggleTxnCat('${c.id}')"/><span class="ld" style="background:${c.color};display:inline-block;width:10px;height:10px;border-radius:50%"></span><span>${c.name}</span></label>`).join(''):'<div class="empty" style="padding:14px 4px">No matching categories</div>'}
        </div>

          <button class="primary" style="padding:8px 16px;font-size:12px" onclick="toggleTxnCatDd(false)">Done</button>
        </div>
      </div>`:''}
    </div>
    <div class="panel" style="padding:10px 16px">
      ${Object.keys(byDate).length===0?`<div class="empty">${txnSearch||txnFilterCats.size?'No matches — try different filters':'No transactions for this filter'}</div>`:
        Object.entries(byDate).map(([date,items])=>{
          const dTot=items.reduce((s,e)=>s+e.amount,0);
          return `<div style="padding:12px 0 4px;border-bottom:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <div style="font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em">${fmtD(date)}</div>

    <div style="text-align:center;margin-top:16px;font-size:14px;color:var(--dim);font-style:italic;font-family:'Instrument Serif',serif">Tap any transaction to edit · long-press on mobile</div>`;

  // Restore focus if user was typing in either search box (so it doesn't blur on re-render)
  if(document.activeElement?.tagName!=='INPUT'){
    const s=document.getElementById('txn-search');
    if(s&&txnSearch){s.focus();s.setSelectionRange(txnSearch.length,txnSearch.length);}
    const cs=document.getElementById('txn-cat-dd-search');
    if(cs&&txnCatDdOpen){cs.focus();cs.setSelectionRange(txnCatDdSearch.length,txnCatDdSearch.length);}
  }
}
