// TRANSACTIONS PAGE (full list, filterable)
// ════════════════════════════════════════════════════════
let txnFilter='all';
function setTxnFilter(f){txnFilter=f;renderTxn();}
function renderTxn(){
  const me=curExps();
  let filtered=me;
  if(txnFilter!=='all') filtered=me.filter(e=>e.catId===txnFilter);
  const byDate={};
  [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(e=>{
    (byDate[e.date]=byDate[e.date]||[]).push(e);
  });
  const total=filtered.reduce((s,e)=>s+e.amount,0);
  const usedCats=[...new Set(me.map(e=>e.catId))];
  const filters=[{id:'all',name:'All'},...usedCats.map(id=>{const c=getCat(id);return{id,name:c.name,color:c.color};})];
  $('main-content').innerHTML=`
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap">
      <div><div class="serif" style="font-size:28px">${MOS[curM]} ${curY}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace">${filtered.length} transaction${filtered.length===1?'':'s'} · ${fmt(total)}</div></div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch">
      ${filters.map(f=>`<button class="ptab${txnFilter===f.id?' on':''}" style="flex-shrink:0;white-space:nowrap" onclick="setTxnFilter('${f.id}')">${f.color?`<span class="ld" style="background:${f.color};margin-right:6px;display:inline-block;vertical-align:2px"></span>`:''}${f.name}</button>`).join('')}
    </div>
    <div class="panel" style="padding:10px 16px">
      ${Object.keys(byDate).length===0?'<div class="empty">No transactions for this filter</div>':
        Object.entries(byDate).map(([date,items])=>{
          const dTot=items.reduce((s,e)=>s+e.amount,0);
          return `<div style="padding:12px 0 4px;border-bottom:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <div style="font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em">${fmtD(date)}</div>
              <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace">${fmt(dTot)}</div>
            </div>
            ${makeTList(items)}
          </div>`;

let budgetSaveTimer=null;
function onBudgetInput(id,val,el){
  state.budgets[id]=parseFloat(val)||0;
  // Update this row's progress bar inline (no full re-render — keeps keyboard open)
  const row=el.closest('.bi');
  if(row){
    const me=curExps();
    const c=getCat(id);
    const spent=me.filter(e=>e.catId===id).reduce((s,e)=>s+e.amount,0);
    const bgt=state.budgets[id]||0;
    const pct=bgt?Math.min(100,Math.round((spent/bgt)*100)):0;
    const over=bgt&&spent>bgt;
    let bar=row.querySelector('.bpw2'),foot=row.querySelector('.bi-foot');
    if(bgt){
      if(!bar){
        // First-time budget set — inject bar & footer
        row.insertAdjacentHTML('beforeend',
          `<div class="bpw2"><div class="bpb2" style="width:${pct}%;background:${over?'var(--danger)':c.color}"></div></div>
           <div class="bi-foot"><span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span></div>`);
      } else {
        bar.querySelector('.bpb2').style.width=pct+'%';
        bar.querySelector('.bpb2').style.background=over?'var(--danger)':c.color;
        foot.innerHTML=`<span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span>`;
      }
    } else {
      if(bar)bar.remove();
      if(foot)foot.remove();
    }
  }
  // Debounced save (doesn't re-render)
  clearTimeout(budgetSaveTimer);
  budgetSaveTimer=setTimeout(()=>save(),600);
}
function renderBud(){
  const me=curExps();
  $('main-content').innerHTML=`
    <div style="margin-bottom:18px;font-size:13px;color:var(--muted);max-width:520px;line-height:1.55">Set monthly limits per category. Progress fills live as you spend. Going over is loud; staying under is quiet.</div>
    <div class="bud-list">${allCats().map(c=>{
      const spent=me.filter(e=>e.catId===c.id).reduce((s,e)=>s+e.amount,0);
      const bgt=state.budgets[c.id]||0,pct=bgt?Math.min(100,Math.round((spent/bgt)*100)):0,over=bgt&&spent>bgt;
      return`<div class="bi"><div class="bi-row"><div class="bi-left"><div class="cat-dot" style="background:${c.color}"></div><span class="bi-name">${c.name}</span><span class="bi-spent">${fmt(spent)} spent</span></div><div class="bi-in-w"><label>Budget ${sym()}</label><input type="number" inputmode="decimal" class="bi-in" id="bi-${c.id}" value="${bgt||''}" placeholder="No limit" min="0" step="any" oninput="onBudgetInput('${c.id}',this.value,this)"/></div></div>${bgt?`<div class="bpw2"><div class="bpb2" style="width:${pct}%;background:${over?'var(--danger)':c.color}"></div></div><div class="bi-foot"><span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span></div>`:''}</div>`;
    }).join('')}</div>`;
  if(window.lucide)lucide.createIcons();
}

async function refreshFromSupabase(){
  try{
    // Don't clobber the user if they're typing something
    const ae=document.activeElement;
    const isTyping=ae && (ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA');
    // Also don't re-render if a bottom sheet is open with unsaved input
    const sheetOpen=document.getElementById('sheet')?.classList.contains('on');
    const{data,error}=await sb.from('tracker').select('data').eq('id',getUid()).single();
    if(error||!data?.data)return;
    const p=JSON.parse(data.data);
    state={exps:p.exps||[],budgets:p.budgets||{},emis:p.emis||[],salaries:p.salaries||{},otherIncome:p.otherIncome||[],uid:p.uid||0,currency:p.currency||'INR',theme:p.theme||state.theme,creditPaid:p.creditPaid||{},customCats:p.customCats||[],settings:Object.assign({ccCutoffDay:0,notifEnabled:false},p.settings||{}),notifState:p.notifState||{},catOverrides:p.catOverrides||{},customSubs:p.customSubs||{}};
    if(p.curY)curY=p.curY;if(p.curM!==undefined)curM=p.curM;
    setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
    if(isTyping||sheetOpen)return; // skip render — keep user's input intact
    render();
  }catch(e){}
}
