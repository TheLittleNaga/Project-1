let budgetSaveTimer=null;
function onBudgetInput(id,val,el){
  state.budgets[id]=parseFloat(val)||0;
  // Update this row's progress bar inline (no full re-render — keeps keyboard open)
  const row=el.closest('.bi');
  if(row){
    const me=curExps();
    const c=getCat(id);
    const spent=me.filter(e=>e.catId===id).reduce((s,e)=>s+e.amount,0);
    const bgt=state.budgets[id]||0;
    const pct=bgt?Math.min(100,Math.round((spent/bgt)*100)):0;
    const over=bgt&&spent>bgt;
    let bar=row.querySelector('.bpw2'),foot=row.querySelector('.bi-foot');
    if(bgt){
      if(!bar){
        // First-time budget set — inject bar & footer
        row.insertAdjacentHTML('beforeend',
          `<div class="bpw2"><div class="bpb2" style="width:${pct}%;background:${over?'var(--danger)':c.color}"></div></div>
           <div class="bi-foot"><span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span></div>`);
      } else {
        bar.querySelector('.bpb2').style.width=pct+'%';
        bar.querySelector('.bpb2').style.background=over?'var(--danger)':c.color;
        foot.innerHTML=`<span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span>`;
      }
    } else {
      if(bar)bar.remove();
      if(foot)foot.remove();
    }
  }
  // Debounced save (doesn't re-render)
  clearTimeout(budgetSaveTimer);
  budgetSaveTimer=setTimeout(()=>save(),600);
}
function renderBud(){
  const me=curExps();
  $('main-content').innerHTML=`
    <div style="margin-bottom:18px;font-size:13px;color:var(--muted);max-width:520px;line-height:1.55">Set monthly limits per category.</div>
    <div class="bud-list">${allCats().filter(c=>!c.excludeFromBudget).map(c=>{
      const spent=me.filter(e=>e.catId===c.id).reduce((s,e)=>s+e.amount,0);
      const bgt=state.budgets[c.id]||0,pct=bgt?Math.min(100,Math.round((spent/bgt)*100)):0,over=bgt&&spent>bgt;
      return`<div class="bi"><div class="bi-row"><div class="bi-left"><div class="cat-dot" style="background:${c.color}"></div><span class="bi-name">${c.name}</span><span class="bi-spent">${fmt(spent)} spent</span></div><div class="bi-in-w"><label>Budget ${sym()}</label><input type="number" inputmode="decimal" class="bi-in" id="bi-${c.id}" value="${bgt||''}" placeholder="No limit" min="0" step="any" oninput="onBudgetInput('${c.id}',this.value,this)"/></div></div>${bgt?`<div class="bpw2"><div class="bpb2" style="width:${pct}%;background:${over?'var(--danger)':c.color}"></div></div><div class="bi-foot"><span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span></div>`:''}</div>`;
    }).join('')}</div>`;
  if(window.lucide)lucide.createIcons();
}

// ── Draft autosave for the Recurring form ───────────────────────────────
// Android WebViews (and sometimes Chrome) can kill/reload the page when the
// app is backgrounded, wiping any in-progress typing. We mirror the form's
// fields to localStorage on every change and restore them on render so
// switching apps or minimising never loses what you were adding.
const EMI_DRAFT_KEY='tln_emi_draft';
function saveEmiDraft(){
  try{
    const draft={
      name:$('e-name')?.value||'', amt:$('e-amt')?.value||'', cat:$('e-cat')?.value||'',
      start:$('e-start')?.value||'', months:$('e-months')?.value||'', day:$('e-day')?.value||''
    };
    localStorage.setItem(EMI_DRAFT_KEY,JSON.stringify(draft));
  }catch(e){}
}
function restoreEmiDraft(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(EMI_DRAFT_KEY)||'null');}catch(e){}
  if(!d)return;
  if(d.name&&$('e-name'))$('e-name').value=d.name;
  if(d.amt&&$('e-amt'))$('e-amt').value=d.amt;
  if(d.cat&&$('e-cat'))$('e-cat').value=d.cat;
  if(d.start&&$('e-start'))$('e-start').value=d.start;
  if(d.months&&$('e-months'))$('e-months').value=d.months;
  if(d.day&&$('e-day'))$('e-day').value=d.day;
}
function clearEmiDraft(){ try{localStorage.removeItem(EMI_DRAFT_KEY);}catch(e){} }

async function refreshFromSupabase(){
  try{
    // Don't clobber the user if they're typing something
    const ae=document.activeElement;
    const isTyping=ae && (ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA');
    // Also don't re-render if a bottom sheet is open with unsaved input
    const sheetOpen=document.getElementById('sheet')?.classList.contains('on');
    const{data,error}=await sb.from('tracker').select('data').eq('id',getUid()).single();
    if(error||!data?.data)return;
    const p=JSON.parse(data.data);
    state={exps:p.exps||[],budgets:p.budgets||{},emis:p.emis||[],salaries:p.salaries||{},otherIncome:p.otherIncome||[],uid:p.uid||0,currency:p.currency||'INR',theme:p.theme||state.theme,creditPaid:p.creditPaid||{},customCats:p.customCats||[],settings:Object.assign({ccCutoffDay:0,notifEnabled:false},p.settings||{}),notifState:p.notifState||{},catOverrides:p.catOverrides||{},customSubs:p.customSubs||{},notifLog:p.notifLog||[]};
    if(p.curY)curY=p.curY;if(p.curM!==undefined)curM=p.curM;
    setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
    if(isTyping||sheetOpen)return; // skip render — keep user's input intact
    render();
  }catch(e){}
}
