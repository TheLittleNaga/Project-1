// ── commit ──────────────────────────────────────────────
let _impCommitting=false;
function impCommit(){
  if(_impCommitting||!impS)return;
  const s=impS,batch=Date.now();
  const rows=s.list.filter(r=>r.type!=='skip');
  if(!rows.length)return;
  _impCommitting=true;
  state.impLog=state.impLog||{};
  const log=state.impLog[batch]={salaries:{},creditPaid:{}};
  const res={n:0,ne:0,ni:0,ns:0,np:0,nr:0,te:0,ti:0,tp:0,months:[],skipped:s.list.length-rows.length,latest:''};
  const months=new Set();let latest='';
  const touch=r=>{const m=r.date.slice(0,7);months.add(m);if(r.date>latest)latest=r.date;return m;};
  const pad=n=>String(n).padStart(2,'0');
  // 1 · salary (several credits in one month are added together)
  const sal={};
  rows.filter(r=>r.type==='sal').forEach(r=>{const m=touch(r);sal[m]=(sal[m]||0)+r.amount;});
  for(const m in sal){log.salaries[m]=state.salaries[m]||0;state.salaries[m]=Math.round(sal[m]*100)/100;res.ns++;}
  // 2 · recurring entries (detected groups + template "Recurring" rows)
  const done=new Set();
  for(const r of rows.filter(x=>x.type==='rec')){
    touch(r);
    if(r.recId!=null){
      if(done.has(r.recId))continue;done.add(r.recId);
      const g=s.recs[r.recId];
      state.emis.push({id:++state.uid,name:g.name.slice(0,30),catId:g.catId,amount:g.amount,sy:+g.start.slice(0,4),sm:+g.start.slice(5,7)-1,months:g.ongoing?999:g.count,day:g.day,imp:batch});
    }else{
      state.emis.push({id:++state.uid,name:(r.note||'Recurring').slice(0,30),catId:String(r.cat).split('|')[0],amount:r.amount,sy:+r.date.slice(0,4),sm:+r.date.slice(5,7)-1,months:r.months>=1?Math.min(999,r.months):999,day:Math.min(28,+r.date.slice(8,10)||1),imp:batch});
    }
    res.nr++;
  }
  // 3 · expenses (incl. card purchases and split-into-EMI purchases)
  for(const r of rows.filter(x=>x.type==='exp')){
    const m=touch(r);
    const note=(r.note||'').trim()||'Imported expense';
    const[catId,subId]=String(r.cat).includes('|')?String(r.cat).split('|'):[r.cat,null];
    if(r.cc&&s.manual&&(r.months>=2||(r.custom&&r.custom.length>=2))){
      const sched=buildSplitSchedule(r.amount,r.months,r.interest,0,r.custom),n=sched.length;
      const gid='sp_'+batch.toString(36)+r.i;
      for(let k=0;k<n;k++){
        const t=addMonthsYMD(r.date,k);
        state.exps.push({id:++state.uid,catId,subId,amount:sched[k],date:t.date,note:`${note} · EMI ${k+1}/${n}${r.interest&&!(r.custom&&r.custom.length>=2)?` @${r.interest}%`:''}`,paidWithCC:true,splitOf:gid,splitTotal:r.amount,splitInterest:(r.custom&&r.custom.length>=2)?0:(r.interest||0),splitIndex:k+1,splitMonths:n,mk:mk(t.y,t.m),imp:batch});
      }
    }else{
      state.exps.push({id:++state.uid,catId,subId,amount:r.amount,date:r.date,note,paidWithCC:!!r.cc,mk:m,imp:batch});
    }
    res.ne++;res.te+=r.amount;
  }
  // 4 · other income (people paying you, refunds, interest…)
  for(const r of rows.filter(x=>x.type==='inc')){
    const m=touch(r);
    state.otherIncome.push({id:++state.uid,amount:r.amount,note:(r.note||'').trim()||'Others',date:r.date,mk:m,imp:batch});
    res.ni++;res.ti+=r.amount;
  }
  // 5 · card bill payments → same records the app's "Settle bill" creates
  for(const r of rows.filter(x=>x.type==='ccpay')){
    const m=touch(r),B=r.bill||m;
    // settle the oldest purchases of that bill (whole charges), one payment line per category
    const bill=getCreditBill(+B.slice(0,4),+B.slice(5,7)-1);
    let left=r.amount;const covered=[];
    bill.charges.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(ch=>{
      if(left>=ch.amount-0.001&&typeof ch.id==='number'&&left>0){covered.push(ch.id);left-=ch.amount;}
    });
    const flagged=ccSettleCharges(covered,r.amount,B,m,r.date,{imp:batch});
    (log.billed=log.billed||[]).push(...flagged);
    state.creditPaid=state.creditPaid||{};
    const base=state.creditPaid[B]===true?0:(+state.creditPaid[B]||0);
    state.creditPaid[B]=base+r.amount;
    log.creditPaid[B]=(log.creditPaid[B]||0)+r.amount;
    res.np++;res.tp+=r.amount;
  }
  res.n=res.ne+res.ni+res.ns+res.np+res.nr;
  res.months=[...months];res.latest=latest;
  s.result=res;s.step='done';
  save();render();
  impRender();
  hapticTap&&hapticTap();
  setTimeout(()=>{_impCommitting=false;},600);
}

  setTab('txn');
}

function quoteForBalance(rem,avail){
  if(!avail)return 'A new month begins.';
  const pct=rem/avail;

    </div>

      <div class="metric"><div class="metric-l">Salary + Carry</div><div class="metric-v">${fmt(sal+carry)}</div></div>
      <div class="metric"><div class="metric-l">Others</div><div class="metric-v pos">+${fmt(oi)}</div></div>
      <div class="metric"><div class="metric-l">Available</div><div class="metric-v">${fmt(avail)}</div></div>
      <div class="metric"><div class="metric-l">Spent</div><div class="metric-v">${fmt(total)}</div>${ccBooked>0?`<div class="metric-v sm" style="color:var(--danger);margin-top:4px" title="Booked on credit card, not yet settled">+ ${fmt(ccBooked)} on credit</div>`:''}</div>

      <div class="add-row"><div class="fg"><label>Category</label><select id="i-cat"></select></div><div class="fg"><label>Amount ${sym()}</label><input type="number" inputmode="decimal" step="any" id="i-amt" placeholder="0" min="0"/></div><div class="fg"><label>Date</label><input type="date" id="i-date"/></div><div class="fg" style="flex:2"><label>Note</label><input type="text" id="i-note" placeholder="Optional…" maxlength="40"/></div><div class="fg0" style="display:flex;align-items:center;gap:10px"><label class="cc-toggle inline" for="i-cc"><input type="checkbox" id="i-cc"/><span class="cc-icon"><i data-lucide="credit-card"></i></span><span class="cc-toggle-label">Paid with CC</span></label><button class="primary" onclick="addExp()"><i data-lucide="plus" class="ic-sm"></i>Add</button></div></div>
    </div>
    <div class="cat-grid-header"><i data-lucide="layout-grid" class="ic-sm"></i>Spending by category</div>
    <div class="cat-grid">${catGridHTML}</div>
    ${(()=>{
      const bill=getCreditBill(curY,curM);
      if(bill.total<=0)return '';

      const barCol=bill.paid?'var(--accent2)':'var(--accent)';
      const borderCol=bill.paid?'var(--accent2)':'var(--accent)';
      const softShadow=bill.paid?'color-mix(in srgb,var(--accent2) 15%,transparent)':'var(--accent-soft)';
      return `<div class="panel" style="margin-bottom:14px;border-color:${borderCol};box-shadow:0 0 0 3px ${softShadow}">
        <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div class="kicker" style="margin-bottom:4px"><i data-lucide="credit-card" class="ic-sm" style="vertical-align:-3px"></i> Credit Card Bill · Due this month</div>
            <div style="font-size:26px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;line-height:1.2">${fmt(bill.total)}</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace">${bill.charges.length} charge${bill.charges.length===1?'':'s'} from last month</div>
          </div>
          <div style="text-align:right;min-width:130px">
            <div style="font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase">Paid</div>
            <div style="font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${bill.paid?'var(--accent2)':'var(--fg)'}">${fmt(bill.paidAmount)}</div>
            ${bill.remaining>0?`<div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px">${fmt(bill.remaining)} left</div>`:'<div style="font-size:11px;color:var(--accent2);margin-top:2px">✓ Fully paid</div>'}
          </div>
        </div>
        <div style="margin-top:10px;height:6px;background:var(--border);border-radius:999px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${barCol};transition:width .4s ease"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
          ${bill.remaining>0?`
            <button class="primary" onclick="openCcPaymentAllocator('${bill.mkey}')" style="padding:10px 16px;font-size:13px;flex:1;min-width:160px"><i data-lucide="credit-card" class="ic-sm"></i>Settle bill…</button>
          `:''}
          <button class="ghost" onclick="editCcPayment('${bill.mkey}')" style="padding:10px 12px;font-size:12px"><i data-lucide="pencil" class="ic-sm"></i>Edit</button>
          ${bill.paidAmount>0?`<button class="ghost" onclick="resetCcPayment('${bill.mkey}')" style="padding:10px 12px;font-size:12px;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--border))"><i data-lucide="rotate-ccw" class="ic-sm"></i>Reset</button>`:''}
        </div>
      </div>`;
    })()}
    <div class="btm">
      <div class="panel"><div class="panel-t"><i data-lucide="pie-chart" class="ic-sm"></i>Breakdown</div>
        <div class="leg">${active.length?active.map((c,i)=>`<span class="li"><span class="ld" style="background:${c.color}"></span>${c.name} ${total?Math.round((cdata[i]/total)*100):0}%</span>`).join(''):'<span style="font-size:12px;color:var(--dim)">No data yet</span>'}</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="d-ch"></canvas></div>
      </div>
      <div class="panel"><div class="panel-t" style="display:flex;align-items:center;justify-content:space-between"><span><i data-lucide="receipt" class="ic-sm"></i>Recent Transactions</span><button class="ghost" style="padding:4px 10px;font-size:11px" onclick="setTab('txn')"><span>View all</span><i data-lucide="arrow-right" class="ic-sm"></i></button></div><div class="tlist">${makeTList([...me].sort((a,b)=>{
        // Sort by date DESC, then by id DESC so latest entries appear first
        const d=new Date(b.date)-new Date(a.date);
        return d!==0 ? d : (b.id||0)-(a.id||0);
      }).slice(0,5))}</div></div>
    </div>`;

  const si=$('d-sal');
  if(si&&document.activeElement!==si)si.value=state.salaries[mkey]||'';
  si.oninput=()=>{state.salaries[mk()]=parseFloat(si.value)||0;save();};
  const ce=$('d-carry');
  if(carry!==0)ce.innerHTML=`Carry-in <b style="color:${carry>=0?'var(--accent2)':'var(--danger)'}">${carry>=0?'+':''}${fmt(carry)}</b>`;
  else ce.textContent=sal?'':'Enter salary to start';
  buildCatSelect('i-cat');
  $('i-date').value=todayYMD();
  $('oi-date').value=todayYMD();
  if(dChart){dChart.destroy();dChart=null;}
  if(active.length)dChart=new Chart($('d-ch'),{type:'doughnut',data:{labels:active.map(c=>c.name),datasets:[{data:cdata,backgroundColor:active.map(c=>c.color),borderWidth:2,borderColor:chartBorder()}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(Math.round(ctx.parsed))}}},cutout:'66%'}});
  if(window.lucide)lucide.createIcons();
}

// ANALYTICS
// ════════════════════════════════════════════════════════
function renderAn(){
  let labels=[],datasets=[],tot=0,cnt=0,days=1;
  const navHTML=period!=='yearly'?`<button class="mbtn" onclick="chAnP(-1)"><i data-lucide="chevron-left" class="ic-sm"></i></button><span class="month-lbl" id="an-mlbl">—</span><button class="mbtn" onclick="chAnP(1)"><i data-lucide="chevron-right" class="ic-sm"></i></button>`:'';
  $('main-content').innerHTML=`
    <div class="ptabs">${['daily','weekly','monthly','yearly'].map(p=>`<button class="ptab${period===p?' on':''}" id="pt-${p}" onclick="setPeriod('${p}')">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px"><div class="serif" style="font-size:26px" id="an-title">—</div><div class="month-nav">${navHTML}</div></div>
    <div class="metric-row" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="metric"><div class="metric-l">Period Total</div><div class="metric-v" id="an-tot">—</div></div>
      <div class="metric"><div class="metric-l">Avg / Day</div><div class="metric-v" id="an-avg">—</div></div>
      <div class="metric"><div class="metric-l">Transactions</div><div class="metric-v" id="an-cnt">—</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px">
        <div class="leg" id="an-leg"></div>
        <div style="display:flex;gap:4px;flex-shrink:0">${[['bar','Bar'],['line','Line'],['pie','Pie'],['doughnut','Doughnut']].map(([id,lbl])=>`<button class="ptab${anChartType===id?' on':''}" style="padding:6px 12px;font-size:11px" onclick="setAnChartType('${id}')">${lbl}</button>`).join('')}</div>
      </div>
      <div style="position:relative;width:100%;height:300px"><canvas id="an-ch"></canvas></div>
    </div>
    <div class="panel"><div class="panel-t"><i data-lucide="layers" class="ic-sm"></i>Category Breakdown</div><div id="an-bkd"></div></div>`;
  if(period==='daily'){
    const mkey=mk(anY,anM),me=cntExps(mkey),dm=din(anY,anM);
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[anM]+' '+anY;
    $('an-title').innerHTML='Daily — <span class="ital">'+MOS[anM]+' '+anY+'</span>';
    labels=Array.from({length:dm},(_,i)=>i+1);
    const ac=allCats().filter(c=>me.some(e=>e.catId===c.id));
    datasets=ac.map(c=>({label:c.name,data:labels.map(d=>me.filter(e=>e.catId===c.id&&e.date===mkey+'-'+String(d).padStart(2,'0')).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:2}));
    exp=cntExps(mkey).reduce((s,e)=>s+e.amount,0);
  }else if(period==='weekly'){
    const mkey=mk(anY,anM),me=cntExps(mkey),dm=din(anY,anM);
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[anM]+' '+anY;
    $('an-title').innerHTML='Weekly — <span class="ital">'+MOS[anM]+' '+anY+'</span>';
    const wks=[];let s=1;while(s<=dm){wks.push([s,Math.min(s+6,dm)]);s+=7;}
    labels=wks.map(([s,e])=>s+'-'+e);
    const ac=allCats().filter(c=>me.some(e=>e.catId===c.id));
    datasets=ac.map(c=>({label:c.name,data:wks.map(([ws,we])=>me.filter(e=>{const d=parseInt((e.date||'').split('-')[2]);return e.catId===c.id&&d>=ws&&d<=we;}).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:3}));
    tot=me.reduce((s,e)=>s+e.amount,0);cnt=me.length;days=dm;
  }else if(period==='monthly'){
    const mos=[];for(let i=11;i>=0;i--){let m=anM-i,y=anY;while(m<0){m+=12;y--;}mos.push([y,m]);}
    if($('an-mlbl'))$('an-mlbl').textContent=MOS3[mos[0][1]]+'–'+MOS3[mos[11][1]]+' '+anY;
    $('an-title').innerHTML='Monthly — <span class="ital">last 12 months</span>';
    labels=mos.map(([y,m])=>MOS3[m]+' '+String(y).slice(2));
    const allData=mos.map(([y,m])=>cntExps(mk(y,m)));
    const ac=allCats().filter(c=>allData.some(ex=>ex.some(e=>e.catId===c.id)));
    datasets=ac.map(c=>({label:c.name,data:allData.map(ex=>ex.filter(e=>e.catId===c.id).reduce((s,e)=>s+e.amount,0)),backgroundColor:c.color,stack:'s',borderRadius:3}));
    tot=allData.reduce((s,ex)=>s+ex.reduce((a,e)=>a+e.amount,0),0);cnt=allData.reduce((s,ex)=>s+ex.length,0);days=365;
  }else{
    $('an-title').innerHTML='Yearly — <span class="ital">overview</span>';
    const yrs=[...new Set([...state.exps.map(e=>e.mk.split('-')[0]),...state.emis.map(e=>String(e.sy))])].sort();
    labels=yrs.length?yrs:[String(curY)];
    const allData=labels.map(y=>{const r=allCats().map(()=>0);for(let m=0;m<12;m++)cntExps(y+'-'+String(m+1).padStart(2,'0')).forEach(e=>{const ci=allCats().findIndex(c=>c.id===e.catId);if(ci>=0)r[ci]+=e.amount;});return r;});
    const ac=allCats().filter((c,ci)=>allData.some(r=>r[ci]>0));
    datasets=ac.map(c=>({label:c.name,data:labels.map((_,yi)=>allData[yi][allCats().indexOf(c)]||0),backgroundColor:c.color,stack:'s',borderRadius:4}));
    tot=allData.reduce((s,r)=>s+r.reduce((a,v)=>a+v,0),0);cnt=state.exps.length;days=365;
  }
  $('an-tot').textContent=fmt(tot);$('an-avg').textContent=fmt(days>0?tot/days:0);$('an-cnt').textContent=cnt;
  const act=datasets.filter(d=>d.data.some(v=>v>0));
  $('an-leg').innerHTML=act.map(d=>`<span class="li"><span class="ld" style="background:${d.backgroundColor}"></span>${d.label}</span>`).join('');
  if(anChart){anChart.destroy();anChart=null;}
  const gc=chartGrid();
  const catTotals=act.map(d=>({label:d.label,color:d.backgroundColor,total:d.data.reduce((a,v)=>a+v,0)})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const grandTot=catTotals.reduce((s,c)=>s+c.total,0);
  if(anChartType==='pie'||anChartType==='doughnut'){
    anChart=new Chart($('an-ch'),{type:anChartType,data:{labels:catTotals.map(c=>c.label),datasets:[{data:catTotals.map(c=>c.total),backgroundColor:catTotals.map(c=>c.color),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmt(Math.round(ctx.parsed))}${grandTot?' ('+Math.round((ctx.parsed/grandTot)*100)+'%)':''}`}}}}});
  } else if(anChartType==='line'){
    const lineSets=(act.length?act:[{label:'No data',data:labels.map(()=>0),backgroundColor:cssVar('--dim')}]).map(d=>({label:d.label,data:d.data,type:'line',fill:false,tension:.3,borderColor:d.backgroundColor,backgroundColor:d.backgroundColor,pointRadius:2,borderWidth:2}));
    anChart=new Chart($('an-ch'),{type:'line',data:{labels,datasets:lineSets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(Math.round(ctx.parsed.y))}`}}},scales:{x:{ticks:{autoSkip:labels.length>20,maxRotation:45,color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>sym()+Math.round(v).toLocaleString(CUR().locale),color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}}}}});
  } else {
    anChart=new Chart($('an-ch'),{type:'bar',data:{labels,datasets:act.length?act:[{label:'No data',data:labels.map(()=>0),backgroundColor:cssVar('--dim'),stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(Math.round(ctx.parsed.y))}`}}},scales:{x:{stacked:true,ticks:{autoSkip:labels.length>20,maxRotation:45,color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>sym()+Math.round(v).toLocaleString(CUR().locale),color:cssVar('--muted'),font:monoFont()},grid:gc,border:{display:false}}}}});
  }
  // Category breakdown: with 20+ categories a flat list gets unreadable, so it's
  // searchable and collapsed to the top 8 by spend with a "show all" expander.
  const bkdMatch=anBkdSearch?catTotals.filter(c=>c.label.toLowerCase().includes(anBkdSearch)):catTotals;
  const shown=anBkdExpanded?bkdMatch:bkdMatch.slice(0,8);
  const hiddenCount=bkdMatch.length-shown.length;
  $('an-bkd').innerHTML=`
    ${catTotals.length>8?`<input type="text" id="an-bkd-search" class="txn-cat-dd-search" style="margin-bottom:10px" placeholder="Filter categories…" value="${anBkdSearch.replace(/"/g,'&quot;')}" oninput="setAnBkdSearch(this.value)" autocomplete="off"/>`:''}
    ${shown.length?shown.map(c=>`<div class="ti"><div class="tidot" style="background:${c.color}"></div><div class="tib"><div class="tin">${c.label}</div><div class="bpw2" style="margin-top:6px"><div class="bpb2" style="width:${grandTot?Math.round((c.total/grandTot)*100):0}%;background:${c.color}"></div></div></div><div class="tia">${fmt(c.total)}</div><div style="font-size:11px;color:var(--muted);margin-left:10px;font-family:'JetBrains Mono',monospace">${grandTot?Math.round((c.total/grandTot)*100)+'%':''}</div></div>`).join(''):'<div class="empty">'+(anBkdSearch?'No matching categories':'Add expenses to see breakdown')+'</div>'}
    ${hiddenCount>0?`<button class="ghost" style="width:100%;margin-top:10px;padding:9px;font-size:12px" onclick="toggleAnBkdExpand()">Show all ${bkdMatch.length} categories</button>`:''}
    ${anBkdExpanded&&catTotals.length>8?`<button class="ghost" style="width:100%;margin-top:10px;padding:9px;font-size:12px" onclick="toggleAnBkdExpand()">Show top 8 only</button>`:''}
  `;
  if(window.lucide)lucide.createIcons();
}

// SAVINGS
// ════════════════════════════════════════════════════════
function getSavRows(){
  const rows=[];for(let i=11;i>=0;i--){let m=curM-i,y=curY;while(m<0){m+=12;y--;}rows.push([y,m]);}
  return rows.map(([y,m])=>{
    const mkey=mk(y,m),sal=state.salaries[mkey]||0,oi=state.otherIncome.filter(o=>o.mk===mkey).reduce((s,o)=>s+o.amount,0);
    const carry=getCarryover(y,m),exp=cntExps(mkey).reduce((s,e)=>s+e.amount,0);
    return{label:MOS3[m]+' '+String(y).slice(2),sal,oi,carry,exp,sav:sal+oi+carry-exp};
  });
}
function renderSav(){
  const data=getSavRows(),last=data[data.length-1];
  const carry=getCarryover(curY,curM);
  const hasSal=data.filter(d=>d.sal>0);
  const best=hasSal.length?[...hasSal].sort((a,b)=>b.sav-a.sav)[0]:null;
  const totIn=hasSal.reduce((s,d)=>s+d.sal+d.oi,0),totExp=hasSal.reduce((s,d)=>s+d.exp,0);
  const rate=totIn>0?Math.round(((totIn-totExp)/totIn)*100):null;
  $('main-content').innerHTML=`
    <div class="sav-grid">
      <div class="metric"><div class="metric-l">This Month</div><div class="metric-v ${last.sav>=0?'pos':'neg'}">${fmt(last.sav)}</div></div>
      <div class="metric"><div class="metric-l">Carry-in Balance</div><div class="metric-v ${carry>=0?'pos':'neg'}">${fmt(carry)}</div></div>
      <div class="metric"><div class="metric-l">Best Month</div><div class="metric-v sm">${best?best.label+' · '+fmt(best.sav):'Set salary to track'}</div></div>
      <div class="metric"><div class="metric-l">Avg Savings Rate</div><div class="metric-v ${rate!==null&&rate>=0?'pos':'neg'}">${rate!==null?rate+'%':'—'}</div></div>
    </div>
    <div class="panel no-tab-swipe" style="margin-bottom:14px">
      <div class="panel-t"><i data-lucide="trending-up" class="ic-sm"></i>Income vs Expenses — 12 months</div>
      <div class="leg"><span class="li"><span class="ld" style="background:#8cd9a0"></span>Income</span><span class="li"><span class="ld" style="background:#ff5e5e"></span>Expenses</span><span class="li"><span class="ld" style="background:var(--accent);border-radius:50%"></span>Savings</span></div>
      <div style="position:relative;width:100%;height:280px"><canvas id="s-ch"></canvas></div>
    </div>
    <div class="panel"><div class="panel-t"><i data-lucide="table" class="ic-sm"></i>Monthly Summary</div>
      <div class="no-tab-swipe" style="overflow-x:auto"><table class="sav-tbl">
        <thead><tr><th>Month</th><th>Salary</th><th>+Others</th><th>Carry In</th><th>Expenses</th><th>Saved This Month</th><th>Balance Carried Forward</th></tr></thead>
        <tbody>${data.map(d=>`<tr><td>${d.label}</td><td>${d.sal?fmt(d.sal):'—'}</td><td class="pos">${d.oi?'+'+fmt(d.oi):'—'}</td><td class="${d.carry>=0?'pos':'neg'}">${fmt(d.carry)}</td><td>${d.exp?fmt(d.exp):'—'}</td><td class="${d.sav>=0?'pos':'neg'}">${d.sal?fmt(d.sav):'—'}</td><td class="${(d.carry+d.sav)>=0?'pos':'neg'}">${d.sal?fmt(d.carry+d.sav):'—'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  if(savChart){savChart.destroy();savChart=null;}
  const gc=chartGrid();
  savChart=new Chart($('s-ch'),{data:{labels:data.map(d=>d.label),datasets:[

function setTxnCatDdSearch(v){ txnCatDdSearch=(v||'').toLowerCase(); renderTxn(); const el=document.getElementById('txn-cat-dd-search'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }
function toggleTxnCat(id){ if(txnFilterCats.has(id))txnFilterCats.delete(id); else txnFilterCats.add(id); renderTxn(); }

let txnSearch='';
function setTxnSearch(v){txnSearch=(v||'').toLowerCase();renderTxn();}

function renderTxn(){
  const me=curExps();
  let filtered=me;
  if(txnFilterCats.size) filtered=filtered.filter(e=>txnFilterCats.has(e.catId));
  // Full-text search across note, category, sub-category, amount, date
  if(txnSearch){
    const q=txnSearch;
    filtered=filtered.filter(e=>{
      const cat=getCat(e.catId);
      const sub=e.subId?(cat.subs||[]).find(s=>s.id===e.subId):null;
      const hay=[
        e.note||'',
        cat.name,
        sub?.name||'',
        String(e.amount),
        fmt(e.amount),
        e.date,
        fmtD(e.date),
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  const byDate={};
  [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(e=>{
    (byDate[e.date]=byDate[e.date]||[]).push(e);
  });
  const total=filtered.filter(e=>!e.ccBilled).reduce((s,e)=>s+e.amount,0);
  const usedCats=[...new Set(me.map(e=>e.catId))].map(id=>{const c=getCat(id);return{id,name:c.name,color:c.color};});
  const ddOptions=txnCatDdSearch?usedCats.filter(c=>c.name.toLowerCase().includes(txnCatDdSearch)):usedCats;

      ${txnSearch?`<button class="txn-search-clear" onclick="clearTxnSearch()" aria-label="Clear"><i data-lucide="x" class="ic-sm"></i></button>`:''}
    </div>
    <div class="txn-cat-dd">
      ${txnCatDdOpen?`<div class="txn-cat-dd-backdrop" onclick="toggleTxnCatDd(false)"></div>`:''}
      <button class="txn-cat-dd-btn" onclick="toggleTxnCatDd()">
        <span class="chips">${txnFilterCats.size?[...txnFilterCats].slice(0,4).map(id=>{const c=usedCats.find(x=>x.id===id);return c?`<span class="ld" style="background:${c.color};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px"></span>`:'';}).join(''):''}${ddLabel}</span>
        <i data-lucide="${txnCatDdOpen?'chevron-up':'chevron-down'}" class="ic-sm"></i>
      </button>
      ${txnCatDdOpen?`

        <input type="text" id="txn-cat-dd-search" class="txn-cat-dd-search" placeholder="Filter categories…" value="${txnCatDdSearch.replace(/"/g,'&quot;')}" oninput="setTxnCatDdSearch(this.value)" autocomplete="off"/>

let budgetSaveTimer=null;
function onBudgetInput(id,val,el){
  state.budgets[id]=parseFloat(val)||0;
  // Update this row's progress bar inline (no full re-render — keeps keyboard open)
  const row=el.closest('.bi');
  if(row){
    const me=cntCur();
    const c=getCat(id);
    const spent=me.filter(e=>e.catId===id).reduce((s,e)=>s+e.amount,0);
    const bgt=state.budgets[id]||0;
    const pct=bgt?Math.min(100,Math.round((spent/bgt)*100)):0;
    const over=bgt&&spent>bgt;
    let bar=row.querySelector('.bpw2'),foot=row.querySelector('.bi-foot');
    if(bgt){
      if(!bar){
        // First-time budget set — inject bar & footer
        row.insertAdjacentHTML('beforeend',
          `<div class="bpw2"><div class="bpb2" style="width:${pct}%;background:${over?'var(--danger)':c.color}"></div></div>
           <div class="bi-foot"><span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span></div>`);
      } else {
        bar.querySelector('.bpb2').style.width=pct+'%';
        bar.querySelector('.bpb2').style.background=over?'var(--danger)':c.color;
        foot.innerHTML=`<span>${fmt(spent)} of ${fmt(bgt)}</span><span style="color:${over?'var(--danger)':'inherit'};font-weight:600">${pct}%${over?' · OVER BUDGET':''}</span>`;
      }
    } else {
      if(bar)bar.remove();
      if(foot)foot.remove();
    }
  }
  // Debounced save (doesn't re-render)
  clearTimeout(budgetSaveTimer);
  budgetSaveTimer=setTimeout(()=>save(),600);
}

  const me=cntCur();

// ── Draft autosave for the Recurring form ───────────────────────────────
// Android WebViews (and sometimes Chrome) can kill/reload the page when the
// app is backgrounded, wiping any in-progress typing. We mirror the form's
// fields to localStorage on every change and restore them on render so
// switching apps or minimising never loses what you were adding.
const EMI_DRAFT_KEY='tln_emi_draft';
function saveEmiDraft(){
  try{
    const draft={
      name:$('e-name')?.value||'', amt:$('e-amt')?.value||'', cat:$('e-cat')?.value||'',
      start:$('e-start')?.value||'', months:$('e-months')?.value||'', day:$('e-day')?.value||''
    };
    localStorage.setItem(EMI_DRAFT_KEY,JSON.stringify(draft));
  }catch(e){}
}
function restoreEmiDraft(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(EMI_DRAFT_KEY)||'null');}catch(e){}
  if(!d)return;
  if(d.name&&$('e-name'))$('e-name').value=d.name;
  if(d.amt&&$('e-amt'))$('e-amt').value=d.amt;
  if(d.cat&&$('e-cat'))$('e-cat').value=d.cat;
  if(d.start&&$('e-start'))$('e-start').value=d.start;
  if(d.months&&$('e-months'))$('e-months').value=d.months;
  if(d.day&&$('e-day'))$('e-day').value=d.day;
}
function clearEmiDraft(){ try{localStorage.removeItem(EMI_DRAFT_KEY);}catch(e){} }

            </div>
            <div class="acct-email">${currentUser?.email||'—'}</div>
          </div>
          <button class="ghost acct-signout" onclick="doSignOut()" title="Sign out"><i data-lucide="log-out" class="ic-sm"></i><span>Sign out</span></button>
        </div>
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>Security</em></div>
        <div class="set-sub">${currentUser?.id==='demo-local'?'Demo mode has no real account — sign up for one to manage a password.':'Change your password. You\'ll need to confirm your current one first.'}</div>
        <div class="set-row">
          <div><div class="set-rl">Password</div><div class="set-rs">••••••••</div></div>
          ${currentUser?.id==='demo-local'?'':`<button class="ghost" onclick="openChangePassword()"><i data-lucide="key-round" class="ic-sm"></i>Change password…</button>`}
        </div>
      </div>

      <div class="set-section">
        <div class="set-h"><em>Atmosphere</em></div>
        <div class="set-sub">Pick a theme. Your choice syncs across all your devices.</div>
        <div class="th-grid">${themes.map(t=>`
          <div class="th-card${state.theme===t.id?' active':''}" data-tt="${t.id}" onclick="setTheme('${t.id}',event)">
            <div class="th-preview"></div>
            <div></div>
            <div>
              <div class="th-card-name">${t.name}</div>
              <div class="th-card-desc">${t.desc}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>

      <div class="set-section">
        <div class="set-h"><em>Currency</em></div>
        <div class="set-sub">Pick the currency amounts display in. ${CURRENCIES.length} options.</div>
        <button class="ghost" style="width:100%;justify-content:center;padding:16px;font-size:14px;border-radius:14px" onclick="setTab('cur')">
          <i data-lucide="coins" class="ic-sm"></i>
          Manage Currency · <span style="color:var(--accent);font-weight:600">${CUR().code} ${CUR().symbol}</span>
          <i data-lucide="chevron-right" class="ic-sm" style="margin-left:auto"></i>
        </button>
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>Import statement</em></div>
        <div class="set-sub">Add many transactions at once from a bank or credit-card statement (CSV or Excel) instead of typing them in.</div>
        <button class="ghost" style="width:100%;justify-content:center;padding:16px;font-size:14px;border-radius:14px" onclick="impOpen()">
          <i data-lucide="file-up" class="ic-sm"></i>
          Import from file
          <i data-lucide="chevron-right" class="ic-sm" style="margin-left:auto"></i>
        </button>
        ${(()=>{const L=ccLegacyLumps();return L.length?`<div class="set-row" style="margin-top:12px"><div><div class="set-rl">Split past card payments by category</div><div class="set-rs">${L.length} older card payment${L.length===1?'':'s'} show as one “Miscellaneous” line. Split them into the original categories and stop double-counting those purchases.</div></div><button class="ghost" onclick="ccRelabelPast()">Split</button></div>`:'';})()}
        ${(()=>{const lb=impLastBatch();return lb?`<div class="set-row" style="margin-top:12px"><div><div class="set-rl">Undo last import</div><div class="set-rs">Removes everything added by your most recent import (${lb.n} item${lb.n===1?'':'s'}) and restores salary and card-bill totals.</div></div><button class="ghost" onclick="impUndoLast()">Undo</button></div>`:'';})()}
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>Categories</em></div>
        <div class="set-sub">Rename, recolor, add sub-categories, or create custom categories.</div>
        <button class="ghost" style="width:100%;justify-content:center;padding:16px;font-size:14px;border-radius:14px" onclick="setTab('cat')">
          <i data-lucide="layout-grid" class="ic-sm"></i>
          Manage Categories
          <i data-lucide="chevron-right" class="ic-sm" style="margin-left:auto"></i>
        </button>
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>Credit Card</em></div>
        <div class="set-sub">Configure how credit-card bills are grouped. Purchases you tag <b>Paid with CC</b> during the statement window will roll into this month's bill.</div>
        <div class="set-row">
          <div><div class="set-rl">Statement cut-off day</div><div class="set-rs">Day of the month your card closes its statement. Leave blank for calendar month (1st → last day).</div></div>
          <input type="number" id="set-cc-cut" min="0" max="28" value="${(state.settings&&state.settings.ccCutoffDay)||''}" placeholder="0 = off" onchange="setCcCutoff(this.value)" style="width:90px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);font-family:'JetBrains Mono',monospace;text-align:center"/>
        </div>
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>Notifications</em></div>
        <div class="set-sub">${_notifTier()==='capacitor'
          ? 'Budget & bill alerts appear as in-app banners while the app is open. No extra permissions needed.'
          : 'Get nudged when you cross budget thresholds (50% · 80% · 100%) and when your credit-card bill needs attention. Notifications fire while TheLittleNaga is open in a tab or installed as a PWA.'
        }</div>
        <div class="set-row">
          <div>
            <div class="set-rl">Budget & bill alerts</div>
            <div class="set-rs">${(()=>{
              const t=_notifTier();
              if(t==='none')return'Not supported on this device';
              if(t==='capacitor')return state.settings?.notifEnabled?'✓ Enabled — alerts show as in-app banners':'Disabled — tap Enable to turn on';
              // browser
              if(Notification.permission==='granted')return state.settings?.notifEnabled?'✓ Enabled · permission granted':'Permission granted — tap Enable to turn on';
              if(Notification.permission==='denied')return'Blocked — enable in your browser settings first';
              return'Not requested yet';
            })()}</div>
          </div>
          ${notifSupported()?(state.settings?.notifEnabled
            ? `<button class="ghost" onclick="disableNotifs()"><i data-lucide="bell-off" class="ic-sm"></i>Turn off</button>`
            : `<button class="primary" onclick="requestNotifPermission().then(ok=>ok&&render())"><i data-lucide="bell" class="ic-sm"></i>Enable</button>`
          ):'<span style="font-size:12px;color:var(--dim)">—</span>'}
        </div>
        ${state.settings?.notifEnabled?`
        <div class="set-row">
          <div><div class="set-rl">Background push</div><div class="set-rs">${VAPID_PUBLIC_KEY==='YOUR_VAPID_PUBLIC_KEY_HERE'?'⚠ VAPID key not configured — see setup guide below':'✓ VAPID configured · Edge Function sends alerts even when app is closed'}</div></div>
          ${VAPID_PUBLIC_KEY!=='YOUR_VAPID_PUBLIC_KEY_HERE'?`<button class="ghost" onclick="registerPushSubscription().then(()=>showToast('Subscription refreshed ✓','check'))"><i data-lucide="radio" class="ic-sm"></i>Re-subscribe</button>`:''}
        </div>
        <div class="set-row">
          <div><div class="set-rl">Test in-app alert</div><div class="set-rs">Fires an alert right now — works even without the Edge Function.</div></div>
          <button class="ghost" onclick="_fireNotif('TheLittleNaga test','If you see this, alerts work ✓','test-'+Date.now())?showToast('Sent ✓'):showToast('Failed','x')"><i data-lucide="zap" class="ic-sm"></i>Send test</button>
        </div>`:''}
        <div class="set-row">
          <div><div class="set-rl">Reset alert history</div><div class="set-rs">Each budget alert fires once per month — resetting lets them fire again this month. Clears automatically at the start of each new month.</div></div>
          <button class="ghost" onclick="resetNotifState()"><i data-lucide="rotate-ccw" class="ic-sm"></i>Reset now</button>
        </div>
      </div>

      <div class="set-section" style="grid-column:1/-1;border-color:color-mix(in srgb,var(--danger) 30%,var(--border-strong))">
        <div class="set-h" style="color:var(--danger)"><em>Danger Zone</em></div>
        <div class="set-sub">Permanently erase every expense, income entry, budget, recurring charge, and custom category — locally and in the cloud.</div>
        <div class="set-row">
          <div><div class="set-rl">Wipe all data</div><div class="set-rs">Starts you over from scratch. Your sign-in, theme, and currency are kept.</div></div>
          <button class="ghost" style="border-color:var(--danger);color:var(--danger)" onclick="wipeAllData()"><i data-lucide="trash-2" class="ic-sm"></i>Wipe data…</button>
        </div>
      </div>

      <div class="set-section" style="grid-column:1/-1">
        <div class="set-h"><em>About</em></div>
        <div class="set-row">
          <div><div class="set-rl">TheLittleNaga</div><div class="set-rs">v4.1</div></div>
        </div>
      </div>
    </div>`;
  if(window.lucide)lucide.createIcons();
}

// ════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════
function render(){
  const lbl=MOS3[curM]+' '+curY;
  if($('d-mlbl'))$('d-mlbl').textContent=lbl;
  if($('month-mob-lbl'))$('month-mob-lbl').textContent=lbl;
  if(activeTab==='dash')renderDash();
  else if(activeTab==='txn')renderTxn();
  else if(activeTab==='an')renderAn();
  else if(activeTab==='sav')renderSav();
  else if(activeTab==='bud')renderBud();
  else if(activeTab==='emi')renderEmi();
   else if(activeTab==='set')renderSet();
   else if(activeTab==='cat')renderCat();
   else if(activeTab==='cur')renderCur();
   else if(activeTab==='notif')renderNotif();
  _updateNotifBadge();
  // Fire queued notifications (guarded, debounced via internal flags)
  if(typeof runAllNotifChecks==='function')setTimeout(runAllNotifChecks,50);
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
anY=curY;anM=curM;
try{ history.replaceState({tln:1,tab:'home'},''); }catch(e){}
if(window.lucide)lucide.createIcons();
initAuth();

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&currentUser)refreshFromSupabase();});
window.addEventListener('focus',()=>{if(currentUser)refreshFromSupabase();});
async function refreshFromSupabase(){
  try{
    // Don't clobber the user if they're typing something
    const ae=document.activeElement;
    const isTyping=ae && (ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA');
    // Also don't re-render if a bottom sheet is open with unsaved input
    const sheetOpen=document.getElementById('sheet')?.classList.contains('on');
    const{data,error}=await sb.from('tracker').select('data').eq('id',getUid()).single();
    if(error||!data?.data)return;
    const p=JSON.parse(data.data);
    state={exps:p.exps||[],budgets:p.budgets||{},emis:p.emis||[],salaries:p.salaries||{},otherIncome:p.otherIncome||[],uid:p.uid||0,currency:p.currency||'INR',theme:p.theme||state.theme,creditPaid:p.creditPaid||{},impLog:p.impLog||{},customCats:p.customCats||[],settings:Object.assign({ccCutoffDay:0,notifEnabled:false},p.settings||{}),notifState:p.notifState||{},catOverrides:p.catOverrides||{},customSubs:p.customSubs||{},notifLog:p.notifLog||[]};
    if(p.curY)curY=p.curY;if(p.curM!==undefined)curM=p.curM;
    setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
    if(isTyping||sheetOpen)return; // skip render — keep user's input intact
    render();
  }catch(e){}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
