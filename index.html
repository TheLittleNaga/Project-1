function openChangePassword(){
  $('cdlg-box').innerHTML=`
    <div class="cdlg-title">Change password</div>
    <div class="cdlg-msg">Enter your current password and choose a new one.</div>
    <input class="cdlg-input" id="cp-old" type="password" placeholder="Current password" autocomplete="current-password"/>
    <input class="cdlg-input" id="cp-new" type="password" placeholder="New password (min 6 chars)" style="margin-top:10px" autocomplete="new-password"/>
    <input class="cdlg-input" id="cp-new2" type="password" placeholder="Confirm new password" style="margin-top:10px" autocomplete="new-password"/>
    <div class="cdlg-msg" id="cp-err" style="display:none;color:var(--danger);margin:10px 0 0"></div>
    <div class="cdlg-btns"><button class="cdlg-cancel" id="cp-cancel">Cancel</button><button class="cdlg-ok" id="cp-save">Update password</button></div>`;
  $('cdlg-bg').classList.add('on');
  setTimeout(()=>{const inp=$('cp-old');if(inp)inp.focus();},100);
  $('cp-cancel').onclick=()=>_closeCdlg();
  $('cp-save').onclick=async()=>{
    const oldPass=$('cp-old').value, p1=$('cp-new').value, p2=$('cp-new2').value;
    const err=$('cp-err');err.style.display='none';
    const email=currentUser?.email;
    if(!oldPass){err.textContent='Enter your current password.';err.style.display='';return;}
    if(p1.length<6){err.textContent='New password must be at least 6 characters.';err.style.display='';return;}
    if(p1!==p2){err.textContent="Passwords don't match.";err.style.display='';return;}
    if(p1===oldPass){err.textContent='New password must be different from the current one.';err.style.display='';return;}
    const btn=$('cp-save');btn.disabled=true;btn.textContent='Checking…';
    try{
      // Reauthenticate with the current password first — refreshes the
      // session so it counts as "recently logged in" (satisfies your
      // Secure password change setting), and gives a clean "wrong password"
      // error before we even try the update.
      const{error:sErr}=await sb.auth.signInWithPassword({email,password:oldPass});
      if(sErr)throw new Error('Current password is incorrect.');
      btn.textContent='Updating…';
      // current_password is required here because "Require current password
      // when updating" is turned on in your Supabase Auth settings — without
      // it, updateUser() rejects the request even with a fresh session.
      const{error:uErr}=await sb.auth.updateUser({password:p1,current_password:oldPass});
      if(uErr)throw uErr;
      hapticDone();_closeCdlg();showToast('Password updated ✓','check');
    }catch(e){
      hapticError();
      err.textContent=e.message||'Could not update your password.';err.style.display='';
      btn.disabled=false;btn.textContent='Update password';
    }
  };
}

const TAB_ORDER=['dash','txn','an','sav','bud','emi']; // Settings kept separate — not in swipe ring
let touchStart=null, touchMoved=null, ptrPulling=false, swipeBlocked=false;
let _gesturesAttached=false;

function attachGestures(){
  const scroll=document.getElementById('mainScroll');
  const ptr=document.getElementById('ptr');
  if(!scroll||!ptr||_gesturesAttached)return;
  _gesturesAttached=true;

  function onTouchStart(e){
    if(!document.body.classList.contains('app-mode'))return;
    if(e.touches.length!==1)return;
    if(document.getElementById('sheet')?.classList.contains('on'))return;
    if(document.getElementById('shell').classList.contains('menu-open'))return;
    if(document.querySelector('.cdlg-bg.on'))return;
    const t=e.touches[0];
    const vh=window.innerHeight||document.documentElement.clientHeight;
    // Block TAB swipe from top half — PTR is still allowed from anywhere when at top.
    // Also block it entirely inside elements marked .no-tab-swipe (e.g. the Savings
    // chart and horizontally-scrollable table), no matter where on screen they sit,
    // so scrolling/panning those doesn't accidentally flip to the next tab.
    const exemptZone = e.target.closest && e.target.closest('.no-tab-swipe');
    swipeBlocked = exemptZone ? true : (t.clientY < vh*0.5);
    touchStart={x:t.clientX,y:t.clientY,t:Date.now(),scrollTop:scroll.scrollTop};
    touchMoved=null;ptrPulling=false;
  }

  function onTouchMove(e){
    if(!touchStart)return;
    if(activeTab==='set'||activeTab==='cat'||activeTab==='cur')return;
    const t=e.touches[0];
    const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    touchMoved={dx,dy};
    // Pull-to-refresh: at scroll top, dragging down, mostly vertical
    if(touchStart.scrollTop<=2 && dy>8 && Math.abs(dy)>Math.abs(dx)*0.8){
      ptrPulling=true;
      const pull=Math.min(80,dy*0.55);
      ptr.style.transform=`translate(-50%, ${pull-10}px)`;
      ptr.classList.toggle('show',pull>12);
      if(pull>60)ptr.classList.add('spin'); else ptr.classList.remove('spin');
    }
  }

  function onTouchEnd(){
    if(!touchStart){return;}
    const moved=touchMoved||{dx:0,dy:0};
    const{dx,dy}=moved;
    const dt=Date.now()-touchStart.t;

    if(ptrPulling){
      // Trigger refresh if pulled far enough (real dy > 80px)
      if(dy>80){
        ptr.classList.add('spin','show');
        ptr.style.transform='translate(-50%, 30px)';
        hapticDone();
        const done=()=>{
          showToast('Refreshed ✓','check');
          setTimeout(()=>{
            ptr.style.transform='translate(-50%,-120%)';
            ptr.classList.remove('show','spin');
          },500);
        };
        if(currentUser && currentUser.id!=='demo-local'){
          refreshFromSupabase().finally(done);
        } else {
          setSyncStatus('ok','Demo · refreshed');
          render();
          done();
        }
      } else {
        ptr.style.transform='translate(-50%,-120%)';
        ptr.classList.remove('show','spin');
      }
    }
    // Horizontal tab swipe — only from bottom half, fast enough, clearly horizontal
    else if(!swipeBlocked && Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.8 && dt<450){
      const idx=TAB_ORDER.indexOf(activeTab);
      if(idx>=0){
        const next=dx<0 ? Math.min(TAB_ORDER.length-1,idx+1) : Math.max(0,idx-1);
        if(next!==idx){ hapticSwipe(); setTab(TAB_ORDER[next]); }
      }
    }
    touchStart=null;touchMoved=null;ptrPulling=false;swipeBlocked=false;
  }

  scroll.addEventListener('touchstart', onTouchStart, {passive:true});
  scroll.addEventListener('touchmove',  onTouchMove,  {passive:true});
  scroll.addEventListener('touchend',   onTouchEnd,   {passive:true});
}

// Merge user-defined custom categories + overrides + custom subs into the effective cat list.
function allCats(){
  const overrides=state.catOverrides||{};
  const customSubs=state.customSubs||{};
  const apply=c=>{
    const ov=overrides[c.id]||{};
    const builtSubs=c.subs||[];
    const userSubs=customSubs[c.id]||[];
    const subs=[...builtSubs,...userSubs];
    return{
      ...c,
      name:ov.name||c.name,
      color:ov.color||c.color,
      subs:subs.length?subs:undefined,
      excludeFromBudget:ov.excludeFromBudget!==undefined?ov.excludeFromBudget:!!c.excludeFromBudget,
    };
  };
  const builtIns=CATS.map(apply);
  const custom=(state.customCats||[]).map(c=>apply({...c,custom:true}));
  return [...builtIns,...custom];
}

// YYYY-MM-DD from LOCAL date parts (toISOString() converts to UTC, which shifts dates by a day in India)
function ymdLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayYMD(){return ymdLocal(todayLocal());}
// date string + k months (day clamped to month length) → {date,y,m}
function addMonthsYMD(ymd,k){
  const y=+ymd.slice(0,4),m=+ymd.slice(5,7)-1,d=+ymd.slice(8,10);
  const yy=y+Math.floor((m+k)/12),mm=(((m+k)%12)+12)%12,dim=new Date(yy,mm+1,0).getDate();
  return{date:yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(Math.min(d,dim)).padStart(2,'0'),y:yy,m:mm};
}
// "4000, 4000, 2000" / "4000+4000+2000" → [4000,4000,2000]   (no thousands separators)
function parseAmountList(str){
  return String(str==null?'':str).replace(/[₹$]/g,'').split(/[,;+\s]+/).map(x=>parseFloat(x)).filter(x=>x>0);
}
// Installment amounts for a card EMI. Always adds up to the exact total (no lost/extra paise):
//  · custom list      → used as given (bank-specific patterns like 4000+4000+2000)
//  · advance + months → advance paid up-front, the rest split equally (remainder paise on the last one)
//  · plain months     → equal split, remainder paise on the last one
function buildSplitSchedule(amount,months,ratePct,advance,custom){
  const r2=x=>Math.round(x*100)/100;
  if(custom&&custom.length>=2)return custom.map(r2);
  const n=Math.max(1,Math.min(60,Math.floor(months)||1));
  const total=r2(amount*(1+((ratePct||0)/100)*(n/12)));
  const adv=Math.min(Math.max(advance||0,0),total);
  const rest=r2(total-adv);
  const base=Math.floor(rest/n*100)/100;
  const arr=Array(n).fill(base);
  arr[n-1]=r2(arr[n-1]+(rest-base*n));
  return adv>0?[r2(adv),...arr]:arr;
}

async function wipeAllData(){
  const step1=await confirmAsync('This permanently deletes every expense, income entry, budget, recurring/EMI charge, and custom category — on this device and in the cloud. Your sign-in, theme, and currency choice are kept. This cannot be undone.',{title:'Wipe all data?',danger:true,okText:'Continue',cancelText:'Cancel'});
  if(!step1)return;
  const typed=await promptAsync('Type WIPE (all caps) to confirm.','',{title:'Final confirmation',okText:'Wipe everything'});
  if(typed!=='WIPE'){showToast('Cancelled — nothing was deleted');return;}

  const uid=getUid();
  const wiped={exps:[],budgets:{},emis:[],salaries:{},otherIncome:[],uid:0,currency:state.currency,theme:state.theme,creditPaid:{},customCats:[],settings:Object.assign({},state.settings,{notifEnabled:false}),notifState:{},catOverrides:{},customSubs:{},notifLog:[]};
  const nowIst=(function(){try{return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));}catch(e){return new Date();}})();
  const wipeY=nowIst.getFullYear(), wipeM=nowIst.getMonth();

  // Close anything that might be holding a reference to a soon-to-be-deleted
  // item (an open bottom sheet, the drawer) before we swap the state out.
  try{closeSheet();}catch(e){}
  try{toggleMenu(false);}catch(e){}
  // Kill any pending debounced autosave of the OLD (pre-wipe) data — otherwise
  // it can fire *after* the wipe and silently re-upload the old numbers.
  clearTimeout(saveTimer);

  // Demo mode / not signed in — nothing lives in the cloud, just clear locally.
  if(uid==='anon'||currentUser?.id==='demo-local'){
    state=wiped;curY=wipeY;curM=wipeM;
    try{localStorage.removeItem('et_'+uid);localStorage.removeItem('et_demo');}catch(e){}
    hapticDone();showToast('All data wiped ✓','check');
    setTab('dash',{silent:true});
    return;
  }

  showToast('Wiping…');
  try{
    // Write the wipe straight to Supabase and WAIT for confirmation — this is
    // the fix. The old code called the debounced save() and immediately told
    // you it was done; if that background save failed (flaky connection,
    // Android cold-network hiccup, etc.) it failed silently and the untouched
    // row in Supabase would sync your old data straight back down — via the
    // realtime listener, or the next time the app loads.
    const{error}=await sb.from('tracker').upsert(
      {id:uid,data:JSON.stringify({...wiped,curY:wipeY,curM:wipeM}),updated_at:new Date().toISOString()},
      {onConflict:'id'}
    );
    if(error)throw error;
    state=wiped;curY=wipeY;curM=wipeM;
    try{localStorage.setItem('et_'+uid,JSON.stringify({...state,curY,curM}));}catch(e){}
    setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString(CUR().locale,{hour:'2-digit',minute:'2-digit'}));
    hapticDone();showToast('All data wiped ✓','check');
  }catch(e){
    console.warn('Wipe failed to sync to cloud:',e);
    hapticError();
    showToast('Wipe failed — check your connection and try again','x');
    return; // don't touch local state/UI — old data is still the truth until the cloud write succeeds
  }
  setTab('dash',{silent:true});
}

function getCarryover(toY,toM){
  const keys=Object.keys(state.salaries).filter(k=>state.salaries[k]>0).sort();
  if(!keys.length)return 0;
  const[sy0,sm0]=keys[0].split('-').map(Number);
  let y=sy0,m=sm0-1,carry=0,n=0;
  while(y*12+m<toY*12+toM&&n++<500){
    const mkey=mk(y,m);
    const sal=state.salaries[mkey]||0;
    const oi=state.otherIncome.filter(o=>o.mk===mkey).reduce((s,o)=>s+o.amount,0);
    // Only count expenses that actually left the wallet (exclude unpaid CC)
    const spent=allExps(mkey).filter(e=>!isCCUnpaid(e)&&!e.ccBilled).reduce((s,e)=>s+e.amount,0);
    carry+=sal+oi-spent;
    if(++m>11){m=0;y++;}
  }
  return carry;
}
function getEmiExps(mkey){
  const[ys,ms]=mkey.split('-').map(Number),mo=ms-1,ci=ys*12+mo;
  // If mkey is the real-world CURRENT month, a recurring charge whose due day
  // hasn't arrived yet shouldn't be deducted from the balance today — e.g. a
  // due-day-4 subscription shouldn't already show as spent on the 1st.
  // Past months and months already fully elapsed always include it (it happened);
  // future months (browsing ahead) show it as a forecast either way.
  const today=todayLocal(),realCi=today.getFullYear()*12+today.getMonth(),isRealCurrentMonth=(ci===realCi);
  return state.emis.filter(e=>{
    const si=e.sy*12+e.sm;
    if(ci<si||ci>=si+e.months)return false;
    if(isRealCurrentMonth&&e.day>today.getDate())return false;
    return true;
  }).map(e=>({
    id:'emi_'+e.id+'_'+mkey,catId:e.catId,subId:null,amount:e.amount,
    date:mkey+'-'+String(e.day).padStart(2,'0'),note:e.name,mk:mkey,isEmi:true
  }));
}
function allExps(mkey){return[...state.exps.filter(e=>e.mk===mkey),...getEmiExps(mkey)];}
function curExps(){return allExps(mk());}
// "Counted" entries = everything except card purchases already settled by a bill payment.
// Those purchases are represented by the per-category CC payment lines instead, so they must not count twice.
function cntExps(mkey){return allExps(mkey).filter(e=>!e.ccBilled);}
function cntCur(){return cntExps(mk());}
// Settle card charges: one payment line PER CATEGORY (so analytics keep the original categories),
// mark the charges as settled, return the ids that were newly flagged.
function ccSettleCharges(ids,amount,billKey,entryMk,dateStr,extra){
  const[yy,mm]=billKey.split('-').map(Number);
  const label=`${MOS3[(mm-1+11)%12]} bill`;
  const groups={},flagged=[];
  ids.forEach(id=>{
    const c=state.exps.find(x=>x.id===id);if(!c)return;
    const k=c.catId+'|'+(c.subId||'');
    const g=groups[k]=groups[k]||{catId:c.catId,subId:c.subId||null,amount:0,ids:[]};
    g.amount+=c.amount;g.ids.push(c.id);
    if(!c.ccPaid)flagged.push(c.id);
    c.ccPaid=true;c.ccBilled=true;
  });
  const pg='pg'+Date.now().toString(36)+state.uid;
  let used=0;
  Object.values(groups).forEach(g=>{
    const amt=Math.round(g.amount*100)/100;used+=amt;
    const cat=getCat(g.catId),sub=g.subId?getSub(g.catId,g.subId):null;
    state.exps.push(Object.assign({id:++state.uid,catId:g.catId,subId:g.subId,amount:amt,date:dateStr,
      note:`CC payment · ${label} · ${sub?sub.name:cat.name} (${g.ids.length} item${g.ids.length===1?'':'s'})`,
      ccPayment:true,ccPaidFor:g.ids,payGroup:pg,mk:entryMk},extra||{}));
  });
  const rest=Math.round((amount-used)*100)/100;
  if(rest>0.004){
    state.exps.push(Object.assign({id:++state.uid,catId:'misc',subId:null,amount:rest,date:dateStr,
      note:`CC payment · ${label}`+(used>0?' · fees / part-payment':''),ccPayment:true,payGroup:pg,mk:entryMk},extra||{}));
  }
  return flagged;
}
// Older single "Miscellaneous" payments that know which purchases they paid for can be split retroactively
function ccLegacyLumps(){
  return state.exps.filter(e=>e.ccPayment&&!e.payGroup&&Array.isArray(e.ccPaidFor)&&e.ccPaidFor.length&&e.ccPaidFor.some(id=>state.exps.some(c=>c.id===id)));
}
async function ccRelabelPast(){
  const L=ccLegacyLumps();
  if(!L.length){showToast('Nothing to split','x');return;}
  const total=L.reduce((a,e)=>a+e.amount,0);
  const ok=await confirmAsync(`${L.length} past card payment${L.length===1?'':'s'} (${fmt(total)}) will be split into one line per category, using the purchases each one paid for. The original purchases stop being counted a second time, so some past monthly totals will go DOWN to the correct figure. This can't be undone automatically.`,{title:'Split past card payments?',okText:'Split them',cancelText:'Not now'});
  if(!ok)return;
  for(const lump of L){
    const ids=lump.ccPaidFor.filter(id=>state.exps.some(c=>c.id===id));
    state.exps=state.exps.filter(e=>e!==lump);
    ccSettleCharges(ids,lump.amount,lump.mk,lump.mk,lump.date,{});
  }
  save();render();
  showToast(`Split ${L.length} payment${L.length===1?'':'s'} by category`,'check');
}

// Cancelling a recurring entry should stop FUTURE billing only — any month that
// already happened (this month included, if today's date is past the due day)
// must keep showing its historical charge. So instead of always deleting the
// entry outright, we usually just cap its `months` so it stops generating
// virtual expenses going forward, while past months remain untouched.
function stopRecurringFromNow(e){
  const today=new Date();
  const ciNow=today.getFullYear()*12+today.getMonth();
  const si=e.sy*12+e.sm;
  if(ciNow<si)return null; // never billed yet — safe to fully delete
  const billedThisMonth=today.getDate()>=e.day;
  const lastIncluded=billedThisMonth?ciNow:ciNow-1; // keep this month only if already charged
  const newMonths=lastIncluded-si+1;
  return newMonths>0?newMonths:null; // null = nothing to keep, fully delete
}
async function delEmi(id){
  const e=state.emis.find(x=>x.id===id);if(!e)return;
  const isOngoing=e.months>=900;

  if(!await confirmAsync(msg,{title:'Remove recurring',danger:true,okText:'Remove',cancelText:'Cancel'}))return;
  const newMonths=stopRecurringFromNow(e);
  if(newMonths===null){state.emis=state.emis.filter(x=>x.id!==id);}
  else{e.months=newMonths;}
  save();hapticTick();render();
}

let _quickPayCcLock=false;
function _quickPayCc(mkey){
  promptAsync('Amount to pay (applied to oldest unpaid charges first):','',{title:'Custom payment',okText:'Pay'}).then(raw=>{
    if(!raw)return;
    if(_quickPayCcLock)return;
    const amt=parseFloat(raw);
    if(!amt||amt<=0){showToast('Invalid amount','x');hapticError();return;}
    _quickPayCcLock=true;
    setTimeout(()=>{_quickPayCcLock=false;},600);
    const[yy,mm]=mkey.split('-').map(Number);
    const bill=getCreditBill(yy,mm-1);
    // FIFO-fill: walk oldest→newest, settle whole charges until the amount runs out
    const sorted=bill.charges.slice().sort((a,b)=>a.date.localeCompare(b.date));
    let left=amt;const covered=[];
    for(const ch of sorted){
      if(left<=0)break;
      if(typeof ch.id==='number'&&left>=ch.amount-0.001){covered.push(ch.id);left-=ch.amount;}
    }
    const cur=_ccPaidRaw(mkey);const base=cur===-1?0:cur;
    _ccSetPaid(mkey,base+amt);
    const today=todayYMD();
    ccSettleCharges(covered,amt,mkey,mkey,today,{});
    save();hapticDone();closeSheet();
    showToast(`Paid ${fmt(amt)} ✓`,'check');
    render();
  });
}

async function resetCcPayment(mkey){if(!await confirmAsync('Mark this entire bill as unpaid?',{title:'Reset payment',danger:true,okText:'Reset',cancelText:'Cancel'}))return;
  _ccSetPaid(mkey,0);
  hapticTick();showToast('Reset');render();
}

// Credit card bill for current month.
// Default: sums last month's CC-flagged charges (catId==='credit' OR paidWithCC===true).
// If settings.ccCutoffDay is set (1-28), uses a statement cut-off window:
//   charges from (prev_cutoff + 1) through (this_cutoff) inclusive.
function getCreditBill(y,m){
  const cut=parseInt((state.settings||{}).ccCutoffDay)||0;
  // A charge that goes on the credit-card bill:
  //  • catId 'credit' OR paidWithCC===true
  //  • NOT a repayment (ccPayment:true)
  //  • NOT already marked paid-in-month (ccPaid:true)
  const isCC=e=>(e.catId==='credit'||e.paidWithCC===true)&&!e.ccPayment&&!e.ccPaid&&!e.prepaid;
  let charges,sourceMkey;
  if(cut>=1&&cut<=28){
    const pm=prevMkey(y,m);
    const startDate=mkFromParts(...pm.split('-').map(Number))+'-'+String(cut+1).padStart(2,'0');
    const endDate=y+'-'+String(m+1).padStart(2,'0')+'-'+String(cut).padStart(2,'0');
    charges=[...allExps(pm),...allExps(mk(y,m))].filter(e=>isCC(e)&&e.date>=startDate&&e.date<=endDate);
    sourceMkey=pm+' · cut-off day '+cut;
  } else {
    const pm=prevMkey(y,m);
    charges=allExps(pm).filter(isCC);
    sourceMkey=pm;
  }
  const total=charges.reduce((s,e)=>s+e.amount,0);
  const key=mk(y,m);
  let raw=_ccPaidRaw(key);
  const paidAmount= raw===-1 ? total : Math.min(raw,total);
  const remaining=Math.max(0,total-paidAmount);
  const paid= total>0 && paidAmount>=total-0.001;
  return{total,charges,paid,paidAmount,remaining,sourceMkey,mkey:key};
}
// Helper: build 'YYYY-MM' from numeric y,m (1-indexed month here → convert)
function mkFromParts(y,m){return y+'-'+String(m).padStart(2,'0');}

// ════════════════════════════════════════════════════════
// NOTIFICATIONS (Level 1 · local, fires when app is open)
// ════════════════════════════════════════════════════════
// ── Notification capability detection ──────────────────────────────────────
// Three tiers:
//   'capacitor' — Capacitor APK / file:// WebView (no Web Notification API)
//                 → deliver via in-app toast banners (no OS permission needed)
//   'browser'   — Chrome/Firefox with Notification API available
//   'none'      — environment that genuinely doesn't support any alert channel
function _notifTier(){
  const isCapacitor=!!(window.Capacitor)||document.URL.startsWith('file://');
  if(isCapacitor)return'capacitor';
  if('Notification'in window&&typeof Notification.requestPermission==='function')return'browser';
  return'none';
}
function notifSupported(){return _notifTier()!=='none';}
function notifReady(){
  const t=_notifTier();
  if(t==='capacitor')return!!((state.settings||{}).notifEnabled);
  if(t==='browser')return Notification.permission==='granted'&&!!((state.settings||{}).notifEnabled);
  return false;
}
async function requestNotifPermission(){
  const t=_notifTier();
  if(t==='none'){showToast('Alerts not supported on this device','x');return false;}
  if(t==='capacitor'){
    // No OS permission needed — alerts delivered as in-app banners
    state.settings=state.settings||{};
    state.settings.notifEnabled=true;save();hapticTick();
    showToast('Budget alerts enabled ✓','check');
    return true;
  }
  // browser tier
  if(Notification.permission==='denied'){showToast('Enable notifications in your browser settings','x');return false;}
  if(Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted'){showToast('Permission denied','x');return false;}
  }
  state.settings=state.settings||{};
  state.settings.notifEnabled=true;save();hapticTick();
  showToast('Notifications enabled ✓','check');
  // Subscribe this device to Web Push so the Edge Function can reach it
  registerPushSubscription();
  return true;
}
function disableNotifs(){state.settings=state.settings||{};state.settings.notifEnabled=false;save();showToast('Alerts turned off');render();}
function setCcCutoff(val){
  const n=parseInt(val);
  state.settings=state.settings||{};
  state.settings.ccCutoffDay=(isNaN(n)||n<1||n>28)?0:n;
  save();hapticTick();
  showToast(state.settings.ccCutoffDay?`Cut-off set to day ${state.settings.ccCutoffDay}`:'Using calendar month','check');
  render();
}
async function resetNotifState(){if(!await confirmAsync('This will clear alert flags for the current month so they can fire again.',{title:'Reset alerts',danger:false,okText:'Reset',cancelText:'Cancel'}))return;
  const mkey=mk();
  state.notifState=state.notifState||{};
  delete state.notifState[mkey];
  save();hapticTick();showToast('Alert history cleared');render();
}

// Auto-prune notifState: keep only the last 2 months to avoid indefinite growth
function pruneNotifState(){
  if(!state.notifState||typeof state.notifState!=='object')return;
  const now=new Date();
  const keep=new Set();
  for(let i=0;i<2;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    keep.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  let pruned=false;
  Object.keys(state.notifState).forEach(k=>{if(!keep.has(k)){delete state.notifState[k];pruned=true;}});
  if(pruned)save();
}
function _logNotif(title,body,tag,meta){
  state.notifLog=state.notifLog||[];
  meta=meta||{};
  // Dedupe by tag — a tag firing twice (e.g. re-check on re-render) just
  // refreshes the timestamp/unread state rather than adding a duplicate row.
  if(tag){
    const existing=state.notifLog.find(n=>n.tag===tag);
    if(existing){ existing.ts=Date.now(); existing.read=false; save(); return; }
  }
  state.notifLog.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,body,tag:tag||null,kind:meta.kind||null,catId:meta.catId||null,mkey:meta.mkey||mk(),read:false,ts:Date.now()});
  if(state.notifLog.length>60)state.notifLog.length=60;
  save();
}
function _fireNotif(title,body,tag,meta){
  if(!notifReady())return false;
  _logNotif(title,body,tag,meta);
  // Capacitor APK — no Web Notification API, use a persistent in-app banner instead
  if(_notifTier()==='capacitor'){
    _showAlertBanner(title,body,tag);
    _updateNotifBadge();
    return true;
  }
  // Browser — real OS notification
  try{
    const n=new Notification(title,{body,tag:tag||'ledger-'+Date.now(),icon:'icons/icon-192.png',badge:'icons/icon-192.png',silent:false});
    n.onclick=()=>{window.focus();n.close();};
    _updateNotifBadge();
    return true;
  }catch(e){return false;}
}

// ── In-app alert banner (Capacitor fallback) ────────────────────────────────
// Shows ONE compact, tappable banner at a time (queued, not stacked) — tapping
// it opens the Notifications tab. This replaces the old version which stacked
// every alert as its own full card and got congested fast when several fired
// at once.
let _bannerSeenTags=[],_bannerQueue=[],_bannerShowing=false;
function _showAlertBanner(title,body,tag){
  if(tag&&_bannerSeenTags.includes(tag))return; // dedupe within this session
  if(tag)_bannerSeenTags.push(tag);
  _bannerQueue.push({title,body,tag});
  if(!_bannerShowing)_drainBannerQueue();
}
function _drainBannerQueue(){
  const next=_bannerQueue.shift();
  if(!next){ _bannerShowing=false; return; }
  _bannerShowing=true;
  const{title,body,tag}=next;
  const id='alrt-active';
  document.getElementById(id)?.remove();
  const wrap=document.createElement('div');
  wrap.id=id;
  wrap.onclick=()=>{ wrap.remove(); setTab('notif'); };
  wrap.style.cssText=`
    position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
    z-index:9999;background:var(--card);border:1px solid var(--border-strong);
    border-radius:14px;padding:11px 12px;cursor:pointer;
    box-shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.28);
    display:flex;align-items:center;gap:10px;
    animation:alertIn .3s cubic-bezier(.34,1.2,.44,1) both;
    font-family:'Geist',sans-serif;max-width:460px;margin:0 auto;
  `;
  wrap.innerHTML=`
    <div style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i data-lucide="bell" class="ic-sm" style="color:var(--accent)"></i></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:12.5px;font-weight:600;color:var(--text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
      <div style="font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${body}</div>
    </div>
    <button onclick="event.stopPropagation();document.getElementById('${id}')?.remove();_drainBannerQueue()" style="
      background:transparent;border:none;cursor:pointer;color:var(--dim);
      padding:4px;border-radius:6px;font-size:15px;line-height:1;flex-shrink:0;
    ">×</button>
  `;
  if(!document.getElementById('alert-kf')){
    const s=document.createElement('style');
    s.id='alert-kf';
    s.textContent='@keyframes alertIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(wrap);
  if(window.lucide)lucide.createIcons();
  hapticTick();
  setTimeout(()=>{
    if(!document.getElementById(id))return; // already dismissed manually
    wrap.style.transition='opacity .35s,transform .35s';
    wrap.style.opacity='0';wrap.style.transform='translateY(-8px)';
    setTimeout(()=>{ wrap.remove(); _drainBannerQueue(); },360);
  },3800);
}
function _updateNotifBadge(){
  const n=(state.notifLog||[]).filter(x=>!x.read).length;
  document.querySelectorAll('.notif-badge').forEach(el=>{
    el.textContent=n>9?'9+':String(n);
    el.style.display=n>0?'flex':'none';
  });
}
function _notifFlag(path,val){
  state.notifState=state.notifState||{};
  const parts=path.split('.');let cur=state.notifState;
  for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
  if(val===undefined)return cur[parts[parts.length-1]];
  cur[parts[parts.length-1]]=val;save();
}
// Three-stage budget alerts (50 / 80 / 100 %)
function checkBudgetNotifications(){
  if(!notifReady())return;
  const mkey=mk();
  const stages=[{k:'p50',pct:50,lbl:'Halfway'},{k:'p80',pct:80,lbl:'Heads-up'},{k:'p100',pct:100,lbl:'Over budget'}];
  Object.entries(state.budgets||{}).forEach(([catId,limit])=>{
    if(!limit||limit<=0)return;
    const spent=cntExps(mkey).filter(e=>e.catId===catId).reduce((s,e)=>s+e.amount,0);
    const pct=(spent/limit)*100;
    const cat=getCat(catId);
    stages.forEach(st=>{
      const flag=_notifFlag(`${mkey}.budget.${catId}.${st.k}`);
      if(pct>=st.pct&&!flag){
        _notifFlag(`${mkey}.budget.${catId}.${st.k}`,true);
        const msg=st.pct===100
          ?`${cat.name} is over budget · ${fmt(spent)} / ${fmt(limit)}`
          :`${cat.name} at ${Math.round(pct)}% · ${fmt(spent)} / ${fmt(limit)}`;
        _fireNotif(st.lbl+' — '+cat.name,msg,'bud-'+catId+'-'+st.k+'-'+mkey,{kind:'budget',catId,mkey});
      }
    });
  });
}
// CC bill: (i) appears when new month rolls over (ii) reminder near cut-off / due
function checkCcNotifications(){
  if(!notifReady())return;
  const bill=getCreditBill(curY,curM);
  if(bill.total<=0)return;
  const mkey=bill.mkey;
  // Stage 1 — bill appeared (first time we see a non-zero bill this month)
  if(!_notifFlag(`${mkey}.cc.appear`)){
    _notifFlag(`${mkey}.cc.appear`,true);
    _fireNotif('Credit Card bill is ready',`${fmt(bill.total)} from last month · ${bill.charges.length} charge${bill.charges.length===1?'':'s'}`,'cc-appear-'+mkey,{kind:'cc',mkey});
  }
  // Stage 2 — near-due reminder (fires when we're within 5 days of the cut-off or month-end and bill is still unpaid)
  if(bill.remaining>0){
    const today=new Date();
    const cut=parseInt((state.settings||{}).ccCutoffDay)||0;
    const lastDay=din(curY,curM);
    const dueDay= cut>=1&&cut<=28 ? cut : lastDay;
    const daysLeft=dueDay - today.getDate();
    if(daysLeft>=0&&daysLeft<=5&&today.getFullYear()===curY&&today.getMonth()===curM){
      if(!_notifFlag(`${mkey}.cc.due`)){
        _notifFlag(`${mkey}.cc.due`,true);
        _fireNotif('Credit Card bill due soon',`${fmt(bill.remaining)} remaining · ${daysLeft===0?'due today':daysLeft+' day'+(daysLeft===1?'':'s')+' left'}`,'cc-due-'+mkey,{kind:'cc',mkey});
      }
    }
  }
}
function runAllNotifChecks(){checkBudgetNotifications();checkCcNotifications();}

async function prepayRemainingSplit(groupId,currentId){
  const group=state.exps.filter(x=>x.splitOf===groupId).sort((a,b)=>a.splitIndex-b.splitIndex);
  if(!group.length)return;
  const remaining=group.filter(g=>!g.ccPaid && !g.prepaid && g.id!==currentId);
  if(!remaining.length){showToast('Already paid ✓','check');return;}
  const total=remaining.reduce((s,g)=>s+g.amount,0);
  const current=group.find(g=>g.id===currentId);
  const catId=current?.catId||'misc';
  const note=current?.note?.split('·')[0]?.trim()||'Prepayment';
  const ok=await confirmAsync(`This will fold ${remaining.length} future installment${remaining.length===1?'':'s'} (${fmt(total)} total) into a single charge dated today. The future EMI rows will be marked as prepaid and will stop appearing in their respective months.`,{title:'Prepay remaining EMIs',okText:'Prepay '+fmt(total),cancelText:'Cancel'});
  if(!ok)return;
  // Mark remaining rows as prepaid (don't delete — keeps history)
  remaining.forEach(r=>{r.prepaid=true;});
  // Create a consolidated charge in the current month, tagged as CC but already settled
  const today=todayYMD();
  const d=todayLocal();
  state.exps.push({
    id:++state.uid,
    catId,
    subId:null,
    amount:total,
    date:today,
    note:`${note} · Prepaid ${remaining.length} EMI${remaining.length===1?'':'s'}`,
    paidWithCC:true,
    ccPaid:true,         // settled within this month
    splitPrepayOf:groupId,
    prepaidEmiIds:remaining.map(r=>r.id),
    mk:mk(d.getFullYear(),d.getMonth()),
  });
  closeSheet();save();hapticDone();
  showToast(`Prepaid ${fmt(total)} ✓`,'check');
  render();
}
function saveEditing(){
  const raw=$('s-cat').value,amt=parseFloat($('s-amt').value),date=$('s-date').value,note=$('s-note').value.trim();
  if(!raw||!amt||amt<=0||!date){showToast('Missing fields','x');return;}
  const[catId,subId]=raw.includes('|')?raw.split('|'):[raw,null];
  const e=state.exps.find(x=>x.id===editingId);
  if(!e)return;
  const d=new Date(date+'T00:00:00');
  const cc=!!($('s-cc')&&$('s-cc').checked);
  const ccPaid=!!($('s-ccpaid')&&$('s-ccpaid').checked);
  e.catId=catId;e.subId=subId;e.amount=amt;e.date=date;e.note=note;e.paidWithCC=cc;

// Long-press detector — handles .ti (expense), .ei (recurring), .oi-item (income)
let lpTimer=null, lpTarget=null;
function attachLongPress(){
  const scroll=document.getElementById('mainScroll');
  if(!scroll||scroll._lpAttached)return;
  scroll._lpAttached=true;
  const start=e=>{
    if(e.target.closest('.tdel, .ei-del, .oi-del, button, a, input, select'))return;
    const ti=e.target.closest('.ti[data-tid]');
    const ei=e.target.closest('.ei[data-eid]');
    const oi=e.target.closest('.oi-item[data-oid]');
    if(ti && !String(ti.dataset.tid).startsWith('emi_')) lpTarget={type:'ti',id:parseInt(ti.dataset.tid)};
    else if(ei) lpTarget={type:'ei',id:parseInt(ei.dataset.eid)};
    else if(oi) lpTarget={type:'oi',id:parseInt(oi.dataset.oid)};
    else return;
    lpTimer=setTimeout(()=>{
      if(!lpTarget)return;
      hapticTick();
      if(lpTarget.type==='ti')openEditExp(lpTarget.id);
      else if(lpTarget.type==='ei')openEditEmi(lpTarget.id);
      else if(lpTarget.type==='oi')openEditOI(lpTarget.id);
      lpTarget=null;
    },520);
  };
  const cancel=()=>{clearTimeout(lpTimer);lpTarget=null;};
  scroll.addEventListener('touchstart',start,{passive:true});
  scroll.addEventListener('touchend',cancel,{passive:true});
  scroll.addEventListener('touchmove',cancel,{passive:true});
  scroll.addEventListener('mousedown',start);
  ['mouseup','mouseleave','scroll'].forEach(ev=>scroll.addEventListener(ev,cancel,{passive:true}));
}

// ── Back-gesture / hardware-back handling ───────────────────────────────
// Every tab is one of three depths:
//   0 = Home (dash)
//   1 = any top-level tab (txn, an, sav, bud, emi, set, notif)
//   2 = a page nested INSIDE Settings (cat, cur)
// Driven entirely by our own app state (activeTab / overlay flags) — NOT by
// window.history — so there's no native back-stack bookkeeping to get out
// of sync. A single back-press always moves exactly one depth shallower:
// depth2 -> depth1 (parent, 'set') -> depth0 (Home) -> press-again-to-exit.
let _navDepth=0;
function _navTabDepth(t){ return (t==='cat'||t==='cur') ? 2 : (t==='dash' ? 0 : 1); }
function _navParentOf(t){ return (t==='cat'||t==='cur') ? 'set' : 'dash'; }
function _navPushGuardIfNeeded(){/* no-op — kept so existing call sites (drawer/sheet/drill open) don't error */}

let _exitArmed=false,_exitArmTimer=null;
function _handleBackPress(){
  // 1. Close whatever overlay is on top first — always takes priority over
  //    any tab-depth navigation, regardless of which tab is underneath.
  if(impIsOpen()){ impRequestClose(); return; }
  const sheetOpen=document.getElementById('sheet')?.classList.contains('on');
  const drawerOpen=document.getElementById('shell')?.classList.contains('menu-open');
  const drillOpen=document.getElementById('drill-modal')?.classList.contains('on');
  if(sheetOpen||drawerOpen||drillOpen){
    if(sheetOpen)closeSheet();
    if(drawerOpen)toggleMenu(false);
    if(drillOpen)closeDrill();
    return;
  }
  // 2. Nested-in-Settings pages (Categories/Currency) unwind one level.
  if(_navDepth===2){ setTab(_navParentOf(activeTab),{silent:true}); return; }
  // 3. Any top-level tab goes back to Home.
  if(_navDepth===1){ setTab('dash',{silent:true}); return; }
  // 4. Already on Home with nothing open — require a confirming second
  //    press within 2s ("press back again to exit") before actually exiting.
  if(_exitArmed){
    clearTimeout(_exitArmTimer);
    _exitArmed=false;
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
      window.Capacitor.Plugins.App.exitApp();
    }
    return;
  }
  _exitArmed=true;
  showToast('Press back again to exit','arrow-left');
  clearTimeout(_exitArmTimer);
  _exitArmTimer=setTimeout(()=>{ _exitArmed=false; },2000);
}

// Android hardware back button / system back gesture (Capacitor).
// Requires @capacitor/app (npm install @capacitor/app && npx cap sync android).
if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener('backButton', ()=>{ _handleBackPress(); });
}

// ── Pure parsing / categorising helpers (no DOM, no app state) ───────────
const ImpCore=(()=>{
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};

  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
    const lines=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,15);
    let delim=',',best=-1;
    for(const d of [',',';','\t','|']){
      const n=lines.reduce((s,l)=>s+(l.split(d).length-1),0);
      if(n>best){best=n;delim=d;}
    }
    const rows=[];let row=[],cur='',q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
        else cur+=c;
      }else if(c==='"'&&cur===''){q=true;}
      else if(c===delim){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(cur);cur='';
        if(row.some(x=>x.trim()!==''))rows.push(row);
        row=[];
      }else cur+=c;
    }
    row.push(cur);
    if(row.some(x=>x.trim()!==''))rows.push(row);
    return rows;
  }

  const pad=n=>String(n).padStart(2,'0');
  function validYMD(y,m,d){
    if(y<1990||y>2100||m<1||m>12||d<1||d>31)return null;
    const dt=new Date(Date.UTC(y,m-1,d));
    if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
    return y+'-'+pad(m)+'-'+pad(d);
  }
  // mdy=true when the file is known to use month-first dates
  function parseDate(v,mdy){
    if(v==null||v==='')return null;
    if(v instanceof Date&&!isNaN(v))return validYMD(v.getFullYear(),v.getMonth()+1,v.getDate());
    if(typeof v==='number'){
      if(v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return validYMD(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
      return null;
    }
    let s=String(v).trim().replace(/\s+/g,' ');
    if(!s)return null;
    s=s.replace(/[T ]\d{1,2}:\d{2}(:\d{2})?(\.\d+)?\s*(am|pm)?(\s*[+-]\d{2}:?\d{2}|Z)?$/i,'').trim();
    let m;
    if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))return validYMD(+m[1],+m[2],+m[3]);
    if((m=s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]+(\d{2,4})$/))){
      const mo=MON[m[2].slice(0,4).toLowerCase()]||MON[m[2].slice(0,3).toLowerCase()];
      if(!mo)return null;let y=+m[3];if(y<100)y+=2000;return validYMD(y,mo,+m[1]);
    }
    if((m=s.match(/^([A-Za-z]{3,9})[ .-](\d{1,2}),?[ -](\d{2,4})$/))){
      const mo=MON[m[1].slice(0,4).toLowerCase()]||MON[m[1].slice(0,3).toLowerCase()];
      if(!mo)return null;let y=+m[3];if(y<100)y+=2000;return validYMD(y,mo,+m[2]);
    }
    if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){
      let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
      return mdy?validYMD(y,a,b):validYMD(y,b,a);
    }
    if(/^\d{5}$/.test(s))return parseDate(+s);
    return null;
  }
  // true when any slash/dash date has a second field > 12 and first <= 12 (=> month-first)
  function detectMDY(samples){
    let dayFirst=0,monthFirst=0;
    for(const v of samples){
      const m=typeof v==='string'&&v.trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
      if(!m)continue;
      if(+m[1]>12)dayFirst++;else if(+m[2]>12)monthFirst++;
    }
    return monthFirst>0&&dayFirst===0;
  }

  // → {n:number, side:'dr'|'cr'|null} or null
  function parseAmount(v){
    if(v==null||v==='')return null;
    if(typeof v==='number')return isFinite(v)?{n:v,side:null}:null;
    let s=String(v).trim();
    if(!s||/^[-–—]+$/.test(s))return null;
    let side=null;
    const sm=s.match(/\b(dr|cr|debit|credit)\.?\s*$/i)||s.match(/^(dr|cr)\b/i);
    if(sm){side=/^d/i.test(sm[1])?'dr':'cr';s=s.replace(sm[0],'');}
    let neg=false;
    if(/^\(.*\)$/.test(s.trim())){neg=true;}
    if(/^-|-$/.test(s.trim()))neg=true;
    s=s.replace(/[^0-9.,]/g,'');
    if(!s)return null;
    // Indian & western grouping both use comma as thousands separator here
    s=s.replace(/,/g,'');
    const n=parseFloat(s);
    if(!isFinite(n))return null;
    return{n:neg?-n:n,side};
  }

  const ROLE_TESTS={
    type:h=>/^(dr\s*\/\s*cr|cr\s*\/\s*dr|type|txn type|transaction type|dr\/cr|cr\/dr|debit\/credit|credit\/debit)\b/.test(h),
    custom:h=>/custom|exact amounts?|installment amounts?|schedule/.test(h),
    bill:h=>/^bill( month| for)?\b|bill month|statement month/.test(h),
    months:h=>/^(emi |recurring |split )?(months?|tenure|installments?)\b|emi months/.test(h),
    interest:h=>/interest|^rate\b/.test(h),
    cc:h=>/paid (with|by|via|using) (cc|card|credit)|^cc\b|^credit card\??$|^paid with cc|^card$/.test(h),
    sub:h=>/sub.?categor|^sub\b/.test(h),
    cat:h=>/^categor|^cat\b/.test(h),
    amount:h=>/^amount\b|^txn amount|^transaction amount|(withdraw|debit).*(deposit|credit)|(deposit|credit).*(withdraw|debit)/.test(h),
    debit:h=>/withdraw|debit|^dr\b|\bdr\.?$|paid out|money out/.test(h),
    credit:h=>/deposit|credit|^cr\b|\bcr\.?$|paid in|money in/.test(h),
    balance:h=>/balance|^bal\b|closing/.test(h),
    desc:h=>/narration|description|particular|remark|detail|payee|merchant|note|memo|transaction$/.test(h),
    date:h=>/date|^dt\b|\bdt\.?$/.test(h),
  };
  function classifyHeader(row){
    const map={},cells=row.map(c=>String(c==null?'':c).trim().toLowerCase().replace(/\s+/g,' '));
    const dateCols=[];
    cells.forEach((h,i)=>{
      if(!h)return;
      if(ROLE_TESTS.type(h)){if(map.type==null)map.type=i;return;}
      if(ROLE_TESTS.cc(h)){if(map.cc==null)map.cc=i;return;}
      if(ROLE_TESTS.custom(h)){if(map.custom==null)map.custom=i;return;}
      if(ROLE_TESTS.bill(h)){if(map.bill==null)map.bill=i;return;}
      if(ROLE_TESTS.months(h)){if(map.months==null)map.months=i;return;}
      if(ROLE_TESTS.interest(h)){if(map.interest==null)map.interest=i;return;}
      if(ROLE_TESTS.sub(h)){if(map.sub==null)map.sub=i;return;}
      if(ROLE_TESTS.cat(h)){if(map.cat==null)map.cat=i;return;}
      if(ROLE_TESTS.balance(h)){if(map.balance==null)map.balance=i;return;}
      if(ROLE_TESTS.amount(h)){if(map.amount==null)map.amount=i;return;}
      if(ROLE_TESTS.date(h)){dateCols.push(i);return;}
      if(ROLE_TESTS.debit(h)){if(map.debit==null)map.debit=i;return;}
      if(ROLE_TESTS.credit(h)){if(map.credit==null)map.credit=i;return;}
      if(ROLE_TESTS.desc(h)){if(map.desc==null)map.desc=i;return;}
    });
    if(dateCols.length){
      const pref=dateCols.find(i=>/(txn|tran|transaction|posting)/.test(cells[i]))??dateCols.find(i=>!/value/.test(cells[i]))??dateCols[0];
      map.date=pref;
    }
    return map;
  }
  function findHeader(rows){
    for(let i=0;i<Math.min(rows.length,80);i++){
      const m=classifyHeader(rows[i]);
      if(m.date!=null&&(m.debit!=null||m.credit!=null||m.amount!=null))return{headerRow:i,map:m};
    }
    return null;
  }

  // explicit "app" type words only (NOT bank Dr/Cr words)
  function kindOf(t){
    t=String(t||'').trim().toLowerCase();
    if(!t)return'';
    if(/^salary\b/.test(t))return'sal';
    if(/(cc|card|credit card).*(bill|payment|pay|settle)|bill payment|card bill/.test(t))return'ccpay';
    if(/^(recurring|emi|subscription|autopay|standing)/.test(t))return'rec';
    if(/^(income|other income|received)/.test(t))return'inc';
    if(/^(expense|spent)/.test(t))return'exp';
    return'';
  }
  // rows: array of arrays. map: {date,desc,debit,credit,amount,type,...}. returns {txns, skipped}
  function extract(rows,headerRow,map,opts){
    opts=opts||{};
    const body=rows.slice(headerRow+1);
    const mdy=detectMDY(body.map(r=>r[map.date]));
    const out=[];let skipped=0;
    for(const r of body){
      const date=parseDate(r[map.date],mdy);
      if(!date){skipped++;continue;}
      const cell=k=>map[k]!=null?String(r[map[k]]==null?'':r[map[k]]).trim():'';
      const kind=map.type!=null?kindOf(cell('type')):'';
      let debit=null,credit=null;
      if(map.debit!=null||map.credit!=null){
        const d=map.debit!=null?parseAmount(r[map.debit]):null;
        const c=map.credit!=null?parseAmount(r[map.credit]):null;
        if(d&&Math.abs(d.n)>0)debit=Math.abs(d.n);
        if(c&&Math.abs(c.n)>0)credit=Math.abs(c.n);
      }
      if(debit==null&&credit==null&&map.amount!=null){
        const a=parseAmount(r[map.amount]);
        if(a&&a.n!==0){
          let side=a.side;
          if(!side&&kind)side=(kind==='inc'||kind==='sal')?'cr':'dr';
          if(!side&&map.type!=null){
            const t=cell('type').toLowerCase();
            if(/^(dr|d|debit|withdrawal|w|out)\b/.test(t))side='dr';
            else if(/^(cr|c|credit|deposit|in)\b/.test(t))side='cr';
          }
          if(!side)side=opts.cardMode?(a.n<0?'cr':'dr'):(opts.defaultDebit?'dr':(a.n<0?'dr':'cr'));
          if(opts.flip&&!kind)side=side==='dr'?'cr':'dr';
          if(side==='dr')debit=Math.abs(a.n);else credit=Math.abs(a.n);
        }
      }else if(opts.flip&&(debit!=null||credit!=null)){
        [debit,credit]=[credit,debit];
      }
      if(debit==null&&credit==null){skipped++;continue;}
      const raw=map.desc!=null?String(r[map.desc]==null?'':r[map.desc]).replace(/\s+/g,' ').trim():'';
      out.push({date,raw,kind,cat:cell('cat'),sub:cell('sub'),cc:/^(y|yes|true|1|cc|card|paid)$/i.test(cell('cc')),
        months:parseInt(cell('months'))||0,interest:parseFloat(cell('interest'))||0,billRaw:cell('bill'),
        custom:cell('custom').replace(/[₹$]/g,'').split(/[,;+\s]+/).map(x=>parseFloat(x)).filter(x=>x>0),
        debit:debit!=null?Math.round(debit*100)/100:null,credit:credit!=null?Math.round(credit*100)/100:null});
    }
    return{txns:out,skipped};
  }

  // ── narration → friendly note ──────────────────────────────────────────
  const NOISE=new Set(['upi','dr','cr','imps','neft','rtgs','pos','ach','nach','mb','ib','mob','ecs','by','to','from','payment','paymen','pay','paid','transfer','trf','txn','ref','no','online','purchase','debit','credit','card','atm','cash','wdl','withdrawal','bil','bill','si','upiin','upiout','pur','ecom','inb','mmt','cms','tpt','fund','p2p','p2m','collect','request','mandate','autopay']);
  const HANDLE=/^(ok)?(axis|hdfc|hdfcbank|icici|sbi|ybl|ibl|axl|paytm|apl|upi|okicici|oksbi|okhdfcbank|okaxis|fbl|pthdfc|ptyes|ptsbi|barodampay|kotak|idfcfirst|idfcbank|jupiteraxis|freecharge|airtel|postbank|aubank|yesbank|cnrb|cboi|unionbank|pnb|boi|rbl|federal|slice|jio|naviaxis|waaxis|wahdfcbank|waicici|wasbi|abfspay|ikwik|mairtel|axisb|axisbank|sbipay|ezeepay|dbs|indus|csbpay|kvb|tjsb|mahb|apb|fam|ptaxis)$/i;
  function titleCase(s){return s.toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase());}
  function cleanNote(raw){
    raw=String(raw||'').trim();
    if(!raw)return'';
    if(/\batw\b|\batm\b|cash\s*(wdl|withdrawal)|nfs\/cash/i.test(raw))return'ATM withdrawal';
    let toks=raw.split(/[\/|]/);
    if(toks.length<2)toks=raw.split(/\s*-\s*|\s{2,}/);
    let best=null;
    for(let t of toks){
      t=t.trim();
      if(!t)continue;
      if(t.includes('@'))continue;
      if(/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(t))continue;           // IFSC
      if(/^\W*$/.test(t))continue;
      t=t.replace(/\b[A-Za-z]*\d[A-Za-z\d]*\b/g,' ').replace(/[Xx*]{3,}\d*/g,' ').replace(/\s+/g,' ').trim(); // tokens containing digits
      if(!t)continue;
      const words=t.split(' ').filter(w=>w&&!NOISE.has(w.toLowerCase())&&!HANDLE.test(w));
      if(!words.length)continue;
      const cand=words.join(' ').replace(/[^\w &.'+()-]/g,'').trim();
      if(cand.replace(/[^A-Za-z]/g,'').length<3)continue;
      best=cand;break;
    }
    if(!best)best=raw;
    best=titleCase(best).slice(0,42).trim();
    return best;
  }
  function merchantKey(note){
    const w=String(note||'').toLowerCase().replace(/[^a-z\s]/g,' ').trim().split(/\s+/).filter(x=>x.length>=3);
    return w[0]||String(note||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  }

  // ── rule-based category suggestions ────────────────────────────────────
  const RULES=[
    [/tithe|church|offering/,'tithe'],
    [/zerodha|groww|upstox|kuvera|mutual fund|\bsip\b|\bnps\b|\bppf\b|indmoney|smallcase|angel one|prudential|\blic\b|policybazaar|insurance|\bmf\b|coin by/,'investments'],
    [/\bemi\b|loan|ach d|\bnach\b|bajaj fin|home fin|chola|tata capital|kreditbee|moneyview|fullerton/,'emi'],
    [/act fibernet|airtel xstream|xstream|jiofiber|jio fiber|broadband|hathway|excitel|wifi|wi-fi|tikona|you broadband/,'utilities|wifi'],
    [/indane|bharatgas|bharat gas|hp gas|\blpg\b|gas booking|gas cylinder|hpcl/,'utilities|lpg'],
    [/bescom|msedcl|mseb|tneb|tangedco|adani elec|tata power|\bbses\b|electricity|torrent power|\bcesc\b|kseb|apspdcl|mahadiscom|bijli/,'utilities|elec'],
    [/recharge|\bjio\b|vodafone|\bvi\b|airtel|\bbsnl\b|idea cellular|mobile bill|postpaid/,'mobile'],
    [/swiggy|zomato|eatsure|domino|pizza|mcdonald|\bkfc\b|burger|starbucks|cafe|restaurant|dhaba|biryani|bakery|barbeque|juice|ice ?cream|\bhotel\b|food|kitchen|eatery|tiffin|canteen|chai|coffee|subway|haldiram/,'food'],
    [/bigbasket|big basket|blinkit|grofers|zepto|instamart|dmart|d-mart|avenue supermarts|reliance fresh|reliance smart|more retail|supermarket|grocer|kirana|provision|vegetable|fruit|milk|dairy|nature.?s basket|jiomart|licious|freshtohome|spencer|star bazaar|general store|mart\b/,'grocery'],
    [/metro|bmtc|\bbest\b|bus pass|nmmt|monthly pass|dmrc|bmrc|local train|season ticket/,'office'],
    [/uber|\bola\b|olacabs|rapido|irctc|redbus|makemytrip|goibibo|indigo|air india|spicejet|vistara|akasa|yatra|cleartrip|abhibus|flight|railway|ixigo|fastag|petrol|diesel|fuel|\bhpcl\b|\bbpcl\b|indian oil|iocl|shell|airlines|travel/,'travel'],
    [/netflix|spotify|hotstar|prime video|youtube|bookmyshow|\bpvr\b|\binox\b|sonyliv|zee5|gaana|apple\.com|itunes|jiocinema|steam|playstation|xbox|google play|disney|gaming|cinema|movie|theatre/,'entertainment'],
    [/pharmacy|apollo|medplus|netmeds|\b1mg\b|pharmeasy|hospital|clinic|diagnostic|\blab\b|doctor|medical|dental|thyrocare|practo|healthcare|chemist|medicine|scan/,'health'],
    [/salon|\bspa\b|parlou?r|barber|urban ?company|urbanclap|grooming|beauty|nykaa|cosmetic|haircut|wellness/,'care'],
    [/school|college|tuition|\bfees?\b|udemy|coursera|byju|unacademy|vedantu|exam|university|education|skillshare|upgrad|academy|books|stationery|institute/,'edu'],
    [/myntra|ajio|zara|h&m|westside|pantaloons|lifestyle|max fashion|trends|decathlon|nike|adidas|puma|fashion|cloth|tailor|apparel|garment|boutique|footwear|bata|jockey|levis|reliance trends/,'apparel'],
  ];
  const SKIP_CARD=/credit\s*card|\bcc\s*(pay|bill|pmt)|\bcred\b|cred club|card\s*(payment|bill)|billdesk.*card|autopay.*card|\bcard\s*dues/i;
  const SKIP_SELF=/own account|self transfer|to self|\bself\b.*transfer|sweep|fd\s*(booking|closure)|rd\s*instal|auto sweep/i;
  const SALARY=/salary|\bsal\b|payroll|\bwages\b/i;
  function ruleCategory(text){
    const t=String(text||'').toLowerCase();
    for(const[re,cat]of RULES)if(re.test(t))return cat;
    return null;
  }
  return{parseCSV,parseDate,parseAmount,detectMDY,classifyHeader,findHeader,extract,kindOf,cleanNote,merchantKey,ruleCategory,SKIP_CARD,SKIP_SELF,SALARY};
})();

// ── undo ────────────────────────────────────────────────
function impLastBatch(){
  let b=0;
  const bump=x=>{if(x&&x.imp&&x.imp>b)b=x.imp;};
  state.exps.forEach(bump);state.otherIncome.forEach(bump);state.emis.forEach(bump);
  Object.keys(state.impLog||{}).forEach(k=>{if(+k>b)b=+k;});
  if(!b)return null;
  const L=(state.impLog||{})[b]||{};
  const n=state.exps.filter(e=>e.imp===b).length+state.otherIncome.filter(o=>o.imp===b).length+state.emis.filter(e=>e.imp===b).length+Object.keys(L.salaries||{}).length;
  return{batch:b,n};
}
async function impUndoLast(fromOverlay){
  const lb=impLastBatch();
  if(!lb){showToast('Nothing to undo','x');return;}
  const ok=await confirmAsync(`This removes everything added by your last import (${lb.n} item${lb.n===1?'':'s'}: transactions, income, salary months, card payments and recurring entries). Anything you entered by hand is untouched.`,{title:'Undo last import?',okText:'Undo import',cancelText:'Keep',danger:true});
  if(!ok)return;
  const b=lb.batch,L=(state.impLog||{})[b]||{};
  state.exps=state.exps.filter(e=>e.imp!==b);
  state.otherIncome=state.otherIncome.filter(o=>o.imp!==b);
  state.emis=state.emis.filter(e=>e.imp!==b);
  (L.billed||[]).forEach(id=>{const c=state.exps.find(x=>x.id===id);if(c){delete c.ccPaid;delete c.ccBilled;}});
  for(const m in (L.salaries||{})){const prev=L.salaries[m];if(prev>0)state.salaries[m]=prev;else delete state.salaries[m];}
  for(const m in (L.creditPaid||{})){const v=Math.max(0,(+(state.creditPaid||{})[m]||0)-L.creditPaid[m]);state.creditPaid=state.creditPaid||{};state.creditPaid[m]=v;}
  if(state.impLog)delete state.impLog[b];
  save();render();
  showToast('Import undone','check');
  if(fromOverlay)impClose();
}

// ── file reading ────────────────────────────────────────
function _impLoadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res();s.onerror=()=>rej(new Error('xlsx-load'));
    document.head.appendChild(s);
  });
}
async function impOnFile(input){
  const f=input.files&&input.files[0];
  input.value='';
  if(!f)return;
  const name=f.name||'statement';
  const ext=(name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){impSetError('PDF statements can\'t be read yet. In net banking, download the statement as <b>CSV</b> or <b>Excel (XLS/XLSX)</b> instead.');return;}
  impSetBusy('Reading '+_impEsc(name)+'…');
  try{
    let rows;
    if(ext==='xls'||ext==='xlsx'||ext==='xlsm'){
      try{await _impLoadXLSX();}catch(e){impSetError('Excel support needs an internet connection the first time. Connect and try again, or export the statement as CSV.');return;}
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:false});
    }else{
      rows=ImpCore.parseCSV(await f.text());
    }
    impLoadRows(rows,name);
  }catch(e){
    console.warn('Import read failed',e);
    impSetError('Couldn\'t read that file. Make sure it\'s an unprotected CSV or Excel statement.');
  }
}
function impLoadRows(rows,name){
  if(!rows||rows.length<2){impSetError('That looks empty. Please check it and try again.');return;}
  impS.fileName=name;impS.rows=rows;impS.flip=false;impS.filter='all';
  const h=ImpCore.findHeader(rows);
  if(h){impS.headerRow=h.headerRow;impS.map=h.map;impS.needMap=false;}
  else{
    const hr=Math.max(0,rows.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=3));
    impS.headerRow=hr;impS.map=ImpCore.classifyHeader(rows[hr]||[]);impS.needMap=true;
  }
  impBuild();
}

function _impNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());}

async function impDeliver(name,mime,payload,isB64){
  if(_impNative()&&_impHasShare()){
    try{
      const P=window.Capacitor.Plugins;
      const w=await P.Filesystem.writeFile(isB64?{path:name,data:payload,directory:'CACHE'}:{path:name,data:payload,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:name,url:w.uri,dialogTitle:'Save or send the template'});
      return'shared';
    }catch(e){if(/cancel/i.test(String(e&&e.message)))return'cancelled';console.warn('share failed',e);}
  }
  try{
    const blob=isB64?new Blob([Uint8Array.from(atob(payload),ch=>ch.charCodeAt(0))],{type:mime}):new Blob([payload],{type:mime+';charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    return'download';
  }catch(e){return'failed';}
}
async function impGetTemplate(kind){
  const hint=document.getElementById('imp-hint');
  try{
    let r;
    if(kind==='xlsx'){
      try{await _impLoadXLSX();}catch(e){if(hint)hint.textContent='The Excel maker needs internet once. Use the CSV template or “Copy CSV” instead.';return;}
      const wb=await _impTplWorkbook();
      r=await impDeliver('expense-import-template.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',XLSX.write(wb,{type:'base64',bookType:'xlsx'}),true);
    }else{
      r=await impDeliver('expense-import-template.csv','text/csv',impTemplateCSV(),false);
    }
    if(hint&&r!=='cancelled'){
      hint.textContent=(_impNative()&&!_impHasShare())
        ?'Saving files from this app needs the Filesystem + Share plugins (see notes). Until then tap “Copy CSV” and paste into Google Sheets, or use “Paste rows”.'
        :(r==='shared'?'Choose where to save it (Drive, Files, WhatsApp…).':'If the download did not start, tap “Copy CSV” and paste it into Google Sheets or Excel.');
    }
  }catch(e){console.warn(e);if(hint)hint.textContent='Could not create the file. Use “Copy CSV” or “Paste rows”.';}
}
async function impCopyTemplate(){
  const text=impTemplateCSV().replace('\uFEFF','').replace(/\r\n/g,'\n'),hint=document.getElementById('imp-hint');
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(e){}
  if(!ok){
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();}catch(e){}

}

// ── helpers ─────────────────────────────────────────────
function _impHistory(){
  const valid=new Set();
  allCats().forEach(c=>{if(c.subs)c.subs.forEach(s=>valid.add(c.id+'|'+s.id));else valid.add(c.id);});
  const tally={};
  for(const e of state.exps){
    if(!e.note||e.ccPayment)continue;
    const k=ImpCore.merchantKey(e.note);if(!k)continue;
    const v=e.subId?e.catId+'|'+e.subId:e.catId;
    if(!valid.has(v))continue;
    ((tally[k]=tally[k]||{})[v]=(tally[k][v]||0)+1);
  }
  const out={};
  for(const k in tally){let best=null,bn=0;for(const v in tally[k])if(tally[k][v]>bn){bn=tally[k][v];best=v;}out[k]=best;}
  return out;
}
const _impDay=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/86400000;
function _impAdj(m,d){let y=+m.slice(0,4),mo=+m.slice(5,7)-1+d;while(mo<0){mo+=12;y--;}while(mo>11){mo-=12;y++;}return mk(y,mo);}
function _impBillLabel(B){const mm=+B.slice(5,7);return MOS3[(mm-1+11)%12]+' bill';}   // Aug key = "Jul bill" (July purchases)
function _impResolveCat(catText,subText){
  const norm=x=>String(x||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
  const c=norm(catText),sb=norm(subText);
  if(!c&&!sb)return null;
  const cats=allCats();
  let hit=cats.find(k=>c&&(c===norm(k.name)||c===norm(k.id)));
  if(!hit&&c){
    for(const k of cats){
      const cn=norm(k.name);
      if(k.subs&&c.startsWith(cn)){const rest=c.slice(cn.length),sub=k.subs.find(x=>norm(x.name)===rest||norm(x.id)===rest);if(sub)return k.id+'|'+sub.id;}
    }
    if(c.length>=3)hit=cats.find(k=>norm(k.name).startsWith(c));
  }
  if(!hit&&sb){
    for(const k of cats)if(k.subs){const sub=k.subs.find(x=>norm(x.name)===sb||norm(x.id)===sb);if(sub)return k.id+'|'+sub.id;}
  }
  if(!hit)return null;
  if(hit.subs&&hit.subs.length){
    const sub=hit.subs.find(x=>norm(x.name)===sb||norm(x.id)===sb);
    return{id:hit.id+'|'+(sub?sub.id:hit.subs[0].id),guess:!sub};
  }
  return hit.id;
}
function _impParseBillMonth(v){   // "Jul 2025" / "07/2025" / "2025-07" / a date → key of the month's PURCHASES
  if(v==null||v==='')return null;
  const s=String(v).trim();let m;
  if((m=s.match(/^([A-Za-z]{3,9})[ \-\/,]+(\d{2,4})$/))){const mo={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}[m[1].slice(0,3).toLowerCase()];if(mo){let y=+m[2];if(y<100)y+=2000;return y+'-'+String(mo).padStart(2,'0');}}
  if((m=s.match(/^(\d{1,2})[\/\-](\d{4})$/)))return m[2]+'-'+String(+m[1]).padStart(2,'0');
  if((m=s.match(/^(\d{4})-(\d{2})$/)))return s;
  const d=ImpCore.parseDate(v);return d?d.slice(0,7):null;
}

// ── build the review list ───────────────────────────────
function impBuild(){
  const s=impS;
  s.step='review';s.error=null;
  const ok=s.map.date!=null&&(s.map.debit!=null||s.map.credit!=null||s.map.amount!=null);
  if(!ok){s.list=[];s.recs=[];s.needMap=true;impRender();return;}
  const{txns,skipped}=ImpCore.extract(s.rows,s.headerRow,s.map,{flip:s.flip,cardMode:s.cc,defaultDebit:s.map.cat!=null||s.map.cc!=null||s.map.type!=null});
  s.skippedLines=skipped;
  const rcs=txns.map(t=>(t.cat||t.sub)?_impResolveCat(t.cat,t.sub):null);
  const manual=rcs.some(Boolean)||txns.some(t=>t.kind);   // file follows the app's own entry format
  s.manual=manual;
  const hist=_impHistory();
  const today=todayLocal(),nowMk=mk(today.getFullYear(),today.getMonth());
  let list=txns.map((t,i)=>{
    const isOut=t.debit!=null;
    const amount=isOut?t.debit:t.credit;
    const rc=rcs[i];
    const kind=t.kind||'';
    const note=manual?(t.raw.slice(0,80)||(isOut?'Imported expense':'Imported income')):(ImpCore.cleanNote(t.raw)||t.raw.slice(0,42)||(isOut?'Imported expense':'Imported income'));
    const key=ImpCore.merchantKey(note);
    let cat=(rc&&(rc.id||rc))||((manual&&(t.cat||t.sub))?'misc':(hist[key]||ImpCore.ruleCategory(t.raw+' '+note)||'misc'));
    let type=isOut?'exp':'inc',reason='';
    const m=t.date.slice(0,7);
    if(kind){type=kind;}
    else if(!manual){
      if(s.cc){ if(!isOut){type='skip';reason='Card payment / refund — recorded from your bank statement';} }
      else if(isOut&&ImpCore.SKIP_SELF.test(t.raw)){type='skip';reason='Own-account transfer';}
      else if(isOut&&ImpCore.SKIP_CARD.test(t.raw)){type='ccpay';}
      else if(!isOut&&ImpCore.SALARY.test(t.raw)){type='sal';}
    }
    if(manual&&(t.cat||t.sub)&&!rc&&type==='exp')reason='Category “'+(t.cat||t.sub)+'” not recognised — please pick one';
    else if(manual&&rc&&rc.guess&&type==='exp')reason='Sub-category missing — check this one';
    if(type==='sal'){
      const have=state.salaries[m]||0;
      if(have>0){type='skip';reason=Math.abs(have-amount)<0.01?'Salary already set for this month':`Salary already set (${fmt(have)}) — choose “Salary” to replace it`;}
    }
    const cc=!!(t.cc||s.cc);
    const months=t.months>=1?Math.floor(t.months):0;
    const custom=t.custom&&t.custom.length>=2?t.custom:[];
    if(type==='exp'&&manual&&cc&&(months>=2||custom.length>=2)){
      const arr=buildSplitSchedule(amount,months,t.interest||0,0,custom);
      const same=arr.every(v=>Math.abs(v-arr[0])<0.005);
      reason='Split into '+arr.length+' monthly card EMIs: '+(same?arr.length+' × '+fmt(arr[0]):arr.map(v=>fmt(v)).join(' + '));
    }
    if(type==='rec'){reason=months?`Recurring for ${months} months`:'Recurring — ongoing';cat=String(cat).split('|')[0];}
    return{i,date:t.date,amount,out:isOut,raw:t.raw,note,key,cat,type,reason,dup:false,catManual:!!rc,cc,months,custom,interest:t.interest||0,bill:_impParseBillMonth(t.billRaw)?_impAdj(_impParseBillMonth(t.billRaw),1):null,billAuto:false};
  });
  list.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.i-b.i);

  // 1) duplicates against what's already in the tracker
  const usedE=new Set(),usedI=new Set(),usedP=new Set(),pools={};
  const poolFor=m=>pools[m]||(pools[m]=[...allExps(m),...allExps(_impAdj(m,-1)),...allExps(_impAdj(m,1))]);
  for(const r of list){
    const m=r.date.slice(0,7);
    if(r.type==='exp'||r.type==='ccpay'){
      let pool=poolFor(m);
      if(r.type==='ccpay'){   // one card payment may be stored as several per-category lines → compare the group total
        const grp={};pool.filter(e=>e.ccPayment).forEach(e=>{const k=e.payGroup||('i'+e.id);(grp[k]=grp[k]||{id:k,amount:0,date:e.date}).amount+=e.amount;});
        pool=Object.values(grp);
      }else pool=pool.filter(e=>!e.ccPayment);
      const hit=pool.find(e=>!usedE.has(e.id)&&Math.abs(e.amount-r.amount)<0.01&&Math.abs(_impDay(e.date)-_impDay(r.date))<=(e.isEmi?3:1));
      if(hit){usedE.add(hit.id);r.dup=true;r.reason=hit.isEmi?'Matches a recurring charge you already set up':'Already in your tracker';r.type='skip';}
    }else if(r.type==='inc'){
      const hit=state.otherIncome.find(o=>!usedI.has(o.id)&&Math.abs(o.amount-r.amount)<0.01&&Math.abs(_impDay(o.date)-_impDay(r.date))<=1);
      if(hit){usedI.add(hit.id);r.dup=true;r.reason='Already in your tracker';r.type='skip';}
    }else if(r.type==='rec'){
      const nm=r.note.toLowerCase();
      const hit=state.emis.find(e=>!usedP.has(e.id)&&Math.abs(e.amount-r.amount)<0.01&&(e.name||'').toLowerCase()===nm);
      if(hit){usedP.add(hit.id);r.dup=true;r.reason='You already have this recurring entry';r.type='skip';}
    }
  }

  // 2) detect monthly repeats (EMIs, rent, subscriptions) in bank statements
  s.recs=[];
  if(!manual&&!s.cc){
    const groups={};
    list.forEach(r=>{
      if(r.type!=='exp'||!r.out||r.dup||r.amount<50)return;
      const k=r.key+'|'+Math.round(r.amount);
      (groups[k]=groups[k]||[]).push(r);
    });
    for(const k in groups){
      const rows=groups[k],months=[...new Set(rows.map(r=>r.date.slice(0,7)))].sort();
      if(months.length<2)continue;
      const emiLike=rows[0].cat==='emi'||/\bemi\b|loan|ach d|\bnach\b|finance|\bfin\b/i.test(rows[0].raw);
      const need=emiLike?2:3;
      // split into runs of consecutive months
      const runs=[];let cur=[months[0]];
      for(let q=1;q<months.length;q++){if(_impAdj(months[q-1],1)===months[q])cur.push(months[q]);else{runs.push(cur);cur=[months[q]];}}
      runs.push(cur);
      for(const run of runs){
        if(run.length<need)continue;
        const rr=rows.filter(r=>run.includes(r.date.slice(0,7)));
        const days=rr.map(r=>+r.date.slice(8,10)).sort((a,b)=>a-b);
        if(days[days.length-1]-days[0]>6)continue;
        const last=run[run.length-1];
        const g={id:s.recs.length,key:k,name:rr[0].note,amount:rr[0].amount,catId:String(rr[0].cat).split('|')[0],day:Math.min(28,days[Math.floor(days.length/2)]),start:run[0],last,count:run.length,rowIs:rr.map(r=>r.i),enabled:emiLike,ongoing:last>=_impAdj(nowMk,-1),emiLike};
        s.recs.push(g);
        if(g.enabled)rr.forEach(r=>{r.type='rec';r.recId=g.id;r.reason='Part of recurring “'+g.name+'”';});
      }
    }
  }
  s.list=list;
  _impAssignBills();
  impRender();
}

// pick which card bill each bank "card payment" settles (uses the app's own getCreditBill so cut-off day etc. are respected)
function _impAssignBills(){
  const s=impS,pays=s.list.filter(r=>r.type==='ccpay');
  if(!pays.length)return;
  const tmp=s.list.filter(r=>r.type==='exp'&&r.cc).map(r=>({id:'imptmp'+r.i,catId:String(r.cat).split('|')[0],amount:r.amount,date:r.date,mk:r.date.slice(0,7),paidWithCC:true,_tmp:1}));
  const used={};
  state.exps.push(...tmp);
  try{
    for(const r of pays){
      const P=r.date.slice(0,7);
      const cands=[P,_impAdj(P,-1),_impAdj(P,1)];
      const info=B=>{const b=getCreditBill(+B.slice(0,4),+B.slice(5,7)-1);return{B,total:b.total,remaining:Math.max(0,b.remaining-(used[B]||0))};};
      const I=cands.map(info);
      let pick=I.find(x=>x.remaining>0&&Math.abs(x.remaining-r.amount)<=Math.max(1,r.amount*0.005))
            ||I.find(x=>x.B===P&&x.remaining>=r.amount-0.01)
            ||I.slice(1).find(x=>x.remaining>=r.amount-0.01)
            ||I[0];
      if(!r.bill){r.bill=pick.B;r.billAuto=true;}
      const sel=I.find(x=>x.B===r.bill)||info(r.bill);
      used[r.bill]=(used[r.bill]||0)+r.amount;
      r.reason=sel.total>0?`Settles the ${_impBillLabel(r.bill)} · ${fmt(sel.remaining)} was due`:`No card purchases recorded for the ${_impBillLabel(r.bill)} — counted as plain card spending`;
    }
  }finally{state.exps=state.exps.filter(e=>!e._tmp);}
}

let _impCatOpts='';
function _impCatOptions(){
  let h='';
  allCats().forEach(c=>{
    if(c.subs){h+=`<optgroup label="${_impEsc(c.name)}">`+c.subs.map(s=>`<option value="${c.id}|${s.id}">${_impEsc(c.name)} — ${_impEsc(s.name)}</option>`).join('')+'</optgroup>';}
    else h+=`<option value="${c.id}">${_impEsc(c.name)}</option>`;
  });
  return h;
}
const _IMP_TYPES=[['exp','Expense'],['inc','Income'],['sal','Salary'],['ccpay','Card bill'],['skip','Skip']];
function _impBillSelect(r){
  const P=r.date.slice(0,7),set=new Set([_impAdj(P,-2),_impAdj(P,-1),P,_impAdj(P,1),r.bill].filter(Boolean));
  const opts=[...set].sort().map(B=>`<option value="${B}"${B===r.bill?' selected':''}>${_impBillLabel(B)}</option>`).join('');
  return `<select class="imp-bill" data-k="bill" aria-label="Which card bill">${opts}</select>`;
}
function _impRowHTML(r){
  const typeOpts=_IMP_TYPES.concat(r.type==='rec'?[['rec','Recurring']]:[]).map(([v,l])=>`<option value="${v}"${r.type===v?' selected':''}>${l}</option>`).join('');
  const locked=r.type==='rec'&&r.recId!=null;
  const cat=r.type==='exp'||(r.type==='rec'&&!locked)?`<select class="imp-cat" data-k="cat" aria-label="Category">${_impCatOpts.replace(`value="${r.cat}"`,`value="${r.cat}" selected`)}</select>`:'';
  const bill=r.type==='ccpay'?`<div class="imp-billrow"><span>Pays</span>${_impBillSelect(r)}</div>`:'';
  const inflow=r.type==='inc'||r.type==='sal';
  return `<div class="imp-row t-${r.type}${r.dup?' is-dup':''}" data-i="${r.i}">
    <div class="imp-r1"><span class="imp-date">${_impEsc(fmtD(r.date))}</span><span class="imp-amt ${inflow?'in':'out'}">${inflow?'+':'−'}${_impEsc(fmt(r.amount))}${r.cc&&r.type==='exp'?' <span class="imp-tag">CC</span>':''}</span>
      <select class="imp-type" data-k="type" aria-label="Action"${locked?' disabled':''}>${typeOpts}</select></div>
    ${r.type==='skip'?'':`<input class="imp-note" data-k="note" type="text" value="${_impEsc(r.note)}" maxlength="80" aria-label="Note"/>`}
    ${cat}${bill}
    ${r.reason?`<div class="imp-why ${r.type==='skip'?'bad':''}">${_impEsc(r.reason)}</div>`:''}
    <div class="imp-raw" title="${_impEsc(r.raw)}">${_impEsc(r.raw)}</div>
  </div>`;
}
function _impCounts(){
  const c={exp:0,inc:0,sal:0,ccpay:0,rec:0,skip:0,dup:0,te:0,ti:0,ts:0,tp:0};
  const recSeen=new Set();
  for(const r of impS.list){
    if(r.dup)c.dup++;
    if(r.type==='exp'){c.exp++;c.te+=r.amount;}
    else if(r.type==='inc'){c.inc++;c.ti+=r.amount;}
    else if(r.type==='sal'){c.sal++;c.ts+=r.amount;}
    else if(r.type==='ccpay'){c.ccpay++;c.tp+=r.amount;}
    else if(r.type==='rec'){if(r.recId==null)c.rec++;else if(!recSeen.has(r.recId)){recSeen.add(r.recId);c.rec++;}}
    else c.skip++;
  }
  c.n=c.exp+c.inc+c.sal+c.ccpay+c.rec;
  return c;
}

  </div>`;
}

    </div>`).join('')}</div>`;
}
function impRender(){
  const s=impS;if(!s)return;
  const body=document.getElementById('imp-body'),foot=document.getElementById('imp-foot');
  const title=document.getElementById('imp-title');
  if(s.step==='pick'){
    title.textContent='Import statement';
    foot.innerHTML='';foot.style.display='none';
    body.innerHTML=`
      ${s.error?`<div class="imp-err">${s.error}</div>`:''}
      <div class="imp-hero"><i data-lucide="file-up" style="width:30px;height:30px"></i>
        <div class="imp-h1">Add months of transactions in one go</div>
        <div class="imp-p">Use your bank's <b>CSV / Excel</b> statement, or the Excel <b>template</b> for full control. You'll review everything before anything is saved.</div>
        <label class="imp-pick" for="imp-file"><i data-lucide="upload" class="ic-sm"></i>Choose file</label>
        <input id="imp-file" type="file" onchange="impOnFile(this)" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"/>
      </div>
      <label class="imp-cc"><input type="checkbox" id="imp-cc" ${s.cc?'checked':''} onchange="impS.cc=this.checked"/><span><b>This is a credit-card statement.</b> Purchases are imported as “Paid with CC” (counted when you pay the bill); payments and refunds are skipped.</span></label>

document.addEventListener('change',e=>{

      impS.headerRow=hr;impS.map=ImpCore.classifyHeader(impS.rows[hr]||[]);
    }else{impS.map[role]=t.value===''?undefined:parseInt(t.value);}
    impBuild();return;
  }
  if(t.dataset&&t.dataset.g!==undefined&&impS.recs.length){
    const g=impS.recs[+t.dataset.g];if(!g)return;
    if(t.type==='checkbox'){
      g.enabled=t.checked;
      impS.list.forEach(r=>{
        if(g.rowIs.includes(r.i)&&(r.type==='rec'||r.type==='exp')){
          if(g.enabled){r.type='rec';r.recId=g.id;r.reason='Part of recurring “'+g.name+'”';}
          else{r.type='exp';r.recId=null;r.reason='';}
        }
      });
      document.getElementById('imp-recs-wrap').innerHTML=_impRecsHTML();
      if(window.lucide)lucide.createIcons();
      impRenderList();impRenderFoot();
    }else{g.ongoing=t.value==='1';}
    return;
  }
  const row=t.closest&&t.closest('.imp-row');if(!row)return;
  const r=impS.list.find(x=>x.i===+row.dataset.i);if(!r)return;
  if(t.dataset.k==='type'){
    r.type=t.value;
    if(r.type==='skip'){if(!r.reason||!r.dup)r.reason='Skipped by you';}
    else{
      if(r.dup)r.reason='Duplicate check overridden';
      else if(/^Skipped by you|^Salary already set/.test(r.reason))r.reason='';
      if(r.type==='sal'&&(state.salaries[r.date.slice(0,7)]||0)>0)r.reason='Will replace the salary already set for this month';
      if(r.type==='ccpay'){r.bill=null;r.billAuto=false;_impAssignBills();}
    }
    if(impS.filter==='all'){row.outerHTML=_impRowHTML(r);}else impRenderList();
    impRenderFoot();
  }else if(t.dataset.k==='bill'){
    r.bill=t.value;r.billAuto=false;
  }else if(t.dataset.k==='cat'){
    r.cat=t.value;r.catManual=true;
    let n=0;
    for(const o of impS.list){
      if(o!==r&&o.type==='exp'&&!o.catManual&&o.key&&o.key===r.key){

  }
